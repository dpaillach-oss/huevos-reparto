<script>
/* ==== js/core.js ==== */
/* ============================================================================
 * core.js — Lógica de negocio de "HuevosReparto"
 * ----------------------------------------------------------------------------
 * Contiene TODAS las reglas del negocio (clientes, pedidos habituales,
 * generación semanal, precios congelados, entregas, pagos, deudas e informes).
 *
 * Características:
 *   - JavaScript puro (ES5+), sin dependencias ni DOM: 100% testeable.
 *   - Todas las funciones que modifican datos reciben `state` y lo mutan,
 *     devolviendo un objeto de resultado. La persistencia la maneja db.js.
 *   - Los pedidos guardan su propio `valorUnitario` (precio congelado).
 * ========================================================================== */
(function (root, factory) {
  var api = factory();
  root.HuevosCore = api;
  if (typeof module !== "undefined" && module.exports) { module.exports = api; }
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  /* ---------------------------------------------------------------------- */
  /* Constantes                                                              */
  /* ---------------------------------------------------------------------- */

  var VERSION_DATOS = 1;

  var DIAS = ["LUNES", "MARTES", "MIERCOLES", "JUEVES", "VIERNES", "SABADO", "DOMINGO"];
  var DIAS_LABEL = {
    LUNES: "Lunes", MARTES: "Martes", MIERCOLES: "Miércoles", JUEVES: "Jueves",
    VIERNES: "Viernes", SABADO: "Sábado", DOMINGO: "Domingo"
  };
  var DIAS_CORTOS = { LUNES: "Lun", MARTES: "Mar", MIERCOLES: "Mié", JUEVES: "Jue", VIERNES: "Vie", SABADO: "Sáb", DOMINGO: "Dom" };

  var ESTADOS_PEDIDO = ["PENDIENTE", "EN_REPARTO", "ENTREGADO", "NO_ENTREGADO", "CANCELADO"];
  var ESTADOS_LABEL = {
    PENDIENTE: "Pendiente", EN_REPARTO: "En reparto", ENTREGADO: "Entregado",
    NO_ENTREGADO: "No entregado", CANCELADO: "Cancelado"
  };
  var ESTADOS_CLASE = {
    PENDIENTE: "warn", EN_REPARTO: "info", ENTREGADO: "ok",
    NO_ENTREGADO: "danger", CANCELADO: "muted"
  };

  var MEDIOS_PAGO = ["EFECTIVO", "TRANSFERENCIA", "OTRO"];
  var MEDIOS_LABEL = { EFECTIVO: "Efectivo", TRANSFERENCIA: "Transferencia", OTRO: "Otro" };

  var TIPOS_PEDIDO = ["HABITUAL", "EXTRAORDINARIO"];
  var TIPOS_LABEL = { HABITUAL: "Habitual", EXTRAORDINARIO: "Extraordinario" };

  var MESES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio",
    "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

  /* ---------------------------------------------------------------------- */
  /* Utilidades de fecha / número                                            */
  /* ---------------------------------------------------------------------- */

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  /** Date -> "YYYY-MM-DD" (hora local) */
  function isoDate(d) {
    var f = d instanceof Date ? d : new Date(d);
    return f.getFullYear() + "-" + pad2(f.getMonth() + 1) + "-" + pad2(f.getDate());
  }

  /** "YYYY-MM-DD" -> Date local a medianoche */
  function parseISO(s) {
    if (s instanceof Date) { return new Date(s.getFullYear(), s.getMonth(), s.getDate()); }
    var p = String(s).slice(0, 10).split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 0, 0, 0, 0);
  }

  function hoyISO() { return isoDate(new Date()); }

  function addDays(d, n) {
    var f = parseISO(isoDate(d));
    f.setDate(f.getDate() + n);
    return f;
  }

  function ahoraISO() { return new Date().toISOString(); }

  function formatMiles(n) {
    var num = Math.round(Number(n) || 0);
    var s = String(Math.abs(num)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (num < 0 ? "-" : "") + s;
  }

  function formatCLP(n) { return "$" + formatMiles(n); }

  function formatFechaCorta(isoStr) {
    if (!isoStr) { return "—"; }
    var d = parseISO(isoStr);
    return pad2(d.getDate()) + "-" + pad2(d.getMonth() + 1) + "-" + d.getFullYear();
  }

  function formatFechaLarga(isoStr) {
    if (!isoStr) { return "—"; }
    var d = parseISO(isoStr);
    var dias = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
    return dias[d.getDay()] + " " + d.getDate() + " de " + MESES[d.getMonth()] + " de " + d.getFullYear();
  }

  function formatHora(isoStr) {
    if (!isoStr) { return ""; }
    var d = new Date(isoStr);
    if (isNaN(d.getTime())) { return ""; }
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  /* ---------------------------------------------------------------------- */
  /* Semanas (ISO: la semana 1 contiene el 4 de enero, comienza lunes)       */
  /* ---------------------------------------------------------------------- */

  function getISOWeekInfo(date) {
    var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    var dayNum = d.getUTCDay() || 7;              // lunes=1 ... domingo=7
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);    // jueves de esa semana
    var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    var week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return { year: d.getUTCFullYear(), week: week };
  }

  /** Cualquier fecha -> clave de semana "2026-W39" */
  function weekKeyFromDate(date) {
    var info = getISOWeekInfo(parseISO(isoDate(date)));
    return info.year + "-W" + pad2(info.week);
  }

  function weekKeyFromISO(isoStr) { return weekKeyFromDate(parseISO(isoStr)); }

  /** "2026-W39" -> { inicio: Date(lunes), fin: Date(domingo) } */
  function weekRange(key) {
    var m = /^(\d{4})-W(\d{1,2})$/.exec(String(key));
    if (!m) { throw new Error("Semana inválida: " + key); }
    var year = Number(m[1]), week = Number(m[2]);
    var jan4 = new Date(year, 0, 4);
    var jan4Dow = jan4.getDay() || 7;
    var week1Monday = new Date(year, 0, 4 - (jan4Dow - 1));
    var inicio = new Date(week1Monday.getFullYear(), week1Monday.getMonth(), week1Monday.getDate() + (week - 1) * 7);
    var fin = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + 6);
    return { inicio: inicio, fin: fin };
  }

  /** "2026-W39" -> "Semana del 21 al 27 de Septiembre de 2026" */
  function weekLabel(key) {
    var r = weekRange(key);
    var mismoMes = r.inicio.getMonth() === r.fin.getMonth();
    var txt = mismoMes
      ? r.inicio.getDate() + " al " + r.fin.getDate() + " de " + MESES[r.fin.getMonth()]
      : r.inicio.getDate() + " de " + MESES[r.inicio.getMonth()] + " al " + r.fin.getDate() + " de " + MESES[r.fin.getMonth()];
    return "Semana del " + txt + " de " + r.fin.getFullYear();
  }

  function shiftWeek(key, n) {
    var r = weekRange(key);
    return weekKeyFromDate(addDays(r.inicio, n * 7));
  }

  /** Fecha (ISO) del día indicado dentro de la semana. Ej: ("2026-W39","MIERCOLES") */
  function diaDeLaSemana(key, diaNombre) {
    var r = weekRange(key);
    var idx = DIAS.indexOf(String(diaNombre || "").toUpperCase());
    if (idx < 0) { idx = 0; }
    return isoDate(addDays(r.inicio, idx));
  }

  function nombreDiaDeISO(isoStr) { return DIAS[parseISO(isoStr).getDay() === 0 ? 6 : parseISO(isoStr).getDay() - 1]; }

  function estaEnRango(isoStr, desdeISO, hastaISO) {
    if (!isoStr) { return false; }
    return isoStr >= desdeISO && isoStr <= hastaISO;
  }

  /* ---------------------------------------------------------------------- */
  /* Estado inicial                                                          */
  /* ---------------------------------------------------------------------- */

  function estadoVacio(configExtra) {
    return {
      version: VERSION_DATOS,
      config: {
        nombreEmpresa: "Distribuidora de Huevos",
        valorBandeja: 5000,
        valorCompra: 0,              // valor de compra de la bandeja al proveedor
        diaRepartoPorDefecto: "MIERCOLES",
        usuarioActual: "Repartidor",
        comunas: ["Las Condes", "La Reina", "Ñuñoa", "Vitacura", "Providencia"],
        zonas: [],
        historialPrecios: [],
        historialCostos: [],
        // Punto de partida de la ruta (bodega). Si está definido, la ruta
        // optimizada parte y (opcionalmente) termina aquí.
        direccionBase: "",
        baseLat: null,
        baseLon: null,
        // Aplicación que se abre al pulsar "mapa": "waze" (por defecto) o "google"
        appMapas: "waze",
        // Momento del último cambio de configuración. Vacío = nunca se cambió,
        // así un dispositivo nuevo no pisa la configuración del otro.
        actualizadoEn: ""
      },
      clientes: [],
      pedidos: [],
      pagos: [],
      contador: { cliente: 0, pedido: 0, pago: 0 },
      // Registro de borrados ("lápidas"): permite que al sincronizar entre
      // dispositivos un cliente o pedido eliminado no reaparezca en el otro.
      eliminados: { clientes: [], pedidos: [], pagos: [] },
      creadoEn: ahoraISO(),
      actualizadoEn: ahoraISO()
    };
  }

  function findBy(arr, id) {
    for (var i = 0; i < arr.length; i++) { if (arr[i].id === id) { return arr[i]; } }
    return null;
  }

  function getCliente(state, id) { return findBy(state.clientes, id); }
  function getPedido(state, id) { return findBy(state.pedidos, id); }

  function nombreCompleto(c) {
    if (!c) { return "Cliente eliminado"; }
    return (String(c.nombre || "").trim() + " " + String(c.apellido || "").trim()).trim();
  }

  function direccionCompleta(c) {
    if (!c) { return ""; }
    var linea = [String(c.calle || "").trim(), String(c.numero || "").trim()].filter(Boolean).join(" ");
    return [linea, String(c.comuna || "").trim()].filter(Boolean).join(", ");
  }

  function zonaDe(c) { return (c && (c.zona || c.comuna)) || "Sin zona"; }

  function correlativo(n) { return ("000" + n).slice(-4); }

  /*
   * Firma del dispositivo (2 ó 3 letras) que se agrega al folio.
   * Sin esto, dos dispositivos que empiezan de cero crearían los mismos folios
   * (C-0001, C-0002…) y, al sincronizar, los clientes de uno se pisarían con
   * los del otro. La firma se configura al arrancar (desde db.js) y NO forma
   * parte de los datos, así que cada dispositivo mantiene la suya.
   */
  var firmaDispositivo = "";

  function configurarFirmaDispositivo(firma) {
    firmaDispositivo = String(firma || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 3);
    return firmaDispositivo;
  }

  function firmaActual() { return firmaDispositivo; }

  function siguienteId(state, tipo) {
    var sufijo = firmaDispositivo ? "-" + firmaDispositivo : "";
    if (tipo === "cliente") { state.contador.cliente += 1; return "C-" + correlativo(state.contador.cliente) + sufijo; }
    if (tipo === "pedido") { state.contador.pedido += 1; return "P-" + correlativo(state.contador.pedido) + sufijo; }
    state.contador.pago += 1; return "G-" + correlativo(state.contador.pago) + sufijo;
  }

  /* ---------------------------------------------------------------------- */
  /* CLIENTES                                                                */
  /* ---------------------------------------------------------------------- */

  function normalizarCliente(data) {
    return {
      nombre: String(data.nombre || "").trim(),
      apellido: String(data.apellido || "").trim(),
      telefono: String(data.telefono || "").trim(),
      calle: String(data.calle || "").trim(),
      numero: String(data.numero || "").trim(),
      comuna: String(data.comuna || "").trim(),
      zona: String(data.zona || "").trim(),
      observaciones: String(data.observaciones || "").trim(),
      estado: data.estado === "INACTIVO" ? "INACTIVO" : "ACTIVO",
      ordenManual: Number(data.ordenManual) || 0,
      // Coordenadas para optimizar la ruta (se calculan una vez y se guardan)
      lat: data.lat == null ? null : Number(data.lat),
      lon: data.lon == null ? null : Number(data.lon),
      ubicacionFuente: data.ubicacionFuente || "",
      ubicacionEn: data.ubicacionEn || "",
      pedidoHabitual: {
        activo: !!(data.pedidoHabitual && data.pedidoHabitual.activo),
        bandejas: Math.max(0, parseInt((data.pedidoHabitual && data.pedidoHabitual.bandejas) || 0, 10) || 0),
        dia: (data.pedidoHabitual && data.pedidoHabitual.dia) || "",
        observaciones: (data.pedidoHabitual && data.pedidoHabitual.observaciones) || ""
      }
    };
  }

  function crearCliente(state, data) {
    if (!String(data.nombre || "").trim()) {
      return { ok: false, motivo: "El nombre es obligatorio." };
    }
    var c = normalizarCliente(data);
    c.id = siguienteId(state, "cliente");
    c.creadoEn = ahoraISO();
    c.actualizadoEn = c.creadoEn;
    state.clientes.push(c);
    return { ok: true, cliente: c };
  }

  function actualizarCliente(state, id, data) {
    var c = getCliente(state, id);
    if (!c) { return { ok: false, motivo: "Cliente no encontrado." }; }
    if (!String(data.nombre || "").trim()) {
      return { ok: false, motivo: "El nombre es obligatorio." };
    }
    var actualizado = normalizarCliente(data);
    actualizado.id = c.id;
    actualizado.creadoEn = c.creadoEn;
    actualizado.actualizadoEn = ahoraISO();
    // Los pedidos ya generados NO se tocan (regla: el pedido habitual no altera
    // pedidos existentes; la cantidad se aplica desde la próxima generación).
    var idx = state.clientes.indexOf(c);
    state.clientes[idx] = actualizado;
    return { ok: true, cliente: actualizado };
  }

  /**
   * Elimina varios clientes a la vez. Los que tienen pedidos o pagos no se
   * borran (no se elimina información histórica): se marcan como inactivos.
   */
  function eliminarClientes(state, ids) {
    ids = ids || [];
    var res = { solicitados: ids.length, eliminados: 0, inactivados: 0, inactivadosIds: [], noEncontrados: [] };
    ids.forEach(function (id) {
      var r = eliminarCliente(state, id);
      if (!r.ok) { res.noEncontrados.push(id); return; }
      if (r.eliminado) { res.eliminados++; } else { res.inactivados++; res.inactivadosIds.push(id); }
    });
    state.actualizadoEn = ahoraISO();
    return res;
  }

  /** Marca varios clientes como inactivos sin borrar nada. */
  function inactivarClientes(state, ids) {
    var res = { solicitados: (ids || []).length, inactivados: 0, yaInactivos: 0 };
    (ids || []).forEach(function (id) {
      var c = getCliente(state, id);
      if (!c) { return; }
      if (c.estado === "INACTIVO") { res.yaInactivos++; return; }
      c.estado = "INACTIVO";
      c.actualizadoEn = ahoraISO();
      res.inactivados++;
    });
    state.actualizadoEn = ahoraISO();
    return res;
  }

  /** Reactiva varios clientes. */
  function activarClientes(state, ids) {
    var n = 0;
    (ids || []).forEach(function (id) {
      var c = getCliente(state, id);
      if (c && c.estado !== "ACTIVO") { c.estado = "ACTIVO"; c.actualizadoEn = ahoraISO(); n++; }
    });
    state.actualizadoEn = ahoraISO();
    return { activados: n };
  }

  /* ------------------------- Borrados ("lápidas") -------------------------
   * Cuando se elimina un cliente, pedido o pago sin historial, en vez de
   * borrarlo definitivamente se guarda un registro { id, eliminadoEn }. Eso es
   * lo que permite que el borrado también ocurra en el otro dispositivo al
   * sincronizar, y evita que un respaldo antiguo lo haga reaparecer.
   * ---------------------------------------------------------------------- */

  function listaEliminados(state, tipo) {
    if (!state.eliminados) { state.eliminados = { clientes: [], pedidos: [], pagos: [] }; }
    if (!state.eliminados[tipo]) { state.eliminados[tipo] = []; }
    return state.eliminados[tipo];
  }

  function marcarEliminado(state, tipo, entidad) {
    var lista = listaEliminados(state, tipo);
    var cuando = ahoraISO();
    var registro = lista.filter(function (x) { return x.id === entidad.id; })[0];
    if (registro) { registro.eliminadoEn = cuando; }
    else { lista.push({ id: entidad.id, eliminadoEn: cuando }); }
    state.actualizadoEn = cuando;
    return cuando;
  }

  function estaEliminado(state, tipo, id) {
    return listaEliminados(state, tipo).some(function (x) { return x.id === id; });
  }

  function tieneHistorial(state, clienteId) {
    return state.pedidos.some(function (p) { return p.clienteId === clienteId; }) ||
      state.pagos.some(function (g) { return g.clienteId === clienteId; });
  }

  /** No se elimina información histórica: si hay pedidos/pagos sólo se inactiva. */
  function eliminarCliente(state, id) {
    var c = getCliente(state, id);
    if (!c) { return { ok: false, motivo: "Cliente no encontrado." }; }
    if (tieneHistorial(state, id)) {
      c.estado = "INACTIVO";
      c.actualizadoEn = ahoraISO();
      return {
        ok: true, inactivado: true,
        motivo: "El cliente tiene pedidos o pagos registrados: no se puede eliminar información histórica. Se marcó como INACTIVO."
      };
    }
    marcarEliminado(state, "clientes", c);
    state.clientes = state.clientes.filter(function (x) { return x.id !== id; });
    return { ok: true, eliminado: true, motivo: "Cliente eliminado." };
  }

  /* ---------------------------------------------------------------------- */
  /* PEDIDOS                                                                 */
  /* ---------------------------------------------------------------------- */

  function valorBandejaVigente(state) { return Number(state.config.valorBandeja) || 0; }

  /** Valor de compra al proveedor vigente (costo de la bandeja). */
  function costoVigente(state) { return Number(state.config.valorCompra) || 0; }

  /**
   * Costo de un pedido. Cada pedido guarda el costo que estaba vigente cuando
   * se creó, para que la utilidad histórica no cambie al actualizar el precio
   * del proveedor.
   *
   * Un costo guardado en 0 significa "todavía no registrado" (no "gratis"):
   * en ese caso se usa el costo vigente, para no mostrar utilidades falsas
   * del 100%. Lo mismo para pedidos de respaldos antiguos, que no lo traen.
   */
  function costoDePedido(state, p) {
    if (!p) { return costoVigente(state); }
    var guardado = Number(p.valorCompra);
    return (p.valorCompra != null && guardado > 0) ? guardado : costoVigente(state);
  }

  /** Utilidad de un pedido = (venta - costo) x bandejas */
  function utilidadDePedido(state, p) {
    if (!p || p.estado === "CANCELADO") { return 0; }
    return (Number(p.valorUnitario) - costoDePedido(state, p)) * p.bandejas;
  }

  function buscarPedidoSemanal(state, clienteId, semana, tipo) {
    return state.pedidos.filter(function (p) {
      return p.clienteId === clienteId && p.semana === semana &&
        (!tipo || p.tipo === tipo) && p.estado !== "CANCELADO";
    })[0] || null;
  }

  function tienePedidoSemanal(state, clienteId, semana, tipo) {
    return !!buscarPedidoSemanal(state, clienteId, semana, tipo);
  }

  function calcularEstadoCliente(state, clienteId) {
    var r = resumenCliente(state, clienteId);
    if (r.totalComprado === 0) { return "SIN_MOVIMIENTOS"; }
    if (r.saldo <= 0) { return "PAGADO"; }
    if (r.totalPagado > 0) { return "PAGO_PARCIAL"; }
    return "PENDIENTE";
  }

  /* --------------------------- Generación semanal ------------------------- */

  /**
   * Vista previa de los pedidos de la semana (NO modifica nada).
   * Identifica clientes activos con pedido habitual activo y detecta duplicados.
   */
  function previsualizarGeneracion(state, opts) {
    var semana = opts.semana;
    var valor = opts.valorUnitario != null ? Number(opts.valorUnitario) : valorBandejaVigente(state);
    var rango = weekRange(semana);
    var filas = [], duplicados = [], sinPedido = [];

    var candidatos = state.clientes.filter(function (c) {
      return c.estado === "ACTIVO" && c.pedidoHabitual && c.pedidoHabitual.activo && c.pedidoHabitual.bandejas > 0;
    });

    candidatos.sort(ordenarPorComunaDireccion);

    candidatos.forEach(function (c) {
      if (tienePedidoSemanal(state, c.id, semana, "HABITUAL")) {
        duplicados.push({
          clienteId: c.id, nombre: nombreCompleto(c), comuna: c.comuna,
          motivo: "Este cliente ya tiene un pedido generado para esta semana."
        });
        return;
      }
      var bandejas = c.pedidoHabitual.bandejas;
      filas.push({
        clienteId: c.id,
        semana: semana,
        nombre: nombreCompleto(c),
        comuna: c.comuna,
        zona: zonaDe(c),
        telefono: c.telefono,
        direccion: direccionCompleta(c),
        bandejas: bandejas,
        valorUnitario: valor,
        valorCompra: costoVigente(state),
        total: bandejas * valor,
        fechaEntrega: diaDeLaSemana(semana, c.pedidoHabitual.dia || state.config.diaRepartoPorDefecto),
        tipo: "HABITUAL"
      });
    });

    // Clientes activos con pedido habitual desactivado (informativo)
    state.clientes.forEach(function (c) {
      if (c.estado === "ACTIVO" && !(c.pedidoHabitual && c.pedidoHabitual.activo)) {
        sinPedido.push({ clienteId: c.id, nombre: nombreCompleto(c), comuna: c.comuna });
      }
    });

    var totalBandejas = filas.reduce(function (a, f) { return a + f.bandejas; }, 0);
    return {
      semana: semana,
      rango: { inicio: isoDate(rango.inicio), fin: isoDate(rango.fin) },
      valorUnitario: valor,
      filas: filas,
      duplicados: duplicados,
      sinPedido: sinPedido,
      totales: {
        clientes: filas.length,
        bandejas: totalBandejas,
        venta: filas.reduce(function (a, f) { return a + f.total; }, 0)
      }
    };
  }

  /**
   * Genera los pedidos de la semana. Idempotente: nunca duplica un pedido
   * habitual del mismo cliente en la misma semana.
   */
  function generarPedidos(state, opts) {
    if (!opts || !opts.confirmado) {
      return { ok: false, motivo: "Debe confirmar la generación de pedidos.", requiereConfirmacion: true };
    }
    var previa = previsualizarGeneracion(state, opts);
    var creados = [];
    previa.filas.forEach(function (f) {
      creados.push(insertarPedido(state, {
        clienteId: f.clienteId,
        semana: opts.semana,
        tipo: "HABITUAL",
        bandejas: f.bandejas,
        valorUnitario: f.valorUnitario,
        valorCompra: f.valorCompra,
        fechaEntrega: f.fechaEntrega
      }));
    });
    state.actualizadoEn = ahoraISO();
    return {
      ok: true,
      creados: creados,
      omitidos: previa.duplicados,
      totales: {
        pedidos: creados.length,
        bandejas: creados.reduce(function (a, p) { return a + p.bandejas; }, 0),
        venta: creados.reduce(function (a, p) { return a + p.total; }, 0)
      }
    };
  }

  function insertarPedido(state, data) {
    var bandejas = Math.max(1, parseInt(data.bandejas, 10) || 0);
    var valor = data.valorUnitario != null ? Number(data.valorUnitario) : valorBandejaVigente(state);
    var p = {
      id: siguienteId(state, "pedido"),
      clienteId: data.clienteId,
      // La semana es obligatoria para poder evitar duplicados: si no viene,
      // se deduce de la fecha de entrega.
      semana: data.semana || (data.fechaEntrega ? weekKeyFromISO(data.fechaEntrega) : weekKeyFromDate(new Date())),
      tipo: data.tipo || "EXTRAORDINARIO",
      bandejas: bandejas,
      valorUnitario: valor,           // ← precio de venta congelado del pedido
      valorCompra: data.valorCompra != null ? Number(data.valorCompra) : costoVigente(state),  // ← costo congelado
      total: bandejas * valor,
      fechaEntrega: data.fechaEntrega,
      estado: data.estado || "PENDIENTE",
      observaciones: data.observaciones || "",
      entregadoEn: null,
      entregadoPor: null,
      creadoEn: ahoraISO(),
      actualizadoEn: ahoraISO()
    };
    state.pedidos.push(p);
    state.actualizadoEn = ahoraISO();
    return p;
  }

  /** Pedido extraordinario: no proviene del pedido habitual. */
  function crearPedidoExtraordinario(state, data) {
    var c = getCliente(state, data.clienteId);
    if (!c) { return { ok: false, motivo: "Debe seleccionar un cliente." }; }
    var bandejas = parseInt(data.bandejas, 10);
    if (!bandejas || bandejas < 1) { return { ok: false, motivo: "La cantidad de bandejas debe ser mayor a cero." }; }
    if (tienePedidoSemanal(state, c.id, data.semana, "EXTRAORDINARIO")) {
      return {
        ok: false, duplicado: true,
        motivo: "Este cliente ya tiene un pedido extraordinario generado para esta semana. Puede modificar el existente."
      };
    }
    var valor = data.valorUnitario != null ? Number(data.valorUnitario) : valorBandejaVigente(state);
    var p = insertarPedido(state, {
      clienteId: c.id,
      semana: data.semana,
      tipo: "EXTRAORDINARIO",
      bandejas: bandejas,
      valorUnitario: valor,
      valorCompra: data.valorCompra,
      fechaEntrega: data.fechaEntrega || hoyISO(),
      observaciones: data.observaciones || ""
    });
    return { ok: true, pedido: p };
  }

  /**
   * Modificación excepcional de un pedido (sólo esa semana).
   * El precio se mantiene congelado al valor con que fue creado.
   */
  function modificarPedido(state, pedidoId, cambios) {
    var p = getPedido(state, pedidoId);
    if (!p) { return { ok: false, motivo: "Pedido no encontrado." }; }
    if (cambios.bandejas != null) {
      var b = parseInt(cambios.bandejas, 10);
      if (!b || b < 1) { return { ok: false, motivo: "La cantidad de bandejas debe ser mayor a cero." }; }
      p.bandejas = b;
    }
    if (cambios.fechaEntrega) { p.fechaEntrega = cambios.fechaEntrega; }
    if (cambios.observaciones != null) { p.observaciones = cambios.observaciones; }
    if (cambios.actualizarPrecio && cambios.valorUnitario != null) {
      p.valorUnitario = Number(cambios.valorUnitario);
    }
    if (cambios.actualizarCosto && cambios.valorCompra != null) {
      p.valorCompra = Number(cambios.valorCompra);
    }
    p.total = p.bandejas * p.valorUnitario;   // recálculo con el precio del pedido
    p.actualizadoEn = ahoraISO();
    state.actualizadoEn = p.actualizadoEn;
    return { ok: true, pedido: p };
  }

  function cambiarEstadoPedido(state, pedidoId, estado, usuario) {
    var p = getPedido(state, pedidoId);
    if (!p) { return { ok: false, motivo: "Pedido no encontrado." }; }
    if (ESTADOS_PEDIDO.indexOf(estado) < 0) { return { ok: false, motivo: "Estado inválido." }; }
    p.estado = estado;
    if (estado === "ENTREGADO") {
      p.entregadoEn = p.entregadoEn || ahoraISO();
      p.entregadoPor = usuario || state.config.usuarioActual || "Repartidor";
    }
    p.actualizadoEn = ahoraISO();
    state.actualizadoEn = p.actualizadoEn;
    return { ok: true, pedido: p };
  }

  function marcarEntregado(state, pedidoId, usuario) {
    return cambiarEstadoPedido(state, pedidoId, "ENTREGADO", usuario);
  }

  function eliminarPedido(state, pedidoId) {
    var p = getPedido(state, pedidoId);
    if (!p) { return { ok: false, motivo: "Pedido no encontrado." }; }
    marcarEliminado(state, "pedidos", p);
    state.pedidos = state.pedidos.filter(function (x) { return x.id !== pedidoId; });
    return { ok: true, pedido: p };
  }

  function listarPedidos(state, filtros) {
    filtros = filtros || {};
    var lista = state.pedidos.slice();
    if (filtros.semana) { lista = lista.filter(function (p) { return p.semana === filtros.semana; }); }
    if (filtros.fecha) { lista = lista.filter(function (p) { return p.fechaEntrega === filtros.fecha; }); }
    if (filtros.clienteId) { lista = lista.filter(function (p) { return p.clienteId === filtros.clienteId; }); }
    if (filtros.estado) { lista = lista.filter(function (p) { return p.estado === filtros.estado; }); }
    if (filtros.tipo) { lista = lista.filter(function (p) { return p.tipo === filtros.tipo; }); }
    if (filtros.comuna) { lista = lista.filter(function (p) { var c = getCliente(state, p.clienteId); return c && c.comuna === filtros.comuna; }); }
    if (filtros.zona) { lista = lista.filter(function (p) { var c = getCliente(state, p.clienteId); return c && zonaDe(c) === filtros.zona; }); }
    if (filtros.texto) {
      var t = String(filtros.texto).toLowerCase();
      lista = lista.filter(function (p) {
        var c = getCliente(state, p.clienteId);
        return c && (nombreCompleto(c).toLowerCase().indexOf(t) >= 0 || String(c.comuna || "").toLowerCase().indexOf(t) >= 0);
      });
    }
    lista.sort(function (a, b) {
      return (a.fechaEntrega || "").localeCompare(b.fechaEntrega || "") || a.id.localeCompare(b.id);
    });
    return lista;
  }

  /* ---------------------- Orden y búsqueda de clientes -------------------- */

  /**
   * Primer apellido del cliente. Si el campo trae dos apellidos ("Pérez Soto")
   * se usa sólo el primero. Sin apellido se ordena por el nombre.
   */
  function primerApellido(c) {
    var apellido = String((c && c.apellido) || "").trim();
    if (apellido) { return apellido.split(/\s+/)[0]; }
    return String((c && c.nombre) || "").trim();
  }

  function claveOrdenCliente(c) {
    return [primerApellido(c), c && c.nombre, c && c.apellido].join(" ").toLowerCase();
  }

  /** modos: "apellido" (por defecto), "nombre", "comuna", "comuna-apellido" */
  function compararClientes(a, b, modo) {
    modo = modo || "apellido";
    var r;
    if (modo === "nombre" || modo === "nombre-apellido") {
      r = String(a.nombre || "").localeCompare(String(b.nombre || ""), "es");
      if (r !== 0) { return r; }
      return claveOrdenCliente(a).localeCompare(claveOrdenCliente(b), "es");
    }
    if (modo === "comuna" || modo === "comuna-apellido") {
      r = String(a.comuna || "").localeCompare(String(b.comuna || ""), "es");
      if (r !== 0) { return r; }
      return claveOrdenCliente(a).localeCompare(claveOrdenCliente(b), "es");
    }
    return claveOrdenCliente(a).localeCompare(claveOrdenCliente(b), "es");
  }

  /** Texto comparable sin tildes ni mayúsculas (permite buscar "munoz" = "Muñoz"). */
  function textoComparable(texto) { return normalizarClave(texto); }

  /** ¿El texto contiene la búsqueda, ignorando tildes, ñ y mayúsculas? */
  function coincideBusqueda(texto, busqueda) {
    return String(textoComparable(texto)).indexOf(textoComparable(busqueda)) >= 0;
  }

  /** Compara textos "a la chilena": sin distinguir mayúsculas y con la ñ en su lugar. */
  function compararTexto(x, y) {
    return String(x == null ? "" : x).localeCompare(String(y == null ? "" : y), "es", { sensitivity: "base" });
  }

  /**
   * Número de calle como número, para que 90 vaya antes que 100 y no después.
   * Sin número, va al final.
   */
  function numeroDeCalle(valor) {
    var soloDigitos = String(valor == null ? "" : valor).replace(/[^0-9]/g, "");
    if (!soloDigitos) { return 9999999; }
    return parseInt(soloDigitos, 10);
  }

  /**
   * Orden para repartir e imprimir: comuna, luego (si hay un orden manual
   * definido) ese orden, luego la calle y por último el número de casa.
   * Así la hoja del informe se recorre de arriba hacia abajo sin volver atrás.
   */
  function ordenarPorComunaDireccion(a, b) {
    var porComuna = compararTexto(a.comuna || "Sin comuna", b.comuna || "Sin comuna");
    if (porComuna !== 0) { return porComuna; }
    var ma = Number(a.ordenManual) || 0, mb = Number(b.ordenManual) || 0;
    if (ma !== mb) { return ma - mb; }
    var porCalle = compararTexto(a.calle, b.calle);
    if (porCalle !== 0) { return porCalle; }
    var na = numeroDeCalle(a.numero), nb = numeroDeCalle(b.numero);
    if (na !== nb) { return na - nb; }
    return compararTexto(nombreCompleto(a), nombreCompleto(b));
  }

  /**
   * RUTA DE REPARTO: pedidos de una fecha agrupados por comuna.
   * orden: "comuna" | "direccion" | "manual" | "estado"
   */
  function rutaDeReparto(state, filtros) {
    filtros = filtros || {};
    var fecha = filtros.fecha || hoyISO();
    var pedidos = state.pedidos.filter(function (p) {
      if (p.fechaEntrega !== fecha) { return false; }
      if (p.estado === "CANCELADO" && filtros.estado !== "CANCELADO") { return false; }
      var c = getCliente(state, p.clienteId);
      if (filtros.comuna && (!c || c.comuna !== filtros.comuna)) { return false; }
      if (filtros.zona && (!c || zonaDe(c) !== filtros.zona)) { return false; }
      if (filtros.estado && p.estado !== filtros.estado) { return false; }
      return true;
    });

    var orden = filtros.orden || "comuna";
    pedidos.sort(function (a, b) {
      var ca = getCliente(state, a.clienteId) || {}, cb = getCliente(state, b.clienteId) || {};
      // Si el día tiene un orden optimizado (menor distancia), manda ese.
      var oa = a.ordenRuta == null ? null : Number(a.ordenRuta);
      var ob = b.ordenRuta == null ? null : Number(b.ordenRuta);
      if (oa != null && ob != null) { return oa - ob; }
      if (oa != null) { return -1; }
      if (ob != null) { return 1; }
      if (orden === "direccion") {
        return compararTexto(ca.calle, cb.calle) || (numeroDeCalle(ca.numero) - numeroDeCalle(cb.numero));
      }
      if (orden === "manual") { return (Number(ca.ordenManual) || 0) - (Number(cb.ordenManual) || 0); }
      if (orden === "estado") { return ESTADOS_PEDIDO.indexOf(a.estado) - ESTADOS_PEDIDO.indexOf(b.estado); }
      return ordenarPorComunaDireccion(ca, cb);
    });

    // Lista plana en el orden definitivo del recorrido (con la distancia de cada
    // tramo), que es lo que se muestra cuando la ruta está optimizada.
    var secuencia = pedidos.map(function (p, i) {
      return {
        numero: i + 1,
        pedido: p,
        cliente: getCliente(state, p.clienteId) || {},
        kmTramo: p.kmTramo == null ? null : Number(p.kmTramo),
        kmVuelta: Number(p.kmVuelta) || 0
      };
    });
    var optimizada = pedidos.length > 0 && pedidos.every(function (p) { return p.ordenRuta != null; });
    var distanciaIda = secuencia.reduce(function (a, x) { return a + (x.kmTramo || 0); }, 0);
    var kmVueltaBase = pedidos.reduce(function (a, p) { return a + (Number(p.kmVuelta) || 0); }, 0);
    var distanciaKm = distanciaIda + kmVueltaBase;   // incluye el regreso a la bodega

    var grupos = [];
    pedidos.forEach(function (p) {
      var c = getCliente(state, p.clienteId) || {};
      var nombreComuna = c.comuna || "Sin comuna";
      if (filtros.comuna) { nombreComuna = c.comuna || "Sin comuna"; }
      var g = null;
      for (var i = 0; i < grupos.length; i++) { if (grupos[i].comuna === nombreComuna) { g = grupos[i]; break; } }
      if (!g) { g = { comuna: nombreComuna, pedidos: [], bandejas: 0, total: 0 }; grupos.push(g); }
      g.pedidos.push(p);
      g.bandejas += p.bandejas;
      g.total += p.total;
    });

    var resumen = {
      optimizada: optimizada,
      distanciaKm: Math.round(distanciaKm * 10) / 10,
      distanciaIdaKm: Math.round(distanciaIda * 10) / 10,
      kmVueltaBase: Math.round(kmVueltaBase * 10) / 10,
      vuelveBase: kmVueltaBase > 0,
      pedidos: pedidos.length,
      bandejas: pedidos.reduce(function (a, p) { return a + p.bandejas; }, 0),
      total: pedidos.reduce(function (a, p) { return a + p.total; }, 0),
      entregados: pedidos.filter(function (p) { return p.estado === "ENTREGADO"; }).length,
      pendientes: pedidos.filter(function (p) { return p.estado === "PENDIENTE" || p.estado === "EN_REPARTO"; }).length,
      noEntregados: pedidos.filter(function (p) { return p.estado === "NO_ENTREGADO"; }).length,
      comunas: grupos.length
    };
    return { fecha: fecha, grupos: grupos, secuencia: secuencia, pedidos: pedidos, resumen: resumen };
  }

  /**
   * INFORME DEL PEDIDO SEMANAL agrupado por comuna (para imprimir).
   * Devuelve los grupos con sus pedidos, subtotales por comuna y totales
   * generales. Las filas quedan numeradas para usar el informe en papel.
   */
  function informePedidoSemanal(state, semana, opciones) {
    opciones = opciones || {};
    var rango = weekRange(semana);
    var filas = state.pedidos.filter(function (p) {
      return p.semana === semana && p.estado !== "CANCELADO";
    }).map(function (p) {
      return { pedido: p, cliente: getCliente(state, p.clienteId) };
    }).filter(function (f) { return !!f.cliente; });

    filas.sort(function (a, b) { return ordenarPorComunaDireccion(a.cliente, b.cliente); });

    var grupos = [];
    var totales = { clientes: filas.length, bandejas: 0, venta: 0, costo: 0, utilidad: 0, comunas: 0 };
    filas.forEach(function (f) {
      var nombre = f.cliente.comuna || "Sin comuna";
      var g = null;
      for (var i = 0; i < grupos.length; i++) { if (grupos[i].comuna === nombre) { g = grupos[i]; break; } }
      if (!g) { g = { comuna: nombre, filas: [], bandejas: 0, venta: 0, utilidad: 0 }; grupos.push(g); }
      var utilidad = utilidadDePedido(state, f.pedido);
      g.filas.push({
        numero: g.filas.length + 1,
        pedido: f.pedido,
        cliente: f.cliente,
        utilidad: utilidad
      });
      g.bandejas += f.pedido.bandejas;
      g.venta += f.pedido.total;
      g.utilidad += utilidad;
      totales.bandejas += f.pedido.bandejas;
      totales.venta += f.pedido.total;
      totales.utilidad += utilidad;
    });
    totales.comunas = grupos.length;
    totales.costo = totales.venta - totales.utilidad;

    // Si todos los pedidos de la semana tienen el mismo precio, la hoja impresa
    // no necesita la columna de precio unitario (gana ancho para la dirección).
    var precios = {};
    filas.forEach(function (f) { precios[f.pedido.valorUnitario] = true; });
    var precioUnico = Object.keys(precios).length <= 1;

    return {
      semana: semana,
      etiqueta: weekLabel(semana),
      desde: isoDate(rango.inicio),
      hasta: isoDate(rango.fin),
      grupos: grupos,
      totales: totales,
      precioUnico: precioUnico,
      preciosDistintos: Object.keys(precios).length,
      precioVenta: filas.length ? filas[0].pedido.valorUnitario : (Number(state.config.valorBandeja) || 0),
      ordenadoPor: "comuna y dirección",
      empresa: state.config.nombreEmpresa,
      valorVenta: valorBandejaVigente(state),
      valorCompra: costoVigente(state),
      incluirUtilidad: !!opciones.incluirUtilidad
    };
  }

  /* ---------------------------------------------------------------------- */
  /* PAGOS                                                                   */
  /* ---------------------------------------------------------------------- */

  function registrarPago(state, data) {
    var c = getCliente(state, data.clienteId);
    if (!c) { return { ok: false, motivo: "Debe seleccionar un cliente." }; }
    var monto = Math.round(Number(data.monto) || 0);
    if (monto <= 0) { return { ok: false, motivo: "El monto debe ser mayor a cero." }; }
    var medio = MEDIOS_PAGO.indexOf(data.medio) >= 0 ? data.medio : "EFECTIVO";
    var g = {
      id: siguienteId(state, "pago"),
      clienteId: c.id,
      fecha: data.fecha || hoyISO(),
      monto: monto,
      medio: medio,
      observaciones: data.observaciones || "",
      pedidoId: data.pedidoId || null,
      registradoPor: data.registradoPor || state.config.usuarioActual || "Repartidor",
      creadoEn: ahoraISO()
    };
    g.actualizadoEn = g.creadoEn;
    state.pagos.push(g);
    state.actualizadoEn = g.creadoEn;
    return { ok: true, pago: g, resumen: resumenCliente(state, c.id) };
  }

  function eliminarPago(state, pagoId) {
    var g = findBy(state.pagos, pagoId);
    if (!g) { return { ok: false, motivo: "Pago no encontrado." }; }
    marcarEliminado(state, "pagos", g);
    state.pagos = state.pagos.filter(function (x) { return x.id !== pagoId; });
    return { ok: true, pago: g };
  }

  function listarPagos(state, filtros) {
    filtros = filtros || {};
    var lista = state.pagos.slice();
    if (filtros.clienteId) { lista = lista.filter(function (g) { return g.clienteId === filtros.clienteId; }); }
    if (filtros.desde) { lista = lista.filter(function (g) { return g.fecha >= filtros.desde; }); }
    if (filtros.hasta) { lista = lista.filter(function (g) { return g.fecha <= filtros.hasta; }); }
    lista.sort(function (a, b) { return (b.fecha || "").localeCompare(a.fecha || "") || b.id.localeCompare(a.id); });
    return lista;
  }

  /* ---------------------------------------------------------------------- */
  /* CÁLCULOS / DEUDAS / INFORMES                                            */
  /* ---------------------------------------------------------------------- */

  function totalComprado(state, clienteId) {
    return state.pedidos
      .filter(function (p) { return p.clienteId === clienteId && p.estado !== "CANCELADO"; })
      .reduce(function (a, p) { return a + p.total; }, 0);
  }

  function totalPagado(state, clienteId) {
    return state.pagos
      .filter(function (g) { return g.clienteId === clienteId; })
      .reduce(function (a, g) { return a + g.monto; }, 0);
  }

  /** DEUDA = TOTAL PEDIDOS - TOTAL PAGOS */
  function resumenCliente(state, clienteId) {
    var comprado = totalComprado(state, clienteId);
    var pagado = totalPagado(state, clienteId);
    var saldo = comprado - pagado;
    var estado = comprado === 0 ? "SIN_MOVIMIENTOS" : (saldo <= 0 ? "PAGADO" : (pagado > 0 ? "PAGO_PARCIAL" : "PENDIENTE"));
    return {
      clienteId: clienteId,
      totalComprado: comprado,
      totalPagado: pagado,
      saldo: saldo,
      estado: estado,
      deuda: saldo > 0 ? saldo : 0
    };
  }

  function informeDeudas(state) {
    var filas = state.clientes.map(function (c) {
      var r = resumenCliente(state, c.id);
      return {
        clienteId: c.id, nombre: nombreCompleto(c), telefono: c.telefono, comuna: c.comuna,
        estadoCliente: c.estado, zona: zonaDe(c),
        totalComprado: r.totalComprado, totalPagado: r.totalPagado, saldo: r.saldo,
        estadoPago: r.estado
      };
    }).filter(function (f) { return f.saldo > 0; });

    filas.sort(function (a, b) { return b.saldo - a.saldo; });
    return {
      filas: filas,
      totalDeudores: filas.length,
      deudaTotal: filas.reduce(function (a, f) { return a + f.saldo; }, 0),
      totalComprado: filas.reduce(function (a, f) { return a + f.totalComprado; }, 0),
      totalPagado: filas.reduce(function (a, f) { return a + f.totalPagado; }, 0)
    };
  }

  function informeSemanal(state, semana) {
    var rango = weekRange(semana);
    var desde = isoDate(rango.inicio), hasta = isoDate(rango.fin);
    var pedidos = state.pedidos.filter(function (p) { return p.semana === semana && p.estado !== "CANCELADO"; });
    var pagosSemana = state.pagos.filter(function (g) { return estaEnRango(g.fecha, desde, hasta); });
    var clientesSet = {};
    pedidos.forEach(function (p) { clientesSet[p.clienteId] = true; });

    var vendido = pedidos.reduce(function (a, p) { return a + p.total; }, 0);
    var cobrado = pagosSemana.reduce(function (a, g) { return a + g.monto; }, 0);
    return {
      semana: semana,
      desde: desde,
      hasta: hasta,
      etiqueta: weekLabel(semana),
      clientesAtendidos: Object.keys(clientesSet).length,
      pedidosGenerados: pedidos.length,
      pedidosHabituales: pedidos.filter(function (p) { return p.tipo === "HABITUAL"; }).length,
      pedidosExtraordinarios: pedidos.filter(function (p) { return p.tipo === "EXTRAORDINARIO"; }).length,
      bandejasVendidas: pedidos.reduce(function (a, p) { return a + p.bandejas; }, 0),
      totalVendido: vendido,
      totalCobrado: cobrado,
      totalPendienteSemana: vendido - cobrado,
      deudaTotalGlobal: informeDeudas(state).deudaTotal,
      pedidosEntregados: pedidos.filter(function (p) { return p.estado === "ENTREGADO"; }).length,
      pedidosPendientes: pedidos.filter(function (p) { return p.estado === "PENDIENTE" || p.estado === "EN_REPARTO"; }).length,
      pedidosNoEntregados: pedidos.filter(function (p) { return p.estado === "NO_ENTREGADO"; }).length,
      pagos: pagosSemana
    };
  }

  /* ---------------------- Utilidad (venta vs. compra) --------------------- */

  function moverUtilidad(state, pedidos) {
    var venta = 0, costo = 0, bandejas = 0;
    pedidos.forEach(function (p) {
      venta += p.total;
      costo += costoDePedido(state, p) * p.bandejas;
      bandejas += p.bandejas;
    });
    var utilidad = venta - costo;
    return {
      pedidos: pedidos.length,
      bandejas: bandejas,
      venta: venta,
      costo: costo,
      utilidad: utilidad,
      margen: venta > 0 ? Math.round((utilidad / venta) * 1000) / 10 : 0,
      utilidadPorBandeja: bandejas > 0 ? Math.round(utilidad / bandejas) : 0
    };
  }

  /** Informe de utilidad de una semana (venta, costo de compra y utilidad). */
  function informeUtilidad(state, semana) {
    var rango = weekRange(semana);
    var pedidos = state.pedidos.filter(function (p) { return p.semana === semana && p.estado !== "CANCELADO"; });
    var datos = moverUtilidad(state, pedidos);
    datos.semana = semana;
    datos.etiqueta = weekLabel(semana);
    datos.desde = isoDate(rango.inicio);
    datos.hasta = isoDate(rango.fin);
    datos.valorVenta = valorBandejaVigente(state);
    datos.valorCompra = costoVigente(state);
    datos.preciosRegistrados = costoVigente(state) > 0;
    datos.cobrado = state.pagos
      .filter(function (g) { return estaEnRango(g.fecha, datos.desde, datos.hasta); })
      .reduce(function (a, g) { return a + g.monto; }, 0);
    datos.pendiente = datos.venta - datos.cobrado;
    return datos;
  }

  /** Informe de utilidad por mes (los últimos N meses con movimientos). */
  function informesUtilidadMensual(state, cantidad) {
    var porMes = {};
    state.pedidos.forEach(function (p) {
      if (p.estado === "CANCELADO") { return; }
      var mes = String(p.fechaEntrega || "").slice(0, 7) || "sin-fecha";
      if (!porMes[mes]) { porMes[mes] = []; }
      porMes[mes].push(p);
    });
    var meses = Object.keys(porMes).sort().reverse();
    if (cantidad) { meses = meses.slice(0, cantidad); }
    return meses.map(function (mes) {
      var datos = moverUtilidad(state, porMes[mes]);
      datos.mes = mes;
      datos.etiqueta = mes.indexOf("-") > 0
        ? (MESES[Number(mes.slice(5, 7)) - 1] + " " + mes.slice(0, 4))
        : "Sin fecha";
      return datos;
    });
  }

  function dashboard(state, semana) {
    var rango = weekRange(semana);
    var desde = isoDate(rango.inicio), hasta = isoDate(rango.fin);
    var pedidos = state.pedidos.filter(function (p) { return p.semana === semana && p.estado !== "CANCELADO"; });
    var deudas = informeDeudas(state);
    var cobradoSemana = state.pagos
      .filter(function (g) { return estaEnRango(g.fecha, desde, hasta); })
      .reduce(function (a, g) { return a + g.monto; }, 0);
    return {
      semana: semana,
      etiquetaSemana: weekLabel(semana),
      clientesActivos: state.clientes.filter(function (c) { return c.estado === "ACTIVO"; }).length,
      clientesInactivos: state.clientes.filter(function (c) { return c.estado === "INACTIVO"; }).length,
      clientesHabituales: state.clientes.filter(function (c) { return c.estado === "ACTIVO" && c.pedidoHabitual.activo; }).length,
      pedidosSemana: pedidos.length,
      bandejasSemana: pedidos.reduce(function (a, p) { return a + p.bandejas; }, 0),
      totalVendido: pedidos.reduce(function (a, p) { return a + p.total; }, 0),
      totalCobrado: cobradoSemana,
      totalPendiente: deudas.deudaTotal,
      clientesConDeuda: deudas.totalDeudores,
      pendientesEntrega: pedidos.filter(function (p) { return p.estado === "PENDIENTE" || p.estado === "EN_REPARTO"; }).length,
      entregados: pedidos.filter(function (p) { return p.estado === "ENTREGADO"; }).length,
      valorBandeja: valorBandejaVigente(state)
    };
  }

  /* ---------------------------------------------------------------------- */
  /* CONFIGURACIÓN                                                           */
  /* ---------------------------------------------------------------------- */

  /** Cambiar el valor de la bandeja sólo afecta pedidos NUEVOS. */
  function setValorBandeja(state, valor, usuario) {
    var v = Math.round(Number(valor) || 0);
    if (v <= 0) { return { ok: false, motivo: "El valor debe ser mayor a cero." }; }
    var anterior = valorBandejaVigente(state);
    if (anterior === v) { return { ok: true, sinCambios: true, valor: v }; }
    state.config.valorBandeja = v;
    state.config.historialPrecios = state.config.historialPrecios || [];
    state.config.historialPrecios.unshift({ valor: v, valorAnterior: anterior, fecha: ahoraISO(), usuario: usuario || state.config.usuarioActual });
    state.config.actualizadoEn = ahoraISO();
    state.actualizadoEn = state.config.actualizadoEn;
    return {
      ok: true, valor: v, valorAnterior: anterior,
      pedidosHistoricos: state.pedidos.length,
      motivo: "Valor actualizado. Los " + state.pedidos.length + " pedidos ya generados conservan su precio original."
    };
  }

  /**
   * Cambiar el valor de compra al proveedor sólo afecta a los pedidos NUEVOS:
   * los pedidos ya generados mantienen el costo con el que fueron creados, de
   * modo que la utilidad histórica no cambia.
   */
  function setValorCompra(state, valor, usuario) {
    var v = Math.round(Number(valor) || 0);
    if (v < 0) { return { ok: false, motivo: "El valor de compra no puede ser negativo." }; }
    var anterior = costoVigente(state);
    if (anterior === v) { return { ok: true, sinCambios: true, valor: v }; }
    state.config.valorCompra = v;
    state.config.historialCostos = state.config.historialCostos || [];
    state.config.historialCostos.unshift({ valor: v, valorAnterior: anterior, fecha: ahoraISO(), usuario: usuario || state.config.usuarioActual });
    state.config.actualizadoEn = ahoraISO();
    state.actualizadoEn = state.config.actualizadoEn;
    return {
      ok: true, valor: v, valorAnterior: anterior,
      pedidosHistoricos: state.pedidos.length,
      motivo: "Valor de compra actualizado. Los pedidos ya generados conservan su costo anterior (" + formatCLP(anterior) + ")."
    };
  }

  function actualizarConfig(state, cambios) {
    var c = state.config;
    if (cambios.nombreEmpresa != null) { c.nombreEmpresa = String(cambios.nombreEmpresa).trim(); }
    if (cambios.diaRepartoPorDefecto) { c.diaRepartoPorDefecto = cambios.diaRepartoPorDefecto; }
    if (cambios.appMapas != null) {
      c.appMapas = String(cambios.appMapas) === "google" ? "google" : "waze";
    }
    if (cambios.usuarioActual != null) { c.usuarioActual = String(cambios.usuarioActual).trim(); }
    if (cambios.comunas) { c.comunas = cambios.comunas.slice(); }
    if (cambios.zonas) { c.zonas = cambios.zonas.slice(); }
    c.actualizadoEn = ahoraISO();
    state.actualizadoEn = c.actualizadoEn;
    return { ok: true, config: c };
  }

  /* ---------------------------------------------------------------------- */
  /* OPTIMIZACIÓN DE LA RUTA DE REPARTO (menor distancia recorrida)          */
  /* ---------------------------------------------------------------------- */
  /*
   * Para ordenar las entregas por cercanía real hacen falta las coordenadas de
   * cada dirección (se calculan una vez y quedan guardadas en la ficha del
   * cliente). Con ellas:
   *   1. Se busca un primer orden por "vecino más cercano" desde el punto de
   *      partida (la bodega, si está definida).
   *   2. Se mejora con el método 2-opt: se prueban intercambios de tramos y se
   *      conservan los que acortan el recorrido, hasta que ya no se puede.
   * El resultado es siempre igual o mejor que el orden de partida.
   * ---------------------------------------------------------------------- */

  /** Distancia en línea recta entre dos coordenadas, en kilómetros. */
  function distanciaKm(a, b) {
    if (!a || !b) { return 0; }
    var RADIO_TIERRA = 6371;
    function rad(g) { return g * Math.PI / 180; }
    var dLat = rad(b.lat - a.lat);
    var dLon = rad(b.lon - a.lon);
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * RADIO_TIERRA * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  /** Coordenadas de un cliente (null si todavía no se calculan). */
  function coordenadasDe(cliente) {
    if (!cliente) { return null; }
    var lat = Number(cliente.lat), lon = Number(cliente.lon);
    if (!isFinite(lat) || !isFinite(lon) || (lat === 0 && lon === 0)) { return null; }
    return { lat: lat, lon: lon };
  }

  /** Coordenadas del punto de partida (bodega), si está definido. */
  function baseDe(state) {
    var lat = Number(state.config.baseLat), lon = Number(state.config.baseLon);
    if (!isFinite(lat) || !isFinite(lon) || (lat === 0 && lon === 0)) { return null; }
    return { lat: lat, lon: lon, direccion: state.config.direccionBase || "" };
  }

  function redondearKm(n) { return Math.round(n * 10) / 10; }

  /**
   * Largo total de un recorrido, en el orden en que vienen los puntos.
   * `costo` permite usar distancias reales por calle en lugar de la línea recta.
   */
  function largoRecorrido(puntos, base, volverBase, costo) {
    var medir = costo || distanciaKm;
    var total = 0, anterior = base;
    puntos.forEach(function (p) {
      if (anterior) { total += medir(anterior, p); }
      anterior = p;
    });
    if (volverBase && anterior && base) { total += medir(anterior, base); }
    return total;
  }

  /**
   * Ordena las visitas para recorrer la menor distancia posible.
   * Devuelve el orden nuevo y la comparación con el orden actual.
   */
  function optimizarRuta(visitas, opciones) {
    opciones = opciones || {};
    var base = opciones.base || null;
    var volverBase = !!opciones.volverBase;
    var medir = opciones.costo || distanciaKm;   // línea recta o calles reales

    var conCoordenadas = [], sinCoordenadas = [];
    (visitas || []).forEach(function (v) {
      var punto = coordenadasDe(v.cliente);
      if (punto) { conCoordenadas.push({ visita: v, punto: punto }); }
      else { sinCoordenadas.push(v); }
    });

    function largo(secuencia) {
      return largoRecorrido(secuencia.map(function (x) { return x.punto; }), base, volverBase, medir);
    }

    var distanciaInicial = largo(conCoordenadas);

    // 1) Vecino más cercano, partiendo del punto de partida
    var pendientes = conCoordenadas.slice();
    var orden = [];
    var actual = base;
    while (pendientes.length) {
      var mejor = 0, mejorDistancia = Infinity;
      for (var i = 0; i < pendientes.length; i++) {
        var d = actual ? medir(actual, pendientes[i].punto) : 0;
        if (d < mejorDistancia) { mejorDistancia = d; mejor = i; }
      }
      var elegido = pendientes.splice(mejor, 1)[0];
      orden.push(elegido);
      actual = elegido.punto;
    }

    // 2) Mejora 2-opt. Se aplica a dos puntos de partida: el orden del vecino
    //    más cercano y el orden actual, y se conserva el mejor. Así el
    //    resultado NUNCA es peor que el recorrido que ya se tenía.
    function mejorar2opt(secuencia) {
      var actual = secuencia.slice();
      var distanciaActual = largo(actual);
      var mejoro = true, vueltas = 0;
      while (mejoro && vueltas < 60) {
        mejoro = false;
        vueltas += 1;
        for (var a = 0; a < actual.length - 1; a++) {
          for (var b = a + 1; b < actual.length; b++) {
            var prueba = actual.slice(0, a).concat(actual.slice(a, b + 1).reverse(), actual.slice(b + 1));
            var distanciaPrueba = largo(prueba);
            if (distanciaPrueba < distanciaActual - 1e-9) {
              actual = prueba;
              distanciaActual = distanciaPrueba;
              mejoro = true;
            }
          }
        }
      }
      return { secuencia: actual, distancia: distanciaActual };
    }

    var desdeVecino = mejorar2opt(orden);
    var desdeActual = mejorar2opt(conCoordenadas);
    var elegidoFinal = desdeVecino.distancia <= desdeActual.distancia ? desdeVecino : desdeActual;
    orden = elegidoFinal.secuencia;
    var distanciaOrden = elegidoFinal.distancia;

    // Distancia de cada tramo (para mostrar "2,3 km desde la parada anterior")
    var tramos = [], anterior = base;
    orden.forEach(function (x) {
      tramos.push(anterior ? redondearKm(medir(anterior, x.punto)) : 0);
      anterior = x.punto;
    });

    var kmVuelta = (volverBase && base && orden.length)
      ? redondearKm(medir(orden[orden.length - 1].punto, base)) : 0;

    var salida = orden.map(function (x, i) {
      return {
        orden: i + 1,
        pedidoId: x.visita.pedido ? x.visita.pedido.id : x.visita.pedidoId,
        clienteId: x.visita.cliente ? x.visita.cliente.id : x.visita.clienteId,
        lat: x.punto.lat, lon: x.punto.lon,
        kmTramo: tramos[i],
        // El regreso a la bodega se guarda en la última parada
        kmVuelta: (i === orden.length - 1) ? kmVuelta : 0
      };
    });

    return {
      orden: salida,
      sinCoordenadas: sinCoordenadas.map(function (v) {
        return {
          pedidoId: v.pedido ? v.pedido.id : v.pedidoId,
          clienteId: v.cliente ? v.cliente.id : v.clienteId,
          nombre: v.cliente ? nombreCompleto(v.cliente) : ""
        };
      }),
      visitas: salida.length,
      distanciaInicial: redondearKm(distanciaInicial),
      distanciaFinal: redondearKm(distanciaOrden),
      ahorroKm: redondearKm(Math.max(0, distanciaInicial - distanciaOrden)),
      ahorroPorcentaje: distanciaInicial > 0
        ? Math.round((1 - (distanciaOrden / distanciaInicial)) * 100) : 0,
      conBase: !!base,
      volverBase: volverBase,
      kmVuelta: kmVuelta,
      fuenteDistancia: opciones.costo ? "calles" : "linea-recta",
      metodo: "vecino más cercano + 2-opt (sobre el mejor punto de partida)"
    };
  }

  /** Guarda en los pedidos el orden optimizado de ese día. */
  function aplicarOrdenRuta(state, fecha, orden, opciones) {
    opciones = opciones || {};
    var fuente = opciones.fuente === "calles" ? "calles" : "linea-recta";
    var aplicados = 0;
    var porPedido = {};
    (orden || []).forEach(function (o) { porPedido[o.pedidoId] = o; });
    state.pedidos.forEach(function (p) {
      if (p.fechaEntrega !== fecha || p.estado === "CANCELADO") { return; }
      var item = porPedido[p.id];
      if (item) {
        p.ordenRuta = item.orden;
        p.kmTramo = item.kmTramo;
        p.kmVuelta = Number(item.kmVuelta) || 0;
        p.kmFuente = fuente;
        p.actualizadoEn = ahoraISO();
        aplicados += 1;
      } else if (p.ordenRuta != null) {
        delete p.ordenRuta;
        delete p.kmTramo;
        delete p.kmVuelta;
        delete p.kmFuente;
        p.actualizadoEn = ahoraISO();
      }
    });
    state.actualizadoEn = ahoraISO();
    return aplicados;
  }

  /** Vuelve al orden por dirección (quita el orden optimizado de ese día). */
  function limpiarOrdenRuta(state, fecha) {
    var quitados = 0;
    state.pedidos.forEach(function (p) {
      if (p.fechaEntrega !== fecha) { return; }
      if (p.ordenRuta != null) {
        delete p.ordenRuta;
        delete p.kmTramo;
        p.actualizadoEn = ahoraISO();
        quitados += 1;
      }
    });
    if (quitados) { state.actualizadoEn = ahoraISO(); }
    return quitados;
  }

  /** Guarda las coordenadas calculadas de un cliente (se reutilizan siempre). */
  function guardarUbicacion(state, clienteId, lat, lon, fuente) {
    var c = getCliente(state, clienteId);
    if (!c || !isFinite(Number(lat)) || !isFinite(Number(lon))) {
      return { ok: false, motivo: "Coordenadas no válidas." };
    }
    c.lat = Math.round(Number(lat) * 1000000) / 1000000;
    c.lon = Math.round(Number(lon) * 1000000) / 1000000;
    c.ubicacionFuente = fuente || "";
    c.ubicacionEn = ahoraISO();
    c.actualizadoEn = ahoraISO();
    state.actualizadoEn = c.actualizadoEn;
    return { ok: true, cliente: c };
  }

  /** Guarda el punto de partida (bodega). */
  function guardarBase(state, datos) {
    var c = state.config;
    if (datos.direccion != null) { c.direccionBase = String(datos.direccion).trim(); }
    if (datos.lat != null && isFinite(Number(datos.lat))) { c.baseLat = Number(datos.lat); }
    if (datos.lon != null && isFinite(Number(datos.lon))) { c.baseLon = Number(datos.lon); }
    c.actualizadoEn = ahoraISO();
    state.actualizadoEn = c.actualizadoEn;
    return baseDe(state);
  }

  /** Clientes activos sin coordenadas (los que faltan para poder optimizar). */
  function clientesSinUbicacion(state, soloConPedidos) {
    var conPedido = {};
    if (soloConPedidos) {
      state.pedidos.forEach(function (p) {
        if (p.estado !== "CANCELADO") { conPedido[p.clienteId] = true; }
      });
    }
    return state.clientes.filter(function (c) {
      if (soloConPedidos && (c.estado !== "ACTIVO" || !conPedido[c.id])) { return false; }
      return !coordenadasDe(c);
    });
  }

  /* ---------------------------------------------------------------------- */
  /* SINCRONIZACIÓN ENTRE DISPOSITIVOS                                       */
  /* ---------------------------------------------------------------------- */
  /*
   * Cada registro (cliente, pedido, pago) guarda cuándo se creó y cuándo se
   * modificó por última vez. Al sincronizar se unen los dos conjuntos:
   *   - Si un registro existe en un solo dispositivo, se agrega.
   *   - Si existe en los dos, se conserva el que se modificó más recientemente
   *     (última modificación gana).
   *   - Si un registro fue eliminado en uno de los dispositivos, se respeta el
   *     borrado (queda registrado en `eliminados`).
   * El resultado es determinista (mismo contenido, mismo orden) para poder
   * comparar y subir sólo cuando realmente hay cambios.
   * ---------------------------------------------------------------------- */

  /** Lápidas válidas (id + fecha), ordenadas para que el resultado sea estable. */
  function normalizarLapidas(lista) {
    var vista = {};
    (lista || []).forEach(function (x) {
      if (!x || !x.id) { return; }
      var id = String(x.id);
      var cuando = String(x.eliminadoEn || "");
      if (!vista[id] || cuando > vista[id]) { vista[id] = cuando; }
    });
    return Object.keys(vista).sort().map(function (id) {
      return { id: id, eliminadoEn: vista[id] };
    });
  }

  function unirListas(a, b) {
    var vista = {}, salida = [];
    (a || []).concat(b || []).forEach(function (x) {
      var clave = typeof x === "string" ? x : JSON.stringify(x);
      if (vista[clave]) { return; }
      vista[clave] = true;
      salida.push(x);
    });
    return salida;
  }

  /** Momento de la última modificación de un registro. */
  function marcaDe(x) { return String((x && (x.actualizadoEn || x.creadoEn)) || ""); }

  function unirEntidades(local, remoto, tipo, informe) {
    var porId = {}, salida = [];
    (remoto || []).forEach(function (r) { if (r && r.id) { porId[r.id] = r; } });
    var vistos = {};
    (local || []).forEach(function (l) {
      if (!l || !l.id) { return; }
      vistos[l.id] = true;
      var r = porId[l.id];
      if (!r) { salida.push(l); return; }
      if (marcaDe(r) > marcaDe(l)) { informe[tipo] += 1; salida.push(r); }
      else { salida.push(l); }
    });
    (remoto || []).forEach(function (r) {
      if (!r || !r.id || vistos[r.id]) { return; }
      informe[tipo] += 1;
      salida.push(r);
    });
    salida.sort(function (a, b) { return String(a.id) < String(b.id) ? -1 : 1; });
    return salida;
  }

  /**
   * Une el estado local con el que viene del otro dispositivo.
   * Devuelve { estado, informe } con el detalle de lo que cambió.
   */
  function fusionarEstados(local, remoto) {
    local = local || estadoVacio();
    remoto = remoto || estadoVacio();
    var informe = { clientes: 0, pedidos: 0, pagos: 0, eliminados: 0, config: false, cambioTotal: 0 };

    var nuevo = {
      version: VERSION_DATOS,
      config: Object.assign({}, local.config),
      clientes: unirEntidades(local.clientes, remoto.clientes, "clientes", informe),
      pedidos: unirEntidades(local.pedidos, remoto.pedidos, "pedidos", informe),
      pagos: unirEntidades(local.pagos, remoto.pagos, "pagos", informe),
      eliminados: {
        clientes: normalizarLapidas((local.eliminados || {}).clientes || []).concat(((remoto.eliminados || {}).clientes) || []),
        pedidos: normalizarLapidas((local.eliminados || {}).pedidos || []).concat(((remoto.eliminados || {}).pedidos) || []),
        pagos: normalizarLapidas((local.eliminados || {}).pagos || []).concat(((remoto.eliminados || {}).pagos) || [])
      },
      contador: {
        cliente: Math.max(Number(local.contador && local.contador.cliente) || 0, Number(remoto.contador && remoto.contador.cliente) || 0),
        pedido: Math.max(Number(local.contador && local.contador.pedido) || 0, Number(remoto.contador && remoto.contador.pedido) || 0),
        pago: Math.max(Number(local.contador && local.contador.pago) || 0, Number(remoto.contador && remoto.contador.pago) || 0)
      },
      creadoEn: local.creadoEn || remoto.creadoEn || ahoraISO()
    };
    ["clientes", "pedidos", "pagos"].forEach(function (tipo) {
      nuevo.eliminados[tipo] = normalizarLapidas(nuevo.eliminados[tipo]);
    });

    // Los borrados mandan: un registro eliminado no vuelve, salvo que después
    // se haya creado o modificado de nuevo (marca posterior al borrado).
    ["clientes", "pedidos", "pagos"].forEach(function (tipo) {
      var lapidas = {};
      nuevo.eliminados[tipo].forEach(function (x) { lapidas[x.id] = x.eliminadoEn; });
      nuevo[tipo] = nuevo[tipo].filter(function (x) {
        if (!lapidas[x.id]) { return true; }
        if (String(lapidas[x.id]) >= marcaDe(x)) { informe.eliminados += 1; return false; }
        return true;
      });
    });

    // Configuración: la modificada más recientemente. Los historiales y las
    // listas de comunas/zonas se unen (nunca se pierde información).
    var marcaConfigLocal = String((local.config || {}).actualizadoEn || "");
    var marcaConfigRemoto = String((remoto.config || {}).actualizadoEn || "");
    var elegida = marcaConfigRemoto > marcaConfigLocal ? remoto.config : local.config;
    nuevo.config = Object.assign({}, elegida);
    nuevo.config.historialPrecios = unirListas((local.config || {}).historialPrecios, (remoto.config || {}).historialPrecios);
    nuevo.config.historialCostos = unirListas((local.config || {}).historialCostos, (remoto.config || {}).historialCostos);
    nuevo.config.comunas = unirListas((local.config || {}).comunas, (remoto.config || {}).comunas);
    nuevo.config.zonas = unirListas((local.config || {}).zonas, (remoto.config || {}).zonas);
    informe.config = Number(nuevo.config.valorBandeja) !== Number((local.config || {}).valorBandeja) ||
      Number(nuevo.config.valorCompra) !== Number((local.config || {}).valorCompra) ||
      String(nuevo.config.nombreEmpresa) !== String((local.config || {}).nombreEmpresa) ||
      String(nuevo.config.diaRepartoPorDefecto) !== String((local.config || {}).diaRepartoPorDefecto) ||
      String(nuevo.config.usuarioActual) !== String((local.config || {}).usuarioActual);

    informe.cambioTotal = informe.clientes + informe.pedidos + informe.pagos + informe.eliminados + (informe.config ? 1 : 0);

    // La marca del estado sólo avanza si hubo cambios reales: así el documento
    // es comparable y no se sube de más.
    nuevo.actualizadoEn = informe.cambioTotal ? ahoraISO() : String(local.actualizadoEn || remoto.actualizadoEn || ahoraISO());
    return { estado: nuevo, informe: informe, huboCambios: informe.cambioTotal > 0 };
  }

  /**
   * Huella del contenido: mismo contenido → misma huella, sin importar el orden
   * en que se guardaron los datos. Sirve para saber si hay algo que subir.
   */
  function huella(state) {
    state = state || {};
    function canonico(lista) {
      return (lista || []).map(function (x) {
        var copia = {};
        Object.keys(x || {}).sort().forEach(function (k) { copia[k] = x[k]; });
        return JSON.stringify(copia);
      }).sort().join("\n");
    }
    function configCanonica(c) {
      var copia = {};
      Object.keys(c || {}).sort().forEach(function (k) { copia[k] = c[k]; });
      return JSON.stringify(copia);
    }
    return [
      configCanonica(state.config),
      canonico(state.clientes),
      canonico(state.pedidos),
      canonico(state.pagos),
      canonico((state.eliminados || {}).clientes),
      canonico((state.eliminados || {}).pedidos),
      canonico((state.eliminados || {}).pagos),
      JSON.stringify(state.contador || {})
    ].join("|");
  }

  /** Descripción corta de lo que cambió, para mostrar al usuario. */
  function textoInformeFusion(informe) {
    var partes = [];
    if (informe.clientes) { partes.push(informe.clientes + " cliente" + (informe.clientes === 1 ? "" : "s")); }
    if (informe.pedidos) { partes.push(informe.pedidos + " pedido" + (informe.pedidos === 1 ? "" : "s")); }
    if (informe.pagos) { partes.push(informe.pagos + " pago" + (informe.pagos === 1 ? "" : "s")); }
    if (informe.eliminados) { partes.push(informe.eliminados + " eliminado" + (informe.eliminados === 1 ? "" : "s")); }
    if (informe.config) { partes.push("configuración"); }
    return partes.length ? partes.join(", ") : "sin cambios";
  }

  /* ---------------------------------------------------------------------- */
  /* RESPALDO                                                                */
  /* ---------------------------------------------------------------------- */

  function exportar(state) {
    return JSON.stringify({ app: "HuevosReparto", version: VERSION_DATOS, exportadoEn: ahoraISO(), data: state }, null, 2);
  }

  /** Documento que se guarda en el archivo compartido entre dispositivos. */
  function documento(state) {
    return {
      app: "HuevosReparto",
      version: VERSION_DATOS,
      generadoEn: ahoraISO(),
      dispositivo: (state.sync && state.sync.dispositivo) || "",
      data: state
    };
  }

  /** Valida y normaliza un respaldo. Lanza Error con mensaje claro si es inválido. */
  function importar(texto) {
    var obj;
    try { obj = typeof texto === "string" ? JSON.parse(texto) : texto; }
    catch (e) { throw new Error("El archivo no es un JSON válido."); }
    var data = obj && obj.data ? obj.data : obj;
    if (!data || typeof data !== "object") { throw new Error("El respaldo no contiene datos."); }
    if (!Array.isArray(data.clientes) || !Array.isArray(data.pedidos) || !Array.isArray(data.pagos)) {
      throw new Error("El respaldo está incompleto: faltan clientes, pedidos o pagos.");
    }
    var base = estadoVacio();
    var config = Object.assign(base.config, data.config || {});
    config.actualizadoEn = (data.config && data.config.actualizadoEn) || "";
    var estado = {
      version: VERSION_DATOS,
      config: config,
      clientes: data.clientes.map(function (c) {
        var n = normalizarCliente(c);
        n.id = c.id; n.creadoEn = c.creadoEn || ahoraISO(); n.actualizadoEn = c.actualizadoEn || ahoraISO();
        return n;
      }),
      pedidos: data.pedidos.map(function (p) {
        var bandejas = Math.max(1, parseInt(p.bandejas, 10) || 1);
        var valor = Number(p.valorUnitario) || 0;
        return {
          id: p.id, clienteId: p.clienteId, semana: p.semana, tipo: p.tipo || "HABITUAL",
          bandejas: bandejas, valorUnitario: valor, total: Number(p.total) || bandejas * valor,
          // Costo de compra del pedido (respaldo antiguo sin costo: se usa el vigente)
          valorCompra: p.valorCompra != null ? Number(p.valorCompra) : costoVigente({ config: config }),
          fechaEntrega: p.fechaEntrega, estado: ESTADOS_PEDIDO.indexOf(p.estado) >= 0 ? p.estado : "PENDIENTE",
          observaciones: p.observaciones || "", entregadoEn: p.entregadoEn || null,
          entregadoPor: p.entregadoPor || null, creadoEn: p.creadoEn || ahoraISO(), actualizadoEn: p.actualizadoEn || ahoraISO()
        };
      }).filter(function (p) { return p.clienteId; }),
      pagos: data.pagos.map(function (g) {
        return {
          id: g.id, clienteId: g.clienteId, fecha: g.fecha, monto: Math.round(Number(g.monto) || 0),
          medio: MEDIOS_PAGO.indexOf(g.medio) >= 0 ? g.medio : "OTRO", observaciones: g.observaciones || "",
          pedidoId: g.pedidoId || null, registradoPor: g.registradoPor || "",
          creadoEn: g.creadoEn || ahoraISO(), actualizadoEn: g.actualizadoEn || g.creadoEn || ahoraISO()
        };
      }).filter(function (g) { return g.clienteId; }),
      // Borrados registrados (para que no reaparezcan al sincronizar o restaurar)
      eliminados: {
        clientes: normalizarLapidas(data.eliminados && data.eliminados.clientes),
        pedidos: normalizarLapidas(data.eliminados && data.eliminados.pedidos),
        pagos: normalizarLapidas(data.eliminados && data.eliminados.pagos)
      },
      contador: {
        cliente: data.contador && data.contador.cliente ? Number(data.contador.cliente) : contarIds(data.clientes, "C-"),
        pedido: data.contador && data.contador.pedido ? Number(data.contador.pedido) : contarIds(data.pedidos, "P-"),
        pago: data.contador && data.contador.pago ? Number(data.contador.pago) : contarIds(data.pagos, "G-")
      },
      creadoEn: data.creadoEn || ahoraISO(),
      actualizadoEn: ahoraISO()
    };
    return estado;
  }

  function contarIds(arr, prefijo) {
    return (arr || []).filter(function (x) { return String(x.id || "").indexOf(prefijo) === 0; }).length;
  }
