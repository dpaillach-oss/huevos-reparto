<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7a600">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>HuevosReparto — Gestión de venta y reparto</title>
<style>
/* ============================================================================
 * styles.css — HuevosReparto (mobile first)
 * Pensado para usarse con una sola mano desde el celular:
 * botones grandes, textos legibles, poco ruido visual.
 * ========================================================================== */

/* ------------------------------ Variables -------------------------------- */
:root {
  --amarillo: #f7a600;
  --amarillo-oscuro: #d98f00;
  --amarillo-suave: #fff4dc;
  --azul: #1f6feb;
  --verde: #17915b;
  --rojo: #d1394a;
  --gris-900: #16181d;
  --gris-700: #3c4149;
  --gris-500: #6b7280;
  --gris-300: #d5d9e0;
  --gris-100: #eef1f5;
  --fondo: #f4f6f9;
  --blanco: #ffffff;
  --radio: 14px;
  --radio-chico: 10px;
  --sombra: 0 2px 10px rgba(18, 24, 38, .08);
  --sombra-fuerte: 0 10px 30px rgba(18, 24, 38, .22);
  --alto-topbar: 58px;
  --alto-nav: 62px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* -------------------------------- Reset ---------------------------------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--fondo);
  color: var(--gris-900);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  overscroll-behavior-y: contain;
}

body { padding-bottom: calc(var(--alto-nav) + var(--safe-bottom)); }

h1, h2, h3, h4 { margin: 0; font-weight: 700; line-height: 1.25; }

button, input, select, textarea { font-family: inherit; font-size: 16px; color: inherit; }

.oculto { display: none !important; }
.centrado { text-align: center; }
.mt { margin-top: 12px; }
.mb { margin-bottom: 12px; }
.muted { color: var(--gris-500); }
.chico { font-size: 13px; }
.negrita { font-weight: 700; }
.fila { display: flex; align-items: center; gap: 8px; }
.fila-sep { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.crecer { flex: 1; }

/* ------------------------------- Topbar ---------------------------------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(var(--safe-top) + 8px) 12px 8px;
  min-height: calc(var(--alto-topbar) + var(--safe-top));
  background: linear-gradient(135deg, var(--amarillo) 0%, #ffc233 100%);
  color: var(--gris-900);
  box-shadow: var(--sombra);
}
.topbar-title { flex: 1; min-width: 0; }
.topbar-title h1 { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-title span { font-size: 12.5px; color: rgba(22, 24, 29, .72); display: block; }

.icon-btn {
  width: 44px; height: 44px; min-width: 44px;
  border: none; border-radius: 12px;
  background: rgba(255, 255, 255, .55);
  font-size: 20px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.icon-btn:active { background: rgba(255, 255, 255, .85); }

.banner-alerta {
  background: #fff3cd; color: #7a5200;
  padding: 10px 14px; font-size: 13.5px;
  border-bottom: 1px solid #f0dca0;
}

/* -------------------------------- Vistas --------------------------------- */
.view { display: none; padding: 12px 12px 24px; }
.view.activa { display: block; }

.seccion-titulo {
  font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--gris-500); margin: 18px 4px 8px;
}

/* ------------------------------ Estadísticas ----------------------------- */
.stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.stat {
  background: var(--blanco);
  border-radius: var(--radio);
  padding: 12px;
  box-shadow: var(--sombra);
  border-left: 5px solid var(--amarillo);
}
.stat .stat-valor { font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
.stat .stat-label { font-size: 12px; color: var(--gris-500); margin-top: 2px; }
.stat.verde { border-left-color: var(--verde); }
.stat.rojo { border-left-color: var(--rojo); }
.stat.azul { border-left-color: var(--azul); }
.stat.gris { border-left-color: var(--gris-300); }
.stat.ancho { grid-column: 1 / -1; }

/* --------------------------- Botones grandes ----------------------------- */
.grid-botones {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.btn-grande {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  min-height: 84px;
  padding: 14px;
  border: none; border-radius: var(--radio);
  background: var(--blanco);
  box-shadow: var(--sombra);
  font-size: 15px; font-weight: 700;
  text-align: left; cursor: pointer;
}
.btn-grande:active { transform: scale(.98); }
.btn-grande .emoji { font-size: 22px; }
.btn-grande.principal { background: var(--amarillo); box-shadow: 0 3px 12px rgba(247,166,0,.4); }
.btn-grande.ancho { grid-column: 1 / -1; flex-direction: row; align-items: center; min-height: 64px; }

/* -------------------------------- Botones -------------------------------- */
.btn {
  border: none; border-radius: var(--radio-chico);
  padding: 12px 14px; min-height: 46px;
  font-size: 15px; font-weight: 700;
  background: var(--gris-100); color: var(--gris-900);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active { transform: scale(.98); }
.btn.primario { background: var(--amarillo); }
.btn.exito { background: var(--verde); color: #fff; }
.btn.azul { background: var(--azul); color: #fff; }
.btn.peligro { background: var(--rojo); color: #fff; }
.btn.borde { background: transparent; border: 2px solid var(--gris-300); }
.btn.bloque { width: 100%; }
.btn.fila-botones-bloque { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.acciones-fila { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.acciones-fila.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.acciones-fila .btn { width: 100%; padding: 10px 8px; font-size: 13.5px; min-height: 44px; }

/* --------------------------------- Listas -------------------------------- */
.lista { display: flex; flex-direction: column; gap: 10px; }

.tarjeta {
  background: var(--blanco);
  border-radius: var(--radio);
  padding: 12px;
  box-shadow: var(--sombra);
}
.tarjeta-cabecera { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.tarjeta-titulo { font-size: 16.5px; font-weight: 700; }
.tarjeta-sub { font-size: 13px; color: var(--gris-500); margin-top: 2px; }
.tarjeta-cuerpo { margin-top: 8px; font-size: 14.5px; }
.tarjeta-pie { margin-top: 10px; }

.linea-dato { display: flex; gap: 6px; align-items: baseline; font-size: 14.5px; }
.linea-dato .valor { font-weight: 700; }

.grupo-comuna {
  background: var(--gris-100);
  padding: 8px 12px; border-radius: 10px;
  font-weight: 800; font-size: 14px;
  display: flex; justify-content: space-between;
  margin-top: 6px;
}

.numero-orden {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--amarillo); color: var(--gris-900);
  font-size: 13px; font-weight: 800; margin-right: 8px;
}

/* -------------------------------- Badges --------------------------------- */
.badge {
  display: inline-block; padding: 4px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em;
  white-space: nowrap;
}
.badge.ok { background: #e3f6ec; color: #0f6b43; }
.badge.warn { background: #fff2cf; color: #8a6100; }
.badge.info { background: #e5efff; color: #1a4fa8; }
.badge.danger { background: #fde6e9; color: #a3232f; }
.badge.muted { background: var(--gris-100); color: var(--gris-500); }
.badge.habito { background: var(--amarillo-suave); color: #8a6100; }

/* ------------------------------- Formularios ----------------------------- */
.campo { margin-bottom: 12px; }
.campo label { display: block; font-size: 13px; font-weight: 700; color: var(--gris-700); margin-bottom: 5px; }
.campo input, .campo select, .campo textarea {
  width: 100%;
  padding: 13px 12px;
  border: 2px solid var(--gris-300);
  border-radius: var(--radio-chico);
  background: var(--blanco);
  min-height: 48px;
}
.campo textarea { min-height: 76px; resize: vertical; }
.campo input:focus, .campo select:focus, .campo textarea:focus {
  outline: none; border-color: var(--amarillo); box-shadow: 0 0 0 3px rgba(247,166,0,.2);
}
.campo .ayuda { font-size: 12px; color: var(--gris-500); margin-top: 4px; }
.campo-check {
  display: flex; align-items: center; gap: 10px;
  background: var(--blanco); border: 2px solid var(--gris-300);
  border-radius: var(--radio-chico); padding: 12px; min-height: 52px;
}
.campo-check input { width: 24px; height: 24px; accent-color: var(--amarillo); }
.fila-campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fila-campos.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.buscador { margin-bottom: 10px; }
.buscador input {
  width: 100%; padding: 12px 14px; border-radius: 999px;
  border: 2px solid var(--gris-300); background: var(--blanco); min-height: 48px;
}

.filtros-chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; }
.chip {
  border: 2px solid var(--gris-300); background: var(--blanco);
  border-radius: 999px; padding: 8px 14px; font-size: 13.5px; font-weight: 700;
  white-space: nowrap; cursor: pointer;
}
.chip.activo { background: var(--gris-900); color: #fff; border-color: var(--gris-900); }

.filtros-ruta {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px; background: var(--blanco); padding: 10px;
  border-radius: var(--radio); box-shadow: var(--sombra); margin-bottom: 12px;
}
.campo-inline { display: flex; flex-direction: column; gap: 4px; }
.campo-inline span { font-size: 11.5px; font-weight: 700; color: var(--gris-500); text-transform: uppercase; }
.campo-inline select, .campo-inline input {
  width: 100%; padding: 10px; min-height: 44px;
  border: 2px solid var(--gris-300); border-radius: var(--radio-chico); background: var(--blanco);
}

.selector-semana {
  display: flex; align-items: center; gap: 8px;
  background: var(--blanco); border-radius: var(--radio);
  padding: 10px; box-shadow: var(--sombra); margin-bottom: 12px;
}
.selector-semana .semana-texto { flex: 1; text-align: center; font-size: 13.5px; font-weight: 700; }
.selector-semana button {
  border: none; background: var(--gris-100); border-radius: 10px;
  width: 42px; height: 42px; font-size: 18px; font-weight: 800; cursor: pointer;
}

/* -------------------------------- Tablas --------------------------------- */
.tabla-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tabla { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--blanco); }
table.tabla th, table.tabla td { padding: 9px 8px; text-align: left; border-bottom: 1px solid var(--gris-100); white-space: nowrap; }
table.tabla th { background: var(--gris-100); font-size: 12px; text-transform: uppercase; color: var(--gris-500); position: sticky; top: 0; }
table.tabla td.num, table.tabla th.num { text-align: right; }
table.tabla tfoot td { font-weight: 800; background: var(--amarillo-suave); }

/* ------------------------------ Resumen total ---------------------------- */
.resumen-caja {
  background: var(--gris-900); color: #fff;
  border-radius: var(--radio); padding: 14px; margin: 12px 0;
}
.resumen-caja .fila-sep { font-size: 14.5px; padding: 3px 0; }
.resumen-caja .total { font-size: 22px; font-weight: 800; }
.resumen-caja.amarillo { background: var(--amarillo); color: var(--gris-900); }
.resumen-caja.rojo { background: var(--rojo); }
.resumen-caja.verde { background: var(--verde); }

/* ------------------------------- Sheet/Modal ----------------------------- */
.sheet-fondo {
  position: fixed; inset: 0; background: rgba(12, 16, 24, .55);
  z-index: 60; display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  background: var(--fondo);
  width: 100%; max-width: 620px;
  max-height: 92vh; overflow-y: auto;
  border-radius: 20px 20px 0 0;
  box-shadow: var(--sombra-fuerte);
  animation: subir .18s ease-out;
  padding-bottom: calc(12px + var(--safe-bottom));
}
@keyframes subir { from { transform: translateY(24px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
.sheet-cabecera {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 14px 10px; background: var(--fondo);
  border-bottom: 1px solid var(--gris-100);
}
.sheet-cabecera h3 { font-size: 17px; }
.sheet-cuerpo { padding: 14px; }
.sheet-pie {
  position: sticky; bottom: 0;
  display: flex; gap: 8px; padding: 12px 14px calc(12px + var(--safe-bottom));
  background: var(--fondo); border-top: 1px solid var(--gris-100);
}
.sheet-pie .btn { flex: 1; }

.dialogo {
  background: var(--blanco); border-radius: var(--radio);
  width: min(420px, calc(100vw - 32px));
  margin: auto; padding: 18px; box-shadow: var(--sombra-fuerte);
}
.dialogo h3 { font-size: 17px; margin-bottom: 8px; }
.dialogo p { font-size: 14.5px; color: var(--gris-700); margin: 0 0 16px; }

/* --------------------------------- Toast --------------------------------- */
.toast-root {
  position: fixed; left: 0; right: 0;
  bottom: calc(var(--alto-nav) + var(--safe-bottom) + 12px);
  z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none; padding: 0 12px;
}
.toast {
  background: var(--gris-900); color: #fff;
  padding: 12px 16px; border-radius: 12px;
  font-size: 14px; font-weight: 600; max-width: 100%;
  box-shadow: var(--sombra-fuerte);
  animation: aparecer .16s ease-out;
}
.toast.exito { background: var(--verde); }
.toast.error { background: var(--rojo); }
.toast.aviso { background: var(--amarillo-oscuro); }
@keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ------------------------------ Bottom nav ------------------------------- */
.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--blanco);
  border-top: 1px solid var(--gris-100);
  padding-bottom: var(--safe-bottom);
  box-shadow: 0 -2px 12px rgba(18, 24, 38, .07);
}
.bottomnav button {
  border: none; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 8px 2px; min-height: var(--alto-nav);
  font-size: 11px; font-weight: 700; color: var(--gris-500);
}
.bottomnav button .nav-ico { font-size: 20px; line-height: 1; }
.bottomnav button.activo { color: var(--gris-900); }
.bottomnav button.activo .nav-ico { transform: translateY(-1px) scale(1.08); }

/* -------------------------------- Drawer --------------------------------- */
.drawer-fondo {
  position: fixed; inset: 0; background: rgba(12, 16, 24, .5);
  z-index: 55; opacity: 0; pointer-events: none; transition: opacity .18s;
}
.drawer-fondo.abierto { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 86vw);
  background: var(--blanco); z-index: 56;
  transform: translateX(-102%); transition: transform .2s ease-out;
  display: flex; flex-direction: column;
  padding-top: var(--safe-top);
  box-shadow: var(--sombra-fuerte);
}
.drawer.abierto { transform: translateX(0); }
.drawer-cabecera {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 12px 8px; border-bottom: 1px solid var(--gris-100);
}
.drawer-cabecera .icon-btn { background: var(--gris-100); }
.drawer-opciones { padding: 8px; overflow-y: auto; }
.drawer-opciones button {
  width: 100%; text-align: left; border: none; background: none;
  padding: 15px 12px; border-radius: var(--radio-chico);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 10px; min-height: 50px;
}
.drawer-opciones button:active { background: var(--gris-100); }

/* --------------------------------- FAB ----------------------------------- */
.fab {
  position: fixed;
  right: 16px;
  bottom: calc(var(--alto-nav) + var(--safe-bottom) + 16px);
  z-index: 45;
  width: 60px; height: 60px; border-radius: 50%;
  border: none; background: var(--amarillo);
  color: var(--gris-900); font-size: 30px; font-weight: 700; line-height: 1;
  box-shadow: 0 6px 18px rgba(247, 166, 0, .5);
  cursor: pointer;
}
.fab:active { transform: scale(.94); }

/* ------------------------------- Utilidades ------------------------------ */
.vacio {
  text-align: center; padding: 34px 18px; color: var(--gris-500);
  background: var(--blanco); border-radius: var(--radio); box-shadow: var(--sombra);
}
.vacio .emoji { font-size: 34px; display: block; margin-bottom: 8px; }

.tel-link, .mapa-link { text-decoration: none; }

.aviso-duplicado {
  background: #fde6e9; color: #a3232f; border-radius: var(--radio-chico);
  padding: 10px 12px; font-size: 13.5px; margin-top: 8px;
}
.aviso-info {
  background: #e5efff; color: #1a4fa8; border-radius: var(--radio-chico);
  padding: 10px 12px; font-size: 13.5px;
}

@media (min-width: 560px) {
  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid-botones { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* --------------------------- Modo selección ------------------------------ */
.tarjeta.seleccionable { display: flex; gap: 10px; cursor: pointer; }
.tarjeta.seleccionable .check-seleccion {
  width: 26px; height: 26px; min-width: 26px;
  border: 2px solid var(--gris-300); border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 800; color: #fff; margin-top: 2px;
}
.tarjeta.seleccionada { outline: 3px solid var(--amarillo); }
.tarjeta.seleccionada .check-seleccion { background: var(--amarillo); border-color: var(--amarillo-oscuro); }
.barra-seleccion {
  background: var(--gris-900); color: #fff; border-radius: var(--radio);
  padding: 10px 12px; margin-bottom: 10px;
}
.barra-seleccion .titulo { font-weight: 800; font-size: 14.5px; }
.barra-seleccion .acciones-fila { margin-top: 8px; }
.barra-seleccion .btn { background: rgba(255, 255, 255, .16); color: #fff; border: none; }

/* ------------------------------ Impresión -------------------------------- */
.zona-impresion { display: none; }

@media print {
  /* Hoja tamaño carta (216 × 279 mm), orientación vertical. Los márgenes dejan
     198 mm de ancho útil, que es el ancho con el que se calculan las columnas
     de los informes (suman 100 %). */
  @page {
    size: letter portrait;
    margin: 10mm 9mm 11mm 9mm;
  }

  /* Al imprimir sólo se muestra el documento generado */
  body.imprimiendo > *:not(.zona-impresion) { display: none !important; }
  body.imprimiendo { background: #fff; padding: 0; }
  body.imprimiendo .zona-impresion { display: block !important; }

  /* Impresión de la pantalla tal cual (sin menús ni botones) */
  body:not(.imprimiendo) .topbar,
  body:not(.imprimiendo) .bottomnav,
  body:not(.imprimiendo) .fab,
  body:not(.imprimiendo) #drawer,
  body:not(.imprimiendo) #drawer-fondo,
  body:not(.imprimiendo) .toast-root,
  body:not(.imprimiendo) .selector-semana,
  body:not(.imprimiendo) .filtros-ruta,
  body:not(.imprimiendo) .filtros-chips,
  body:not(.imprimiendo) .buscador,
  body:not(.imprimiendo) .barra-seleccion,
  body:not(.imprimiendo) .acciones-fila { display: none !important; }
  body:not(.imprimiendo) .view { display: block !important; padding: 0; }
  body:not(.imprimiendo) { background: #fff; padding: 0; }

  /* ---------------- Documentos imprimibles (hoja carta) ------------------- */
  .hoja-impresion {
    color: #000; background: #fff;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 8.8pt; line-height: 1.22;
    /* Que el navegador imprima los grises tal cual (Chrome los quita si no) */
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .hoja-impresion h1 { font-size: 13pt; margin: 0 0 1mm; }
  .hoja-impresion .sub { font-size: 7.5pt; color: #222; margin-bottom: 1.6mm; line-height: 1.3; }

  /* Cada comuna es un bloque que no se parte por la mitad */
  .hoja-impresion .comuna-bloque { break-inside: avoid; page-break-inside: avoid; margin-top: 1.9mm; }
  .hoja-impresion .comuna-titulo {
    display: flex; justify-content: space-between; gap: 4mm;
    background: #e6e6e6; border: .5pt solid #666;
    padding: .9mm 1.6mm; font-weight: 700; font-size: 9.2pt;
  }
  .hoja-impresion .comuna-titulo span:last-child { font-weight: 400; font-size: 8.4pt; }

  .hoja-impresion table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .hoja-impresion th, .hoja-impresion td {
