        : '<label class="etiqueta mt">Código de sincronización (del otro dispositivo)</label>' +

  function programarSincronizacion() {
    if (!DB.syncLista() || estadoSync.silenciando) { return; }
    if (estadoSync.programado) { clearTimeout(estadoSync.programado); }
    estadoSync.programado = setTimeout(function () {
      estadoSync.programado = null;
      sincronizarAhora({});
    }, 4000);
  }

  /** Sincroniza con el otro dispositivo. Devuelve una promesa con el resultado. */
  function sincronizarAhora(opciones) {
    opciones = opciones || {};
    if (!syncDisponible()) { return Promise.resolve(null); }
    if (!DB.syncLista()) {
      if (opciones.manual) { toast("Primero configura la sincronización en este dispositivo.", "aviso"); ir("config"); }
      return Promise.resolve(null);
    }
    if (estadoSync.corriendo) { return Promise.resolve(null); }

    estadoSync.corriendo = true;
    if (opciones.manual) { render(); }

    return root.HuevosSync.sincronizar({
      gistId: DB.meta.gistId, token: DB.meta.token, clave: DB.meta.clave,
      dispositivo: (DB.meta.dispositivo || {}).nombre || ""
    }, DB.state, C).then(function (res) {
      estadoSync.corriendo = false;
      estadoSync.silenciando = true;
      DB.reemplazar(res.estado);
      DB.meta.ultimaSync = new Date().toISOString();
      DB.meta.ultimoResultado = "";
      DB.meta.pendiente = false;
      DB.guardarMeta();
      estadoSync.silenciando = false;
      render();

      if (opciones.manual) {
        var detalle = res.informe ? C.textoInformeFusion(res.informe) : "";
        if (res.informe && res.informe.cambioTotal) { toast("Sincronizado · llegó: " + detalle + ".", "exito"); }
        else if (res.subido) { toast("Sincronizado · se enviaron tus cambios al otro dispositivo.", "exito"); }
        else { toast("Todo al día: no había cambios que sincronizar.", "aviso"); }
      }
      return res;
    }, function (error) {
      estadoSync.corriendo = false;
      DB.meta.ultimoResultado = String((error && error.message) || error);
      DB.meta.pendiente = true;
      DB.guardarMeta();
      render();
      if (opciones.manual || opciones.avisar) { toast(DB.meta.ultimoResultado, "error"); }
      return null;
    });
  }

  /** Sincronización automática: al abrir, al volver a la app y tras cada cambio. */
  function instalarSincronizacionAutomatica() {
    if (!syncDisponible() || !DB.meta) { return; }

    setTimeout(function () { if (DB.syncLista()) { sincronizarAhora({}); } }, 1500);

    document.addEventListener("visibilitychange", function () {
      if (!DB.syncLista()) { return; }
      if (document.hidden) { sincronizarAhora({}); return; }
      var meta = DB.meta;
      var atrasado = !meta.ultimaSync || (Date.now() - new Date(meta.ultimaSync).getTime()) > 60000;
      if (atrasado || meta.pendiente) { sincronizarAhora({}); }
    });

    root.addEventListener("online", function () { if (DB.syncLista()) { sincronizarAhora({}); } });
    root.addEventListener("pagehide", function () { if (DB.syncLista()) { sincronizarAhora({}); } });

    // Cualquier cambio local se envía poco después (4 s de calma)
    var guardarOriginal = DB.guardar.bind(DB);
    DB.guardar = function () {
      var resultado = guardarOriginal();
      if (!estadoSync.silenciando) { programarSincronizacion(); }
      return resultado;
    };
  }

  /* ======================================================================== */
  /* 7e. Optimización de la ruta por distancia                                */
  /* ======================================================================== */

  function kmTexto(km) {
    return String(Math.round(Number(km) * 10) / 10).replace(".", ",") + " km";
  }

  function mapaDisponible() { return !!(root.HuevosMapa && root.HuevosMapa.ubicarVarios); }

  function abrirUrl(url) {
    var ventana = root.open ? root.open(url, "_blank") : null;
    if (!ventana) { root.location.href = url; }
  }

  /** Ubica las direcciones indicadas y las guarda en la ficha del cliente. */
  function ubicarClientes(clientes, alTerminar) {
    if (!mapaDisponible()) { toast("Este navegador no puede consultar los mapas.", "error"); return; }
    var lista = (clientes || []).filter(function (c) { return c && c.calle; });
    if (!lista.length) { toast("Esas direcciones no tienen calle registrada.", "aviso"); return; }
    estadoSync.optimizando = true;
    render();
    toast("Ubicando " + lista.length + (lista.length === 1 ? " dirección" : " direcciones") + "… puede tardar un poco.", "aviso");
    var ultimoAviso = 0;
    root.HuevosMapa.ubicarVarios(lista, {
      // La pausa entre consultas se lee del módulo (1,1 s por cortesía con el
      // servicio público); las pruebas la ponen en 0.
      pausaMs: root.HuevosMapa.PAUSA_MS,
      alProgreso: function (hechos, total) {
        if (hechos === total || hechos - ultimoAviso >= 3) {
          ultimoAviso = hechos;
          var titulo = document.querySelector("#panel-optimizacion .tarjeta-titulo");
          if (titulo) { titulo.textContent = "🧭 Ubicando direcciones… " + hechos + "/" + total; }
        }
      }
    }).then(function (res) {
      res.encontrados.forEach(function (u) {
        C.guardarUbicacion(DB.state, u.clienteId, u.lat, u.lon, u.fuente);
      });
      estadoSync.optimizando = false;
      if (res.encontrados.length) { guardarYRender(); } else { render(); }
      var mensaje = res.encontrados.length + " de " + res.total + " direcciones ubicadas.";
      if (res.fallidos.length) {
        mensaje += " No se ubicaron: " + res.fallidos.map(function (f) { return f.nombre || "un cliente"; }).join(", ") + ".";
      }
      toast(mensaje, res.encontrados.length ? "exito" : "aviso");
      if (alTerminar) { alTerminar(res); }
    }, function (error) {
      estadoSync.optimizando = false;
      render();
      toast(String((error && error.message) || error), "error");
    });
  }

  /** Busca el recorrido más corto para el día y lo aplica. */
  function optimizarRutaDelDia() {
    var rutaDia = C.rutaDeReparto(DB.state, ui.ruta);
    var visitas = rutaDia.pedidos.map(function (p) {
      return { pedido: p, cliente: C.getCliente(DB.state, p.clienteId) };
    }).filter(function (v) { return v.cliente; });

    var base = C.baseDe(DB.state);
    var puntos = [];
    if (base) { puntos.push({ lat: base.lat, lon: base.lon }); }
    visitas.forEach(function (v) {
      var co = C.coordenadasDe(v.cliente);
      if (co) { puntos.push(co); }
    });

    // Con tres puntos o más se intenta medir por calles reales (una sola
    // consulta). Si el servicio no responde, se optimiza en línea recta.
    if (mapaDisponible() && puntos.length >= 3) {
      estadoSync.optimizando = true;
      renderPanelOptimizacion(rutaDia);
      toast("Midiendo distancias reales por calle…", "aviso");
      root.HuevosMapa.distanciasMatriz(puntos).then(function (matriz) {
        estadoSync.optimizando = false;
        var costo = matriz ? root.HuevosMapa.costoDesdeMatriz(puntos, matriz) : null;
        aplicarOptimizacion(visitas, base, costo, costo ? "calles" : "linea-recta");
      }, function () {
        estadoSync.optimizando = false;
        aplicarOptimizacion(visitas, base, null, "linea-recta");
      });
      return;
    }
    aplicarOptimizacion(visitas, base, null, "linea-recta");
  }

  /** Calcula el recorrido más corto (con la métrica indicada) y lo propone. */
  function aplicarOptimizacion(visitas, base, costo, fuente) {
    var resultado = C.optimizarRuta(visitas, {
      base: base,
      volverBase: ui.optimizarVolverBase !== false,
      costo: costo
    });
    if (!resultado.visitas) {
      toast("Primero ubica las direcciones de este día.", "aviso");
      return;
    }
    var ordenCompleto = resultado.orden.slice();
    resultado.sinCoordenadas.forEach(function (v, i) {
      ordenCompleto.push({ pedidoId: v.pedidoId, orden: resultado.orden.length + i + 1, kmTramo: null });
    });

    var porCalles = resultado.fuenteDistancia === "calles";
    var mensaje = "Orden actual: " + kmTexto(resultado.distanciaInicial) +
      " → recorrido más corto: " + kmTexto(resultado.distanciaFinal) +
      (porCalles ? " (distancias reales por calle)" : " (en línea recta)") + ".";
    if (resultado.ahorroKm > 0.05) {
      mensaje += " Ahorras " + kmTexto(resultado.ahorroKm) + " (" + resultado.ahorroPorcentaje + "%).";
    } else {
      mensaje += " El orden ya era prácticamente el mejor.";
    }
    if (resultado.sinCoordenadas.length) {
      mensaje += " " + resultado.sinCoordenadas.length + " dirección(es) sin ubicar quedan al final.";
    }
    if (!resultado.conBase) {
      mensaje += " (Define tu punto de partida en Configuración para optimizar desde la bodega.)";
    }

    confirmar({
      titulo: "Aplicar el recorrido más corto",
      mensaje: mensaje,
      textoOk: "Aplicar", claseOk: "primario"
    }, function () {
      var cuantos = C.aplicarOrdenRuta(DB.state, ui.ruta.fecha, ordenCompleto, { fuente: resultado.fuenteDistancia });
      guardarYRender("Recorrido aplicado a " + cuantos + " entrega(s).");
    });
  }

  /* ======================================================================== */
  /* 8. Manejadores de acciones                                               */
  /* ======================================================================== */

  function guardarYRender(mensaje, tipo) {
    DB.guardar();
    render();
    if (mensaje) { toast(mensaje, tipo || "exito"); }
  }

  function semanaDe(destino) {
    return destino === "pedidos" ? "semanaPedidos" : destino === "generar" ? "semanaGenerar"
      : destino === "informes" ? "semanaInformes" : "semanaInicio";
  }

  function descargarArchivo(nombre, contenido, tipoMime) {
    try {
      var blob = new Blob([contenido], { type: tipoMime || "application/json;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = nombre;
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        if (a.parentNode) { a.parentNode.removeChild(a); }
        URL.revokeObjectURL(url);
      }, 1500);
      toast("Respaldo descargado. Guárdalo en un lugar seguro.", "exito");
      return true;
    } catch (e) {
      toast("Este navegador no permitió descargar. Usa «Copiar respaldo».", "error");
      return false;
    }
  }

  function abrirMapa(cont) {
    var st = DB.state;
    var c = C.getCliente(st, cont.dataset.id);
    if (!c) { return; }
    var url = urlMapa(c);
    if (!url) { toast("No se pudo armar el enlace del mapa.", "error"); return; }
    abrirUrl(url);
  }

  function manejarAccion(accion, el) {
    var st = DB.state;
    var d = el.dataset || {};
    var hoja = document.getElementById("sheet-root");
    var form = hoja ? readForm(hoja) : {};

    switch (accion) {

      /* ------------------------------ navegación ------------------------ */
      case "ir":
        ir(d.route);
        break;
      case "abrir-menu":
        abrirMenu();
        break;
      case "cerrar-menu":
        cerrarMenu();
        break;
      case "acciones-rapidas":
        sheetAccionesRapidas();
        break;
      case "cerrar-sheet":
        cerrarSheet();
        break;
      case "cerrar-dialogo":
        cerrarDialogo();
        break;
      case "confirmar-dialogo":
        var cb = callbackDialogo;
        cerrarDialogo();
        if (typeof cb === "function") { cb(); }
        break;
      case "imprimir":
        window.print();
        break;

      /* ----------------------------- semanas ---------------------------- */
      case "semana-anterior":
      case "semana-siguiente":
        var campo = semanaDe(d.destino);
        ui[campo] = C.shiftWeek(ui[campo], accion === "semana-anterior" ? -1 : 1);
        if (d.destino === "generar") { ui.previa = null; ui.ultimaGeneracion = null; }
        render();
        break;
      case "ir-a-fecha":
        var inp = document.getElementById("saltar-" + d.destino);
        if (inp && inp.value) {
          var campo2 = semanaDe(d.destino);
          ui[campo2] = C.weekKeyFromISO(inp.value);
          if (d.destino === "generar") { ui.previa = null; ui.ultimaGeneracion = null; }
          render();
        }
        break;

      /* ----------------------------- clientes --------------------------- */
      case "nuevo-cliente":
        if (sheetAbierto()) { cerrarSheet(); }
        sheetCliente(null);
        break;
      case "editar-cliente":
        sheetCliente(d.id);
        break;
      case "guardar-cliente": {
        var habBandejas = parseInt(form.hab_bandejas, 10) || 0;
        if (form.hab_activo && habBandejas < 1) {
          toast("Indica la cantidad de bandejas del pedido habitual.", "error");
          return;
        }
        var payload = {
          nombre: form.nombre, apellido: form.apellido, telefono: form.telefono,
          calle: form.calle, numero: form.numero, comuna: form.comuna, zona: form.zona,
          observaciones: form.observaciones, estado: form.estado,
          pedidoHabitual: {
            activo: !!form.hab_activo, bandejas: habBandejas,
            dia: form.hab_activo ? form.hab_dia : form.hab_dia,
            observaciones: form.hab_obs || ""
          }
        };
        var res = form.id ? C.actualizarCliente(st, form.id, payload) : C.crearCliente(st, payload);
        if (!res.ok) { toast(res.motivo, "error"); return; }
        var esNuevo = !form.id;
        var idCliente = res.cliente.id;
        cerrarSheet();
        DB.guardar();
        toast(esNuevo ? "Cliente creado correctamente." : "Cliente actualizado.");
        if (esNuevo) { ir("clientes"); } else { ir("cliente", { id: idCliente }); }
        break;
      }
      case "editar-habitual":
        sheetHabitual(d.id);
        break;
      case "guardar-habitual": {
        var c = C.getCliente(st, form.id);
        if (!c) { return; }
        var bandejas = parseInt(form.hab_bandejas, 10) || 0;

        var r2 = C.actualizarCliente(st, form.id, {
          nombre: c.nombre, apellido: c.apellido, telefono: c.telefono, calle: c.calle, numero: c.numero,
          comuna: c.comuna, zona: c.zona, observaciones: c.observaciones, estado: c.estado,
          pedidoHabitual: { activo: !!form.hab_activo, bandejas: bandejas, dia: form.hab_dia, observaciones: form.hab_obs || "" }
        });

      case "toggle-estado-cliente": {

      }
      case "eliminar-cliente": {
        var cli = C.getCliente(st, d.id);

        confirmar({
          titulo: "Eliminar cliente",
          mensaje: "¿Eliminar a " + C.nombreCompleto(cli) + "? Si tiene pedidos o pagos registrados se conservará su historial y sólo se marcará como inactivo.",
          textoOk: "Sí, continuar", claseOk: "peligro"
        }, function () {
          var res2 = C.eliminarCliente(st, d.id);
          DB.guardar();
          toast(res2.motivo, res2.eliminado ? "exito" : "aviso");
          ir("clientes");
        });
        break;
      }
      case "ver-cliente":
        cerrarSheet();
        ir("cliente", { id: d.id });

      case "filtro-clientes":

      case "salir-seleccion":

      case "alternar-seleccion": {
        var idx = ui.seleccionClientes.indexOf(d.id);

        render();
        break;
      }
      case "seleccionar-todos":

        break;
      case "limpiar-seleccion":
        ui.seleccionClientes = [];
        render();
        break;
      case "eliminar-seleccionados": {
        var idsBorrar = ui.seleccionClientes.slice();

        confirmar({

          mensaje: "Se eliminarán los clientes seleccionados." +
            (conHistorial ? " " + conHistorial + " de ellos tienen pedidos o pagos registrados, así que se marcarán como INACTIVOS para no perder el historial." : ""),

        }, function () {

          ui.seleccionClientes = [];
          ui.modoSeleccion = false;
          DB.guardar();
          render();
          toast("Eliminados: " + res.eliminados + " · Marcados inactivos: " + res.inactivados +

            res.eliminados ? "exito" : "aviso");
        });
        break;
      }
      case "inactivar-seleccionados": {
        var idsInactivar = ui.seleccionClientes.slice();

        confirmar({
          titulo: "Inactivar " + idsInactivar.length + " cliente" + (idsInactivar.length === 1 ? "" : "s"),
          mensaje: "Los clientes seleccionados dejarán de aparecer en la generación de pedidos semanales. Su historial se conserva y puedes reactivarlos cuando quieras.",
          textoOk: "Inactivar", claseOk: "primario"
        }, function () {
          var res = C.inactivarClientes(st, idsInactivar);
          ui.seleccionClientes = [];
          ui.modoSeleccion = false;
          DB.guardar();
          render();
          toast("Clientes inactivados: " + res.inactivados + (res.yaInactivos ? " (" + res.yaInactivos + " ya estaban inactivos)" : ""), "exito");
        });

      }
      case "reactivar-seleccionados": {
        var idsActivar = ui.seleccionClientes.slice();

      /* ------------------------------ pedidos --------------------------- */
      case "nuevo-pedido":

        break;
      case "editar-pedido":

        break;
      case "ver-pedido":

        break;
      case "guardar-pedido": {
        var valorVigente = C.valorBandejaVigente(st);
        if (form.id) {
          var res3 = C.modificarPedido(st, form.id, {
            bandejas: form.bandejas, fechaEntrega: form.fechaEntrega, observaciones: form.observaciones,
            actualizarPrecio: !!form.actualizarPrecio, valorUnitario: valorVigente,

          var res4 = C.crearPedidoExtraordinario(st, {

        break;
      case "entregado": {

        cerrarSheet();

      case "no-entregado":

        cerrarSheet();
        DB.guardar();

      case "filtro-pedidos":

        render();
        break;

      /* --------------------------- generación --------------------------- */
      case "previa-generacion":
        ui.previa = C.previsualizarGeneracion(st, { semana: ui.semanaGenerar });

      case "cancelar-previa":
        ui.previa = null;
        render();
        break;
      case "confirmar-generacion": {
        var previa = ui.previa || C.previsualizarGeneracion(st, { semana: ui.semanaGenerar });
        if (!previa.filas.length) { toast("No hay pedidos por generar.", "aviso"); return; }
        confirmar({
          titulo: "Confirmar generación",
          mensaje: "Se crearán " + previa.totales.clientes + " pedidos (" + previa.totales.bandejas + " bandejas) por un total de " +
            C.formatCLP(previa.totales.venta) + " para " + C.weekLabel(previa.semana) + ". ¿Continuar?",
          textoOk: "Confirmar generación", claseOk: "exito"
        }, function () {
          var res8 = C.generarPedidos(st, { semana: ui.semanaGenerar, confirmado: true });
          if (!res8.ok) { toast(res8.motivo, "error"); return; }
          ui.ultimaGeneracion = { semana: ui.semanaGenerar, totales: res8.totales, omitidos: res8.omitidos };
          ui.previa = null;
          ui.semanaPedidos = ui.semanaGenerar;
          DB.guardar();
          render();
          toast(res8.totales.pedidos + " pedidos generados para " + ui.semanaGenerar + ".");
        });
        break;
      }

      /* ------------------------------- pagos ---------------------------- */
      case "nuevo-pago":
        if (sheetAbierto()) { cerrarSheet(); }
        sheetPago(d.id || null, d.pedido || null);
        break;
      case "llenar-saldo":
      case "llenar-mitad": {
        var selC = document.getElementById("f-clienteId");
        var r3 = selC && selC.value ? C.resumenCliente(st, selC.value) : null;
        var inputMonto = document.getElementById("f-monto");
        if (!r3 || r3.saldo <= 0) { toast("Selecciona un cliente con saldo pendiente.", "aviso"); return; }
        inputMonto.value = accion === "llenar-saldo" ? r3.saldo : Math.round(r3.saldo / 2);
        break;
      }
      case "guardar-pago": {
        if (!form.clienteId) { toast("Selecciona un cliente.", "error"); return; }
        var res9 = C.registrarPago(st, {
          clienteId: form.clienteId, fecha: form.fecha, monto: form.monto,
          medio: form.medio, observaciones: form.observaciones, pedidoId: form.pedidoId || null
        });
        if (!res9.ok) { toast(res9.motivo, "error"); return; }
        var saldo = res9.resumen.saldo;
        cerrarSheet();
        DB.guardar();
        render();
        toast("Pago de " + C.formatCLP(res9.pago.monto) + " registrado. Saldo: " + C.formatCLP(saldo > 0 ? saldo : 0) +
          (saldo <= 0 ? " — deuda completada ✔" : ""), "exito");
        break;
      }
      case "eliminar-pago":
        confirmar({
          titulo: "Eliminar pago",
          mensaje: "¿Eliminar este pago? La deuda del cliente se recalculará automáticamente.",
          textoOk: "Eliminar", claseOk: "peligro"
        }, function () {
          var res10 = C.eliminarPago(st, d.id);
          guardarYRender(res10.ok ? "Pago eliminado." : res10.motivo, res10.ok ? "aviso" : "error");
        });
        break;

      /* --------------------------- sincronización ----------------------- */
      case "abrir-sincronizacion":
        if (sheetAbierto()) { cerrarSheet(); }
        sheetSincronizacion();
        break;
      case "sincronizar-ahora":
        sincronizarAhora({ manual: true });
        break;

      case "guardar-sincronizacion": {
        var selDispositivo = document.getElementById("sync-dispositivo");
        var campoToken = document.getElementById("sync-token");
        var campoCodigo = document.getElementById("sync-codigo");
        var token = campoToken ? campoToken.value.trim() : "";
        var codigo = campoCodigo ? campoCodigo.value.trim() : "";
        if (!token) { toast("Pega la clave de acceso de GitHub (con permiso gist).", "error"); return; }
        if (codigo.indexOf("HR1-") === 0 && campoCodigo && !campoCodigo.readOnly) {
          try {
            var partes = root.HuevosSync.leerCodigoDeSincronizacion(codigo);
            DB.meta.gistId = partes.gistId;
            DB.meta.clave = partes.clave;
          } catch (e) { toast(e.message, "error"); return; }
        }
        if (!DB.meta.gistId || !DB.meta.clave) {
          toast("Falta el código de sincronización. Si es la primera vez, usa «Crear un archivo nuevo».", "error");
          return;
        }
        DB.meta.token = token;
        DB.meta.dispositivo.nombre = selDispositivo ? selDispositivo.value : "";
        DB.meta.activa = true;
        DB.guardarMeta();
        toast("Comprobando la clave con GitHub…", "aviso");
        root.HuevosSync.verificarCuenta(token).then(function (usuario) {
          toast("Conectado a GitHub como " + usuario + ".", "exito");
          cerrarSheet();
          return sincronizarAhora({ manual: true });
        }, function (error) {
          DB.meta.pendiente = true;
          DB.meta.ultimoResultado = String((error && error.message) || error);
          DB.guardarMeta();
          render();
          toast(DB.meta.ultimoResultado, "error");
        });
        break;
      }

      case "crear-sync": {
        var campoToken2 = document.getElementById("sync-token");
        var selDispositivo2 = document.getElementById("sync-dispositivo");
        var token2 = campoToken2 ? campoToken2.value.trim() : "";
        if (!token2) { toast("Primero pega la clave de acceso de GitHub.", "error"); return; }
        confirmar({
          titulo: "Crear archivo compartido",
          mensaje: "Se creará un archivo privado y cifrado en tu cuenta de GitHub con los datos de este dispositivo. " +
            "Después podrás copiar el código al otro dispositivo para conectarlos.",
          textoOk: "Crear", claseOk: "primario"
        }, function () {
          var clave = root.HuevosSync.claveAlAzar();
          root.HuevosSync.cifrar(C.exportar(DB.state), clave).then(function (texto) {
            return root.HuevosSync.crearNube(token2, texto);
          }).then(function (id) {
            DB.meta.gistId = id;
            DB.meta.clave = clave;
            DB.meta.token = token2;
            DB.meta.dispositivo.nombre = selDispositivo2 ? selDispositivo2.value : "";
            DB.meta.activa = true;
            DB.guardarMeta();
            sheetSincronizacion();
            render();
            toast("Listo. Copia el código y pégalo en el otro dispositivo.", "exito");
            return sincronizarAhora({});
          }).catch(function (e) { toast(String((e && e.message) || e), "error"); });
        });
        break;
      }

      case "copiar-codigo-sync": {
        var areaCodigo = document.getElementById("sync-codigo");
        var valorCodigo = areaCodigo ? areaCodigo.value.trim() : "";
        if (!valorCodigo) { toast("Todavía no hay código para copiar.", "aviso"); return; }
        if (root.navigator && root.navigator.clipboard && root.navigator.clipboard.writeText) {
          root.navigator.clipboard.writeText(valorCodigo).then(function () {
            toast("Código copiado. Pégalo en el otro dispositivo.", "exito");
          }, function () { areaCodigo.select(); toast("Copia el código seleccionado.", "aviso"); });
        } else { areaCodigo.select(); toast("Copia el código seleccionado.", "aviso"); }
        break;
      }

      case "compartir-codigo-sync": {
        var areaCodigo2 = document.getElementById("sync-codigo");
        var valorCodigo2 = areaCodigo2 ? areaCodigo2.value.trim() : "";
        if (!valorCodigo2) { toast("Todavía no hay código para enviar.", "aviso"); return; }
        if (root.navigator && root.navigator.share) {
          root.navigator.share({
            title: "HuevosReparto · código de sincronización",
            text: "Código para conectar HuevosReparto en este dispositivo:\n" + valorCodigo2
          }).catch(function () { });
        } else if (root.navigator && root.navigator.clipboard) {
          root.navigator.clipboard.writeText(valorCodigo2);
          toast("Código copiado (puedes enviarlo por WhatsApp o correo).", "exito");
        } else {
          areaCodigo2.select();
          toast("Copia el código seleccionado.", "aviso");
        }
        break;
      }

      case "desactivar-sync":
        confirmar({
          titulo: "Desactivar sincronización",

        }, function () {
          DB.meta.activa = false;
          DB.guardarMeta();

          render();

        });
        break;

      /* ------------------- optimización de la ruta ---------------------- */
      case "ubicar-direcciones": {
        var rutaUbicar = C.rutaDeReparto(st, ui.ruta);
        var porUbicar = rutaUbicar.pedidos.map(function (p) { return C.getCliente(st, p.clienteId); })
          .filter(function (c) { return c && !C.coordenadasDe(c); });
        ubicarClientes(porUbicar);

      }
      case "optimizar-ruta": {
        var selectorVolver = document.getElementById("optimizar-volver-base");
        ui.optimizarVolverBase = !(selectorVolver && selectorVolver.value === "no");
        optimizarRutaDelDia();
        break;
      }
      case "volver-orden-direccion":
        confirmar({
          titulo: "Volver al orden por dirección",
          mensaje: "Se quitará el orden optimizado de este día y las entregas volverán a ordenarse por comuna, calle y número.",
          textoOk: "Volver", claseOk: "peligro"
        }, function () {
          var quitados = C.limpiarOrdenRuta(st, ui.ruta.fecha);
          guardarYRender(quitados ? "Se quitó el orden optimizado del día." : "Este día no tenía orden optimizado.",
            quitados ? "exito" : "aviso");
        });
        break;
      case "navegar-proxima": {
        var rutaNav = C.rutaDeReparto(st, ui.ruta);
        var siguiente = rutaNav.secuencia.filter(function (x) {
          return x.pedido.estado === "PENDIENTE" || x.pedido.estado === "EN_REPARTO";
        })[0];
        if (!siguiente) { toast("Ya no quedan entregas pendientes en este día.", "exito"); return; }
        if (abrirDestino(destinoDeCliente(siguiente.cliente))) {
          toast("Abriendo " + (appMapas() === "google" ? "Google Maps" : "Waze") + " hacia " +
            C.nombreCompleto(siguiente.cliente) + ".", "aviso");
        }
        break;
      }
      case "abrir-recorrido": {
        var rutaAbrir = C.rutaDeReparto(st, ui.ruta);
        var puntos = rutaAbrir.secuencia.map(function (x) { return C.coordenadasDe(x.cliente); }).filter(Boolean);
        if (!root.HuevosMapa) { toast("Los mapas no están disponibles.", "error"); return; }
        var enlace = root.HuevosMapa.enlaceRecorrido(puntos, {
          base: C.baseDe(st), volverBase: ui.optimizarVolverBase !== false
        });
        if (!enlace) { toast("No hay direcciones ubicadas para abrir el recorrido.", "aviso"); return; }
        abrirUrl(enlace);
        break;
      }
      case "ubicar-cliente": {
        var clienteUbicar = C.getCliente(st, d.id);
        if (clienteUbicar) { ubicarClientes([clienteUbicar]); }
        break;
      }
      case "olvidar-ubicacion": {
        var clienteOlvidar = C.getCliente(st, d.id);
        if (!clienteOlvidar) { return; }
        clienteOlvidar.lat = null;
        clienteOlvidar.lon = null;
        clienteOlvidar.ubicacionFuente = "";
        clienteOlvidar.actualizadoEn = C.ahoraISO();
        guardarYRender("Se olvidó la ubicación de " + C.nombreCompleto(clienteOlvidar) + ".");
        break;
      }
      case "guardar-base": {
        var campoBase = document.getElementById("direccion-base");
        var direccion = campoBase ? campoBase.value.trim() : "";
        if (!direccion) { toast("Escribe la dirección de partida.", "error"); return; }
        if (direccion !== (st.config.direccionBase || "")) {
          st.config.baseLat = null;   // dirección nueva: hay que volver a ubicarla
          st.config.baseLon = null;
        }
        C.guardarBase(st, { direccion: direccion });
        guardarYRender("Punto de partida guardado. Ubícalo en el mapa para usarlo.");
        break;
      }
      case "ubicar-base": {
        var campoBase2 = document.getElementById("direccion-base");
        if (campoBase2 && campoBase2.value.trim()) { C.guardarBase(st, { direccion: campoBase2.value.trim() }); }
        var textoBase = st.config.direccionBase || "";
        if (!textoBase) { toast("Escribe primero la dirección de partida.", "error"); return; }
        if (!mapaDisponible()) { toast("Este navegador no puede consultar los mapas.", "error"); return; }
        estadoSync.optimizando = true;
        render();
        root.HuevosMapa.ubicar(textoBase + ", Chile").then(function (ubicacion) {
          estadoSync.optimizando = false;
          if (!ubicacion) { render(); toast("No se encontró esa dirección.", "aviso"); return; }
          C.guardarBase(st, { lat: ubicacion.lat, lon: ubicacion.lon });
          guardarYRender("Punto de partida ubicado en el mapa.");
        }, function (error) {
          estadoSync.optimizando = false;
          render();
          toast(String((error && error.message) || error), "error");
        });
        break;
      }

      /* ---------------------------- impresión --------------------------- */
      case "imprimir":
        window.print();
        break;
      case "imprimir-pedido-semanal":
        imprimirPedidoSemanal(false);
        break;
      case "imprimir-pedido-semanal-utilidad":
        imprimirPedidoSemanal(true);
        break;
      case "imprimir-ruta":
        imprimirRutaDia();
        break;
      case "imprimir-utilidad":
        imprimirUtilidad();
        break;

      /* ------------------------------- ruta ----------------------------- */
      case "abrir-mapa":
        abrirMapa(el);
        break;
      case "ruta-fecha":
        if (d.fecha) { ui.ruta.fecha = d.fecha; render(); }
        break;

      /* ------------------------ importar clientes ----------------------- */
      case "importar-clientes":
        if (sheetAbierto()) { cerrarSheet(); }
        sheetImportarClientes();
        break;
      case "previa-importacion-texto": {
        var areaImport = document.getElementById("importar-clientes-texto");
        var contenidoImport = areaImport ? areaImport.value.trim() : "";
        if (!contenidoImport) { toast("Elige un archivo o pega primero el contenido.", "error"); return; }
        try { iniciarImportacionDesdeTexto(contenidoImport, "datos pegados"); }
        catch (e) { toast("No se pudo leer el texto: " + e.message, "error"); }
        break;
      }
      case "confirmar-importacion": {
        var imp = ui.importacion;
        if (!imp) { toast("Vuelve a elegir el archivo.", "error"); return; }
        var analisis = imp.analisis || C.analizarImportacion(st, imp.filas, {
          mapeo: imp.mapeo,
          tieneEncabezados: imp.tieneEncabezados,
          comunaPorDefecto: imp.opciones.comunaPorDefecto,
          diaPorDefecto: imp.opciones.diaPorDefecto,
          modoExistentes: imp.opciones.modoExistentes
        });
        var importables = analisis.resumen.importables;
        if (!importables) { toast("No hay clientes por importar con esta configuración.", "aviso"); return; }
        confirmar({
          titulo: "Importar clientes",
          mensaje: "Se crearán " + analisis.resumen.nuevos + " cliente(s) nuevo(s)" +
            (analisis.resumen.actualiza ? " y se actualizarán " + analisis.resumen.actualiza : "") +
            ". Si un cliente ya existe, se " + (analisis.opciones.modoExistentes === "ACTUALIZAR" ? "actualizará" : "omitirá") +
            ". Los clientes actuales nunca se eliminan. ¿Continuar?",
          textoOk: "Importar " + importables, claseOk: "primario"
        }, function () {
          var res = C.importarClientes(st, analisis, imp.opciones);
          DB.guardar();
          ui.importacion = null;
          cerrarSheet();
          ir("clientes");
          toast("Importación terminada: " + res.creados + " creados, " + res.actualizados + " actualizados, " +
            res.omitidos + " omitidos" + (res.errores.length ? ", " + res.errores.length + " con error" : "") + ".",
            (res.creados || res.actualizados) ? "exito" : "aviso");
          if (res.errores.length) { sheetResultadoImportacion(res); }
        });
        break;
      }
      case "descargar-plantilla":
        descargarPlantilla();
        break;

      /* --------------------------- configuración ------------------------ */
      case "guardar-valor": {
        var inputValor = document.getElementById("nuevo-valor");
        var res11 = C.setValorBandeja(st, inputValor ? inputValor.value : 0);
        if (!res11.ok) { toast(res11.motivo, "error"); return; }
        guardarYRender(res11.sinCambios ? "El valor no cambió." : "Valor de la bandeja actualizado a " + C.formatCLP(res11.valor) +
          ". Los pedidos ya generados conservan su precio original.");
        break;
      }
      case "guardar-costo": {
        var inputCosto = document.getElementById("nuevo-costo");
        var resCosto = C.setValorCompra(st, inputCosto ? inputCosto.value : 0);
        if (!resCosto.ok) { toast(resCosto.motivo, "error"); return; }
        guardarYRender(resCosto.sinCambios ? "El costo no cambió." : "Valor de compra actualizado a " + C.formatCLP(resCosto.valor) +
          ". Los pedidos ya generados conservan su costo anterior.");
        break;
      }
      case "guardar-config": {
        var cfgForm = readForm(document.getElementById("view-config"));
        C.actualizarConfig(st, cfgForm);
        guardarYRender("Configuración guardada.");
        break;
      }
      case "agregar-comuna":
      case "agregar-zona": {
        var esComuna = accion === "agregar-comuna";
        var input = document.getElementById(esComuna ? "nueva-comuna" : "nueva-zona");
        var valor = input ? input.value.trim() : "";
        if (!valor) { toast("Escribe un nombre.", "error"); return; }
        var lista = esComuna ? (st.config.comunas || []) : (st.config.zonas || []);
        if (lista.indexOf(valor) >= 0) { toast("Ya existe.", "aviso"); return; }
        lista.push(valor);
        guardarYRender((esComuna ? "Comuna" : "Zona") + " agregada.");
        break;
      }
      case "quitar-comuna":
      case "quitar-zona": {
        var esC = accion === "quitar-comuna";
        var valorQ = el.dataset.valor;
        confirmar({
          titulo: "Quitar " + (esC ? "comuna" : "zona"),
          mensaje: "¿Quitar «" + valorQ + "» de la lista? Los clientes que ya la tengan asignada no se modifican.",
          textoOk: "Quitar", claseOk: "peligro"
        }, function () {
          if (esC) { st.config.comunas = (st.config.comunas || []).filter(function (x) { return x !== valorQ; }); }
          else { st.config.zonas = (st.config.zonas || []).filter(function (x) { return x !== valorQ; }); }
          guardarYRender("Lista actualizada.");
        });
        break;
      }

      /* ------------------------------ respaldo -------------------------- */
      case "descargar-respaldo": {
        var nombre = "respaldo-huevos-" + C.hoyISO() + ".json";
        descargarArchivo(nombre, C.exportar(st));
        break;
      }
      case "copiar-respaldo": {
        var texto = C.exportar(st);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(texto).then(function () {
            toast("Respaldo copiado al portapapeles.", "exito");
          }, function () {
            toast("No se pudo copiar. Abre «Ver respaldo» y cópialo manualmente.", "error");
          });
        } else {
          var ta = document.getElementById("texto-respaldo");
          if (ta) { ta.removeAttribute("readonly"); ta.select(); }
          toast("Copia manualmente el texto del respaldo.", "aviso");
        }
        break;
      }
      case "restaurar-importacion": {
        var area = document.getElementById("importar-texto");
        var contenido = area ? area.value.trim() : "";
        if (!contenido) { toast("Selecciona un archivo o pega el contenido del respaldo.", "error"); return; }
        var nuevo;
        try { nuevo = C.importar(contenido); }
        catch (err) { toast("Respaldo inválido: " + err.message, "error"); return; }
        confirmar({
          titulo: "Restaurar respaldo",
          mensaje: "Se reemplazarán todos los datos actuales por " + nuevo.clientes.length + " clientes, " +
            nuevo.pedidos.length + " pedidos y " + nuevo.pagos.length + " pagos. ¿Continuar?",
          textoOk: "Restaurar", claseOk: "peligro"
        }, function () {
          DB.reemplazar(nuevo);
          toast("Respaldo restaurado correctamente.", "exito");
          ir("inicio");
        });
        break;
      }
      case "cargar-ejemplo":
        confirmar({
          titulo: "Cargar datos de ejemplo",
          mensaje: "Se reemplazarán los datos actuales por 6 clientes de prueba con pedidos habituales. ¿Continuar?",
          textoOk: "Cargar ejemplo", claseOk: "primario"
        }, function () {
          DB.reemplazar(C.datosEjemplo());
          toast("Datos de ejemplo cargados.", "exito");
          ir("inicio");
        });
        break;
      case "borrar-todo":
        confirmar({
          titulo: "Borrar todos los datos",
          mensaje: "Se eliminarán clientes, pedidos, pagos y configuración de este teléfono. Esta acción no se puede deshacer.",
          textoOk: "Borrar todo", claseOk: "peligro"
        }, function () {
          DB.borrarTodo(C);
          toast("Todos los datos fueron eliminados.", "aviso");
          ir("inicio");
        });
        break;

      default:
        break;
    }
  }

  /* ======================================================================== */
  /* 9. Eventos                                                               */
  /* ======================================================================== */

  function onClick(evento) {
    var el = evento.target.closest ? evento.target.closest("[data-action]") : null;
    if (!el) { return; }
    var accion = el.getAttribute("data-action");
    // Clic sobre el fondo del sheet/diálogo (no sobre su contenido)
    if (accion === "cerrar-sheet" && el.classList.contains("sheet-fondo") &&
      evento.target !== el && el.contains(evento.target) && evento.target.closest(".sheet")) { return; }
    evento.preventDefault();
    manejarAccion(accion, el);
  }

  function onChange(evento) {
    var el = evento.target;
    if (!el || !el.id) { return; }
    if (el.id === "ruta-fecha") { ui.ruta.fecha = el.value; render(); }
    else if (el.id === "ruta-comuna") { ui.ruta.comuna = el.value; render(); }
    else if (el.id === "ruta-zona") { ui.ruta.zona = el.value; render(); }
    else if (el.id === "ruta-estado") {
      var clave = Object.keys(C.ESTADOS_LABEL).filter(function (k) { return C.ESTADOS_LABEL[k] === el.value; })[0] || "";
      ui.ruta.estado = clave;
      render();
    }
    else if (el.id === "ruta-orden") { ui.ruta.orden = el.value; render(); }
    else if (el.id.indexOf("saltar-") === 0 && el.value) {
      var destino = el.id.replace("saltar-", "");
      ui[semanaDe(destino)] = C.weekKeyFromISO(el.value);
      if (destino === "generar") { ui.previa = null; ui.ultimaGeneracion = null; }
      render();
    }
    else if (el.id === "f-clienteId") { actualizarInfoPago(); }
    else if (el.id === "app-mapas") {
      C.actualizarConfig(DB.state, { appMapas: el.value });
      guardarYRender(el.value === "google" ? "Las entregas se abrirán en Google Maps." : "Las entregas se abrirán en Waze.");
    }
    else if (el.id === "archivo-clientes") { procesarArchivoClientes(el.files && el.files[0]); }
    else if (el.id.indexOf("imp-") === 0) { actualizarVistaPreviaImportacion(); }
    else if (el.id === "archivo-respaldo") {
      var archivo = el.files && el.files[0];
      if (!archivo) { return; }
      var lector = new FileReader();
      lector.onload = function () {
        var area = document.getElementById("importar-texto");
        if (area) { area.value = lector.result; }
        toast("Archivo cargado. Presiona «Restaurar respaldo» para confirmar.", "aviso");
      };
      lector.readAsText(archivo);
    }
  }

  function onInput(evento) {
    var el = evento.target;
    if (!el || !el.id) { return; }
    if (el.id === "clientes-buscar") { ui.busquedaClientes = el.value; renderClientes(); }
    else if (el.id === "deudas-buscar") { ui.busquedaDeudas = el.value; renderDeudas(); }
  }

  /* ======================================================================== */
  /* 10. Arranque                                                             */
  /* ======================================================================== */

  function init() {
    var hoy = C.hoyISO();
    var semana = C.weekKeyFromDate(new Date());
    ui = {
      vista: "inicio",
      params: {},
      semanaInicio: semana,
      semanaPedidos: semana,
      semanaGenerar: semana,
      semanaInformes: semana,
      filtroClientes: "ACTIVOS",
      filtroPedidos: "TODOS",
      ordenClientes: "apellido",
      modoSeleccion: false,
      seleccionClientes: [],
      busquedaClientes: "",
      busquedaDeudas: "",
      ruta: { fecha: hoy, comuna: "", zona: "", estado: "", orden: "comuna" },
      previa: null,
      ultimaGeneracion: null,
      importacion: null,
      optimizarVolverBase: true
    };

    document.addEventListener("click", onClick);
    document.addEventListener("change", onChange);
    document.addEventListener("input", onInput);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { cerrarSheet(); cerrarDialogo(); cerrarMenu(); }
    });

    instalarSincronizacionAutomatica();

    if (DB.esMemoria) {
      var aviso = document.getElementById("aviso-almacen");
      if (aviso) {
        aviso.classList.remove("oculto");
        aviso.textContent = "⚠️ Este navegador no permite guardar datos de forma permanente. Usa Respaldo → Descargar respaldo para no perder información.";
      }
    }

    ir("inicio");
  }

  UI.init = init;
  UI.ir = ir;
  UI.render = render;
  UI.state = function () { return ui; };

  root.HuevosUI = UI;
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>
/* ==== js/app.js ==== */
/* ============================================================================
 * app.js — Arranque de HuevosReparto
 * ----------------------------------------------------------------------------
 * Une la lógica (core.js), el almacenamiento (db.js) y la interfaz (ui.js).
 * ========================================================================== */
(function () {
  "use strict";

  function mostrarError(mensaje) {
    var app = document.getElementById("app");
    if (app) {
      app.innerHTML = '<div class="vacio"><span class="emoji">⚠️</span>' + mensaje + '</div>';
    }
  }

  function arrancar() {
    if (!window.HuevosCore || !window.HuevosDB || !window.HuevosUI) {
      mostrarError("No se pudieron cargar los módulos de la aplicación (core.js, db.js, ui.js). Verifica que los archivos estén en la misma carpeta.");
      return;
    }
    try {
      window.HuevosDB.init(window.HuevosCore);
    // Folios únicos por dispositivo (evita choques al sincronizar dos equipos)
    window.HuevosCore.configurarFirmaDispositivo(window.HuevosDB.firmaDispositivo());
      window.HuevosUI.init();
    } catch (e) {
      mostrarError("Error al iniciar la aplicación: " + e.message);
      return;
    }

    // Guardado de seguridad al minimizar o cerrar el navegador del teléfono.
    window.addEventListener("pagehide", function () { window.HuevosDB.guardar(); });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { window.HuevosDB.guardar(); }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", arrancar);
  } else {
    arrancar();
  }
})();

</script>
<script>
/* Registra el service worker para que la aplicación quede instalada y
   funcione sin internet. Sólo se intenta cuando se sirve por http(s). */
if ("serviceWorker" in navigator && (location.protocol === "https:" ||
    location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { });
  });
}
</script>
