  /* ---------------------------------------------------------------------- */
  /* IMPORTACIÓN DE CLIENTES DESDE EXCEL / CSV                               */
  /* ---------------------------------------------------------------------- */

  /** Campos que la aplicación sabe reconocer en un archivo importado. */
  var CAMPOS_IMPORTACION = [
    { clave: "nombre", etiqueta: "Nombre *", alias: ["nombre", "nombres", "nombre completo", "nombre cliente", "cliente"] },
    { clave: "apellido", etiqueta: "Apellido", alias: ["apellido", "apellidos"] },
    { clave: "telefono", etiqueta: "Teléfono", alias: ["telefono", "fono", "celular", "movil", "whatsapp", "contacto"] },
    { clave: "calle", etiqueta: "Calle", alias: ["calle", "direccion", "domicilio", "pasaje", "avenida", "av"] },
    { clave: "numero", etiqueta: "Número", alias: ["numero", "nro", "num", "numero de casa", "numeracion"] },
    { clave: "comuna", etiqueta: "Comuna", alias: ["comuna", "ciudad"] },
    { clave: "zona", etiqueta: "Zona", alias: ["zona", "sector", "grupo", "ruta"] },
    { clave: "observaciones", etiqueta: "Observaciones", alias: ["observaciones", "observacion", "obs", "notas", "nota", "comentarios", "comentario"] },
    { clave: "hab_activo", etiqueta: "Pedido habitual", alias: ["pedido habitual", "pedido semanal", "pedido fijo", "habitual", "pedido"] },
    { clave: "hab_bandejas", etiqueta: "Bandejas", alias: ["bandejas por semana", "cantidad de bandejas", "bandejas", "cantidad", "cant"] },
    { clave: "hab_dia", etiqueta: "Día de reparto", alias: ["dia de reparto", "dia reparto", "dias", "dia", "frecuencia"] },
    { clave: "estado", etiqueta: "Estado", alias: ["estado", "situacion", "activo"] }
  ];

  /** Quita tildes y mayúsculas para comparar textos escritos por humanos. */
  function normalizarClave(texto) {
    var t = String(texto == null ? "" : texto);
    if (t.normalize) { t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
    return t.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  }

  function puntajeCoincidencia(encabezado, alias) {
    if (!encabezado || !alias) { return 0; }
    if (encabezado === alias) { return 4; }
    if (encabezado.indexOf(alias) === 0) { return 3; }
    var escapado = alias.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (new RegExp("(^| )" + escapado + "( |$)").test(encabezado)) { return 2; }
    if (alias.length >= 4 && encabezado.indexOf(alias) >= 0) { return 1; }
    return 0;
  }

  /** Adivina qué columna corresponde a cada campo, a partir de los encabezados. */
  function detectarMapeo(encabezados) {
    var columnas = (encabezados || []).map(function (h) { return normalizarClave(h); });
    var mapeo = {};
    CAMPOS_IMPORTACION.forEach(function (campo) {
      var mejor = -1, mejorPuntaje = 0;
      columnas.forEach(function (columna, i) {
        campo.alias.forEach(function (alias) {
          var p = puntajeCoincidencia(columna, normalizarClave(alias));
          if (p > mejorPuntaje) { mejorPuntaje = p; mejor = i; }
        });
      });
      mapeo[campo.clave] = mejor;
    });
    return mapeo;
  }

  function esVerdadero(texto) {
    var t = normalizarClave(texto);
    if (!t) { return false; }
    return ["si", "s", "x", "1", "true", "verdadero", "activo", "activado", "yes", "y", "habitual", "on", "ok", "tiene"].indexOf(t) >= 0;
  }

  function esFalso(texto) {
    var t = normalizarClave(texto);
    if (!t) { return false; }
    return ["no", "n", "0", "false", "falso", "inactivo", "desactivado", "ninguno", "sin"].indexOf(t) >= 0;
  }

  function normalizarDia(texto) {
    var t = normalizarClave(texto);
    if (!t) { return ""; }
    for (var i = 0; i < DIAS.length; i++) {
      if (t.indexOf(normalizarClave(DIAS[i])) >= 0) { return DIAS[i]; }
    }
    for (var j = 0; j < DIAS.length; j++) {
      if (t.indexOf(normalizarClave(DIAS_CORTOS[DIAS[j]])) === 0) { return DIAS[j]; }
    }
    return "";
  }

  function celdaDe(fila, indice) {
    if (indice == null || indice < 0 || !fila) { return ""; }
    var v = fila[indice];
    return v == null ? "" : String(v).trim();
  }

  function soloDigitos(texto) { return String(texto == null ? "" : texto).replace(/\D/g, ""); }

  /** Convierte una fila del archivo en los datos de un cliente. */
  function extraerDatosImportacion(fila, mapeo, opciones) {
    mapeo = mapeo || {};
    opciones = opciones || {};
    var datos = {
      nombre: celdaDe(fila, mapeo.nombre),
      apellido: celdaDe(fila, mapeo.apellido),
      telefono: celdaDe(fila, mapeo.telefono),
      calle: celdaDe(fila, mapeo.calle),
      numero: celdaDe(fila, mapeo.numero),
      comuna: celdaDe(fila, mapeo.comuna) || String(opciones.comunaPorDefecto || "").trim(),
      zona: celdaDe(fila, mapeo.zona),
      observaciones: celdaDe(fila, mapeo.observaciones),
      estado: "ACTIVO",
      pedidoHabitual: { activo: false, bandejas: 0, dia: "", observaciones: "" }
    };

    // Estado del cliente
    var estado = celdaDe(fila, mapeo.estado);
    if (estado) { datos.estado = esFalso(estado) ? "INACTIVO" : (esVerdadero(estado) ? "ACTIVO" : (normalizarClave(estado).indexOf("inactiv") >= 0 ? "INACTIVO" : "ACTIVO")); }

    // Pedido habitual: la columna "Pedido" puede traer "Sí/No" o directamente la cantidad
    var valorHab = celdaDe(fila, mapeo.hab_activo);
    var valorBandejas = celdaDe(fila, mapeo.hab_bandejas);
    var habEsCantidad = /^\d+([.,]\d+)?$/.test(valorHab) && !valorBandejas;
    var bandejas = valorBandejas ? (parseInt(soloDigitos(valorBandejas), 10) || 0) : 0;

    if (habEsCantidad) {
      datos.pedidoHabitual.bandejas = parseInt(valorHab, 10);
      datos.pedidoHabitual.activo = datos.pedidoHabitual.bandejas > 0;
    } else {
      datos.pedidoHabitual.activo = esVerdadero(valorHab);
      datos.pedidoHabitual.bandejas = bandejas;
      if (!valorHab && bandejas > 0) { datos.pedidoHabitual.activo = true; }
    }
    if (esFalso(valorHab)) { datos.pedidoHabitual.activo = false; datos.pedidoHabitual.bandejas = 0; }

    datos.pedidoHabitual.dia = datos.pedidoHabitual.activo
      ? (normalizarDia(celdaDe(fila, mapeo.hab_dia)) || String(opciones.diaPorDefecto || ""))
      : "";
    return datos;
  }

  function validarDatosImportacion(datos) {
    var errores = [];
    if (!String(datos.nombre || "").trim()) { errores.push("Falta el nombre."); }
    if (datos.pedidoHabitual.activo && datos.pedidoHabitual.bandejas < 1) {
      errores.push("El pedido habitual está activo pero no tiene cantidad de bandejas.");
    }
    return errores;
  }

  /**
   * Claves para detectar clientes repetidos: teléfono (si lo hay) y nombre +
   * apellido + comuna. Se usa la primera como principal, pero para comparar se
   * consideran todas, de modo que un mismo cliente se reconozca aunque el
   * archivo traiga el teléfono y la base no (o al revés).
   */
  function clavesDeCliente(datos) {
    var claves = [];
    var tel = soloDigitos(datos.telefono);
    if (tel.length >= 6) { claves.push("tel:" + tel); }
    var nombre = normalizarClave([datos.nombre, datos.apellido, datos.comuna].join(" "));
    if (nombre) { claves.push("nom:" + nombre); }
    return claves;
  }

  function claveDeCliente(datos) {
    var claves = clavesDeCliente(datos);
    return claves.length ? claves[0] : "";
  }

  /**
   * Analiza el archivo SIN modificar nada: valida filas, detecta duplicados
   * (en el archivo y contra los clientes ya existentes) y clasifica cada fila.
   */
  function analizarImportacion(state, filas, opciones) {
    opciones = opciones || {};
    filas = filas || [];
    var tieneEncabezados = opciones.tieneEncabezados !== false;
    var encabezados = (filas[0] || []).map(function (h, i) {
      var texto = String(h == null ? "" : h).trim();
      return texto || ("Columna " + (i + 1));
    });
    var cuerpo = tieneEncabezados ? filas.slice(1) : filas.slice();
    var mapeo = opciones.mapeo || detectarMapeo(encabezados);
    var modo = opciones.modoExistentes === "ACTUALIZAR" ? "ACTUALIZAR" : "OMITIR";

    // Índice de clientes existentes por teléfono y por nombre+comuna
    var existentes = {};
    state.clientes.forEach(function (c) {
      clavesDeCliente(c).forEach(function (k) {
        if (existentes[k] === undefined) { existentes[k] = c.id; }
      });
    });

    var vistos = {};
    var resultados = [];
    cuerpo.forEach(function (fila, i) {
      var numeroFila = i + (tieneEncabezados ? 2 : 1);
      if (!fila || !fila.some(function (x) { return String(x == null ? "" : x).trim() !== ""; })) { return; }
      var datos = extraerDatosImportacion(fila, mapeo, opciones);
      var errores = validarDatosImportacion(datos);
      var claves = clavesDeCliente(datos);
      var repetidaEnArchivo = claves.filter(function (k) { return vistos[k]; })[0];
      var existenteId = claves.map(function (k) { return existentes[k]; }).filter(function (v) { return v !== undefined; })[0];
      var resultado = {
        numero: numeroFila,
        datos: datos,
        clave: claves.length ? claves[0] : "",
        errores: errores,
        estado: "NUEVO",
        clienteId: null,
        referencia: ""
      };
      if (errores.length) {
        resultado.estado = "ERROR";
      } else if (repetidaEnArchivo) {
        resultado.estado = "DUPLICADO";
        resultado.referencia = vistos[repetidaEnArchivo];
      } else if (existenteId !== undefined) {
        resultado.clienteId = existenteId;
        resultado.estado = modo === "ACTUALIZAR" ? "ACTUALIZA" : "OMITE";
      }
      claves.forEach(function (k) {
        if (!vistos[k]) { vistos[k] = resultado.clienteId ? ("cliente " + resultado.clienteId) : ("fila " + numeroFila); }
      });
      resultados.push(resultado);
    });

    var resumen = { total: resultados.length, nuevos: 0, actualiza: 0, omite: 0, duplicados: 0, errores: 0, importables: 0 };
    resultados.forEach(function (r) {
      if (r.estado === "NUEVO") { resumen.nuevos++; }
      else if (r.estado === "ACTUALIZA") { resumen.actualiza++; }
      else if (r.estado === "OMITE") { resumen.omite++; }
      else if (r.estado === "DUPLICADO") { resumen.duplicados++; }
      else { resumen.errores++; }
    });
    resumen.importables = resumen.nuevos + resumen.actualiza;

    return {
      encabezados: encabezados,
      mapeo: mapeo,
      opciones: { tieneEncabezados: tieneEncabezados, modoExistentes: modo, comunaPorDefecto: opciones.comunaPorDefecto || "", diaPorDefecto: opciones.diaPorDefecto || "" },
      filas: resultados,
      resumen: resumen
    };
  }

  /**
   * Aplica una importación ya analizada.
   * Al actualizar un cliente existente, las celdas vacías del archivo NO borran
   * los datos que ya tenía (sólo se reemplaza lo que viene con información).
   */
  function importarClientes(state, analisis, opciones) {
    opciones = opciones || {};
    var res = { creados: 0, actualizados: 0, omitidos: 0, total: 0, errores: [], creadosIds: [], actualizadosIds: [] };
    if (!analisis || !analisis.filas) { return res; }
    res.total = analisis.filas.length;

    analisis.filas.forEach(function (f) {
      if (f.estado === "ERROR") {
        res.errores.push({ numero: f.numero, nombre: nombreCompleto(f.datos), mensajes: f.errores });
        return;
      }
      if (f.estado === "OMITE" || f.estado === "DUPLICADO") { res.omitidos++; return; }

      if (f.estado === "NUEVO") {
        var creado = crearCliente(state, f.datos);
        if (creado.ok) { res.creados++; res.creadosIds.push(creado.cliente.id); }
        else { res.errores.push({ numero: f.numero, nombre: nombreCompleto(f.datos), mensajes: [creado.motivo] }); }
        return;
      }

      if (f.estado === "ACTUALIZA") {
        var actual = getCliente(state, f.clienteId);
        if (!actual) { res.omitidos++; return; }
        var mezcla = {
          nombre: f.datos.nombre || actual.nombre,
          apellido: f.datos.apellido || actual.apellido,
          telefono: f.datos.telefono || actual.telefono,
          calle: f.datos.calle || actual.calle,
          numero: f.datos.numero || actual.numero,
          comuna: f.datos.comuna || actual.comuna,
          zona: f.datos.zona || actual.zona,
          observaciones: f.datos.observaciones || actual.observaciones,
          estado: f.datos.estado || actual.estado,
          ordenManual: actual.ordenManual,
          pedidoHabitual: {
            activo: f.datos.pedidoHabitual.activo || (f.datos.pedidoHabitual.bandejas > 0),
            bandejas: f.datos.pedidoHabitual.bandejas > 0 ? f.datos.pedidoHabitual.bandejas : actual.pedidoHabitual.bandejas,
            dia: f.datos.pedidoHabitual.dia || actual.pedidoHabitual.dia,
            observaciones: f.datos.pedidoHabitual.observaciones || actual.pedidoHabitual.observaciones
          }
        };
        if (f.datos.pedidoHabitual.bandejas === 0 && !f.datos.pedidoHabitual.activo && f.datos.pedidoHabitual.dia === "") {
          mezcla.pedidoHabitual = actual.pedidoHabitual;   // el archivo no traía información de pedido habitual
        }
        var r = actualizarCliente(state, f.clienteId, mezcla);
        if (r.ok) { res.actualizados++; res.actualizadosIds.push(f.clienteId); }
        else { res.errores.push({ numero: f.numero, nombre: nombreCompleto(f.datos), mensajes: [r.motivo] }); }
      }
    });

    state.actualizadoEn = ahoraISO();
    return res;
  }

  /** Filas de la plantilla de ejemplo que se descarga desde la aplicación. */
  function plantillaImportacion() {
    return {
      encabezados: ["Nombre", "Apellido", "Teléfono", "Calle", "Número", "Comuna", "Zona", "Observaciones",
        "Pedido habitual", "Bandejas", "Día de reparto"],
      filas: [
        ["Juan", "Pérez", "911111111", "Av. Apoquindo", "1234", "Las Condes", "Oriente", "Dejar en conserjería", "Sí", 3, "Miércoles"],
        ["María", "González", "922222222", "Av. Príncipe de Gales", "2345", "La Reina", "", "", "No", 0, ""],
        ["Pedro", "Soto", "933333333", "Av. Irarrázaval", "3456", "Ñuñoa", "Centro", "Timbre 2 veces", "Sí", 4, "Jueves"]
      ]
    };
  }

  /* ---------------------------------------------------------------------- */
  /* Exportación                                                             */
  /* ---------------------------------------------------------------------- */

  return {
    VERSION_DATOS: VERSION_DATOS,
    DIAS: DIAS, DIAS_LABEL: DIAS_LABEL, DIAS_CORTOS: DIAS_CORTOS,
    ESTADOS_PEDIDO: ESTADOS_PEDIDO, ESTADOS_LABEL: ESTADOS_LABEL, ESTADOS_CLASE: ESTADOS_CLASE,
    MEDIOS_PAGO: MEDIOS_PAGO, MEDIOS_LABEL: MEDIOS_LABEL,
    TIPOS_PEDIDO: TIPOS_PEDIDO, TIPOS_LABEL: TIPOS_LABEL,
    // utilidades
    pad2: pad2, isoDate: isoDate, parseISO: parseISO, hoyISO: hoyISO, addDays: addDays, ahoraISO: ahoraISO,
    formatMiles: formatMiles, formatCLP: formatCLP, formatFechaCorta: formatFechaCorta,
    formatFechaLarga: formatFechaLarga, formatHora: formatHora,
    // semanas
    getISOWeekInfo: getISOWeekInfo, weekKeyFromDate: weekKeyFromDate, weekKeyFromISO: weekKeyFromISO,
    weekRange: weekRange, weekLabel: weekLabel, shiftWeek: shiftWeek, diaDeLaSemana: diaDeLaSemana,
    nombreDiaDeISO: nombreDiaDeISO, estaEnRango: estaEnRango,
    // estado
    estadoVacio: estadoVacio, datosEjemplo: datosEjemplo, findBy: findBy,
    getCliente: getCliente, getPedido: getPedido, nombreCompleto: nombreCompleto,
    direccionCompleta: direccionCompleta, zonaDe: zonaDe,
    // clientes
    crearCliente: crearCliente, actualizarCliente: actualizarCliente, eliminarCliente: eliminarCliente,
    eliminarClientes: eliminarClientes, inactivarClientes: inactivarClientes, activarClientes: activarClientes,
    primerApellido: primerApellido, compararClientes: compararClientes, claveOrdenCliente: claveOrdenCliente,
    textoComparable: textoComparable, coincideBusqueda: coincideBusqueda,
    // pedidos
    previsualizarGeneracion: previsualizarGeneracion, generarPedidos: generarPedidos,
    crearPedidoExtraordinario: crearPedidoExtraordinario, modificarPedido: modificarPedido,
    cambiarEstadoPedido: cambiarEstadoPedido, marcarEntregado: marcarEntregado, eliminarPedido: eliminarPedido,
    listarPedidos: listarPedidos, buscarPedidoSemanal: buscarPedidoSemanal, tienePedidoSemanal: tienePedidoSemanal,
    rutaDeReparto: rutaDeReparto, valorBandejaVigente: valorBandejaVigente,
    // pagos
    registrarPago: registrarPago, eliminarPago: eliminarPago, listarPagos: listarPagos,
    // informes
    resumenCliente: resumenCliente, informeDeudas: informeDeudas, informeSemanal: informeSemanal,
    dashboard: dashboard, calcularEstadoCliente: calcularEstadoCliente, tieneHistorial: tieneHistorial,
    informePedidoSemanal: informePedidoSemanal,
    compararTexto: compararTexto, numeroDeCalle: numeroDeCalle, ordenarPorComunaDireccion: ordenarPorComunaDireccion,
    // optimización de la ruta por distancia
    distanciaKm: distanciaKm, coordenadasDe: coordenadasDe, baseDe: baseDe,
    optimizarRuta: optimizarRuta, largoRecorrido: largoRecorrido,
    aplicarOrdenRuta: aplicarOrdenRuta, limpiarOrdenRuta: limpiarOrdenRuta,
    guardarUbicacion: guardarUbicacion, guardarBase: guardarBase,
    clientesSinUbicacion: clientesSinUbicacion,
    // utilidad (venta - costo de compra al proveedor)
    costoVigente: costoVigente, costoDePedido: costoDePedido, utilidadDePedido: utilidadDePedido,
    informeUtilidad: informeUtilidad, informesUtilidadMensual: informesUtilidadMensual,
    // config y respaldo
    setValorBandeja: setValorBandeja, setValorCompra: setValorCompra, actualizarConfig: actualizarConfig,
    configurarFirmaDispositivo: configurarFirmaDispositivo, firmaActual: firmaActual,
    exportar: exportar, importar: importar,
    // sincronización entre dispositivos
    fusionarEstados: fusionarEstados, textoInformeFusion: textoInformeFusion,
    normalizarLapidas: normalizarLapidas, marcarEliminado: marcarEliminado,
    estaEliminado: estaEliminado, marcaDe: marcaDe, documento: documento, huella: huella,
    // importación de clientes (Excel / CSV)
    CAMPOS_IMPORTACION: CAMPOS_IMPORTACION,
    normalizarClave: normalizarClave, normalizarDia: normalizarDia,
    detectarMapeo: detectarMapeo, extraerDatosImportacion: extraerDatosImportacion,
    validarDatosImportacion: validarDatosImportacion, claveDeCliente: claveDeCliente, clavesDeCliente: clavesDeCliente,
    analizarImportacion: analizarImportacion, importarClientes: importarClientes,
    plantillaImportacion: plantillaImportacion
  };
});

<script>
/* ==== js/db.js ==== */
/* ============================================================================
 * db.js — Persistencia local (LocalStorage) con adaptador intercambiable
 * ----------------------------------------------------------------------------
 * La app trabaja siempre contra `DB.state` (un objeto en memoria) y llama a
 * `DB.guardar()` cuando cambia algo.
 *
 * Para migrar a la nube en el futuro sólo hay que reemplazar la implementación
 * de `DB.guardar()` / `DB.cargar()` por llamadas HTTP al backend: el resto de
 * la aplicación no cambia.
 * ========================================================================== */
(function (root) {
  "use strict";

  var CLAVE = "huevosreparto.state.v1";
  // Configuración de sincronización de ESTE dispositivo (token, clave de cifrado
  // e identificador del archivo compartido). Se guarda aparte de los datos para
  // que nunca termine dentro de un respaldo ni del documento sincronizado.
  var CLAVE_SYNC = "huevosreparto.sync.v1";

  var DISPOSITIVOS = ["computador", "celular", "tablet", "otro"];

  /** Identificador estable del dispositivo (se crea la primera vez). */
  function dispositivoNuevo() {
    var azar = Math.random().toString(36).slice(2, 8);
    return {
      id: "D-" + Date.now().toString(36) + "-" + azar,
      nombre: "",
      creadoEn: new Date().toISOString()
    };
  }

  /** Almacenamiento en memoria: respaldo si LocalStorage no está disponible. */
  function AlmacenMemoria() {
    var datos = {};
    return {
      tipo: "memoria",
      getItem: function (k) { return Object.prototype.hasOwnProperty.call(datos, k) ? datos[k] : null; },
      setItem: function (k, v) { datos[k] = String(v); },
      removeItem: function (k) { delete datos[k]; }
    };
  }

  function detectarAlmacen() {
    try {
      var s = root.localStorage;
      if (!s) { throw new Error("sin localStorage"); }
      var prueba = "__huevos_test__";
      s.setItem(prueba, "1");
      s.removeItem(prueba);
      return s;
    } catch (e) {
      return AlmacenMemoria();
    }
  }

  var DB = {
    state: null,
    meta: null,
    almacen: null,

    /** Crea el estado inicial (o carga el guardado). */
    init: function (core) {
      this.almacen = detectarAlmacen();
      this.esMemoria = this.almacen.tipo === "memoria";
      this.state = this.cargar(core) || core.estadoVacio();
      this.meta = this.cargarMeta();
      return this.state;
    },

    /* ------------------- Configuración de sincronización ------------------ */

    cargarMeta: function () {
      var base = {
        activa: false,
        gistId: "",
        token: "",
        clave: "",
        ultimaSync: "",
        ultimoResultado: "",
        pendiente: false,
        dispositivo: dispositivoNuevo()
      };
      var raw = null;
      try { raw = this.almacen.getItem(CLAVE_SYNC); } catch (e) { raw = null; }
      if (!raw) { return base; }
      try {
        var guardado = JSON.parse(raw);
        Object.keys(base).forEach(function (k) {
          if (guardado[k] !== undefined && guardado[k] !== null) { base[k] = guardado[k]; }
        });
        if (!base.dispositivo || !base.dispositivo.id) { base.dispositivo = dispositivoNuevo(); }
        if (DISPOSITIVOS.indexOf(base.dispositivo.nombre) < 0) { base.dispositivo.nombre = ""; }
        return base;
      } catch (e) { return base; }
    },

    guardarMeta: function () {
      if (!this.meta) { return false; }
      try { this.almacen.setItem(CLAVE_SYNC, JSON.stringify(this.meta)); return true; }
      catch (e) { return false; }
    },

    /**
     * Firma corta del dispositivo (2 ó 3 caracteres). Se agrega a los folios
     * de clientes, pedidos y pagos para que dos dispositivos no creen el mismo.
     */
    firmaDispositivo: function () {
      var id = (this.meta && this.meta.dispositivo && this.meta.dispositivo.id) || "";
      var h = 0;
      for (var i = 0; i < id.length; i++) { h = ((h * 31) + id.charCodeAt(i)) >>> 0; }
      var letras = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";   // sin caracteres que se confunden
      return letras[h % 32] + letras[(h >> 5) % 32] + letras[(h >> 10) % 32];
    },

    /** ¿La sincronización está lista para usarse? */
    syncLista: function () {
      return !!(this.meta && this.meta.activa && this.meta.gistId && this.meta.token && this.meta.clave);
    },

    cargar: function (core) {
      var raw = this.almacen.getItem(CLAVE);
      if (!raw) { return null; }
      try {
        return core.importar(raw);
      } catch (e) {
        // Datos corruptos: se conserva una copia y se arranca vacío.
        this.almacen.setItem(CLAVE + ".corrupto." + Date.now(), raw);
        return null;
      }
    },

    guardar: function () {
      if (!this.state) { return false; }
      this.state.actualizadoEn = new Date().toISOString();
      try {
        this.almacen.setItem(CLAVE, JSON.stringify(this.state));
        return true;
      } catch (e) {
        return false;
      }
    },

    /** Reemplaza todo el estado (usado al importar un respaldo). */
    reemplazar: function (nuevoEstado) {
      this.state = nuevoEstado;
      return this.guardar();
    },

    borrarTodo: function (core) {
      this.almacen.removeItem(CLAVE);
      this.state = core.estadoVacio();
      return this.guardar();
    },

    /** Utilidad para depuración / futura migración a la nube. */
    exportar: function (core) { return core.exportar(this.state); },

    /** Volumen aproximado ocupado (para mostrar en Respaldo). */
    pesoAproximado: function () {
      try {
        var raw = this.almacen.getItem(CLAVE) || "";
        return raw.length;
      } catch (e) { return 0; }
    },

    CLAVE: CLAVE,
    CLAVE_SYNC: CLAVE_SYNC,
    DISPOSITIVOS: DISPOSITIVOS
  };

  root.HuevosDB = DB;
  // Permite las pruebas automáticas desde Node (tests/core.test.js)
  if (typeof module !== "undefined" && module.exports) { module.exports = DB; }
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>
/* ==== js/xlsx.js ==== */
/* ============================================================================

 *      consiguiera la dirección del archivo, no puede leer nada.

/* ==== js/mapa.js ==== */
/* ============================================================================
 * mapa.js — Ubicación de direcciones y distancias por calle
 * ----------------------------------------------------------------------------
 * Para ordenar la ruta por cercanía real (y no por orden alfabético) hacen

 * consulta UNA sola vez y la optimización funciona después sin internet.
 *

 * sólo cuando el usuario la pide, con un aviso claro en pantalla.
 * ========================================================================== */

  var PAIS = "cl";

    }

  function textoBusqueda(cliente) {
    var partes = [];

    var numero = String((cliente && cliente.numero) || "").trim();
    if (calle) { partes.push(numero ? calle + " " + numero : calle); }
    if (cliente && cliente.comuna) { partes.push(String(cliente.comuna).trim()); }

          fuente: "OpenStreetMap",
          direccion: nom[0].display_name || consulta

  async function ubicarVarios(clientes, opciones) {

          clienteId: c.id, nombre: [c.nombre, c.apellido].filter(Boolean).join(" "),
          lat: ubicacion.lat, lon: ubicacion.lon,
          fuente: ubicacion.fuente, direccion: ubicacion.direccion
        });
      } else {
        fallidos.push({ clienteId: c.id, nombre: [c.nombre, c.apellido].filter(Boolean).join(" "), texto: textoBusqueda(c) });
      }
      if (i < lista.length - 1 && pausa > 0) { await esperar(pausa); }
    }
    return { encontrados: encontrados, fallidos: fallidos, total: lista.length };
  }

  /**
   * Distancia real por calles (OSRM), en kilómetros.
   * Devuelve null si el servicio no está disponible (se usa la línea recta).
   */
  async function distanciaPorCalles(puntos) {
    var lista = (puntos || []).filter(function (p) { return p && isFinite(p.lat) && isFinite(p.lon); });
    if (lista.length < 2) { return null; }
    var coordenadas = lista.map(function (p) { return p.lon + "," + p.lat; }).join(";");
    try {
      var datos = await pedirJson(OSRM + "/route/v1/driving/" + coordenadas + "?overview=false&steps=false");
      if (datos && datos.routes && datos.routes[0] && isFinite(datos.routes[0].distance)) {
        return Math.round((datos.routes[0].distance / 1000) * 10) / 10;
      }
    } catch (e) { return null; }
    return null;
  }

  /**
   * Matriz de distancias reales por calle entre todos los puntos (una sola
   * consulta a OSRM). Devuelve un arreglo de arreglos en kilómetros, o null si
   * el servicio no está disponible.
   */
  async function distanciasMatriz(puntos) {
    var lista = (puntos || []).filter(function (p) { return p && isFinite(p.lat) && isFinite(p.lon); });
    if (lista.length < 2) { return null; }
    var coordenadas = lista.map(function (p) { return p.lon + "," + p.lat; }).join(";");
    try {
      var datos = await pedirJson(OSRM + "/table/v1/driving/" + coordenadas + "?annotations=distance");
      if (!datos || !datos.distances || !datos.distances.length) { return null; }
      return datos.distances.map(function (fila) {
        return fila.map(function (metros) {
          return metros == null ? null : Math.round((metros / 1000) * 1000) / 1000;
        });
      });
    } catch (e) { return null; }
  }

  /**
   * Convierte la matriz en una función de costo por coordenadas, para que el
   * optimizador trabaje con distancias reales de calle.
   */
  function costoDesdeMatriz(puntos, matriz) {
    if (!puntos || !matriz) { return null; }
    var indice = {};
    puntos.forEach(function (p, i) {
      if (p && isFinite(p.lat) && isFinite(p.lon)) {
        indice[p.lat.toFixed(6) + "," + p.lon.toFixed(6)] = i;
      }
    });
    function posicion(p) {
      if (!p) { return null; }
      var clave = Number(p.lat).toFixed(6) + "," + Number(p.lon).toFixed(6);
      return indice[clave] == null ? null : indice[clave];
    }
    return function (a, b) {
      var i = posicion(a), j = posicion(b);
      if (i == null || j == null || i === j) { return 0; }
      var valor = matriz[i] ? matriz[i][j] : null;
      return valor == null ? Infinity : valor;
    };
  }

  /**
   * Enlace a Waze para ir a UN destino (una entrega).
   * Con coordenadas navega a la ubicación exacta; si no las hay, busca la
   * dirección escrita. `navigate=yes` abre la navegación de inmediato.
   *
   * Nota: Waze no acepta rutas con varias paradas en un enlace (limitación de
   * Waze), por eso la navegación asistida es entrega por entrega.
   */
  function enlaceWaze(destino, opciones) {
    opciones = opciones || {};
    var navegar = opciones.navegar !== false;
    var lat = destino && destino.lat != null ? Number(destino.lat) : null;
    var lon = destino && destino.lon != null ? Number(destino.lon) : null;
    var conPunto = lat != null && lon != null && isFinite(lat) && isFinite(lon) && !(lat === 0 && lon === 0);

    // www.waze.com es la dirección final (waze.com redirige ahí): así se evita un salto
    var url = "https://www.waze.com/ul?";
    if (conPunto) {
      url += "ll=" + lat + "%2C" + lon + "&z=17";
    } else {
      var texto = String((destino && (destino.direccion || destino.texto)) || "").trim();
      if (!texto) { return ""; }
      url += "q=" + encodeURIComponent(texto);
    }
    if (navegar) { url += "&navigate=yes"; }
    return url;
  }

  /** Enlace a Google Maps para UN destino. */
  function enlaceGoogle(destino) {
    var lat = destino && destino.lat != null ? Number(destino.lat) : null;
    var lon = destino && destino.lon != null ? Number(destino.lon) : null;
    var conPunto = lat != null && lon != null && isFinite(lat) && isFinite(lon) && !(lat === 0 && lon === 0);
    var objetivo = conPunto ? (lat + "," + lon) : String((destino && (destino.direccion || destino.texto)) || "").trim();
    if (!objetivo) { return ""; }
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(objetivo);
  }

  /**
   * Enlace a UN destino en la aplicación de mapas preferida
   * ("waze" o "google").
   */
  function enlaceDestino(destino, app) {
    return String(app) === "google" ? enlaceGoogle(destino) : enlaceWaze(destino);
  }

  /** Enlace para abrir el recorrido completo en la aplicación de mapas. */
  function enlaceRecorrido(puntos, opciones) {
    opciones = opciones || {};
    var lista = (puntos || []).filter(function (p) { return p && p.lat != null && p.lon != null; });
    if (!lista.length) { return ""; }
    var base = opciones.base || null;
    var origen = base ? base.lat + "," + base.lon : lista[0].lat + "," + lista[0].lon;
    var paradas = base ? lista.slice() : lista.slice(1);
    if (base && opciones.volverBase) { paradas = lista.slice(); }
    if (!paradas.length) { return ""; }
    var destino = paradas[paradas.length - 1];
    var intermedias = paradas.slice(0, -1);
    if (base && opciones.volverBase) { destino = { lat: base.lat, lon: base.lon }; intermedias = lista.slice(); }
    var MAX = 9;   // Google Maps acepta hasta 9 paradas intermedias en el enlace
    var usadas = intermedias.slice(0, MAX);
    var url = "https://www.google.com/maps/dir/?api=1&travelmode=driving" +
      "&origin=" + encodeURIComponent(origen) +
      "&destination=" + encodeURIComponent(destino.lat + "," + destino.lon);
    if (usadas.length) {
      url += "&waypoints=" + encodeURIComponent(usadas.map(function (p) { return p.lat + "," + p.lon; }).join("|"));
    }
    return url;
  }

  return {
    PAUSA_MS: PAUSA_MS,
    textoBusqueda: textoBusqueda,
    ubicar: ubicar,
    ubicarVarios: ubicarVarios,
    distanciaPorCalles: distanciaPorCalles,
    distanciasMatriz: distanciasMatriz,
    costoDesdeMatriz: costoDesdeMatriz,
    enlaceWaze: enlaceWaze,
    enlaceGoogle: enlaceGoogle,
    enlaceDestino: enlaceDestino,
    enlaceRecorrido: enlaceRecorrido
  };
});

</script>
<script>
/* ==== js/ui.js ==== */
/* ============================================================================
 * ui.js — Interfaz de usuario (render + eventos)
 * ----------------------------------------------------------------------------
 * Toda la interacción pasa por delegación de eventos con atributos
 * `data-action` (funciona igual en celular, tablet y escritorio).
 * ========================================================================== */
(function (root) {
  "use strict";

  var C = root.HuevosCore;
  var DB = root.HuevosDB;

  var UI = {};
  var ui = {};                 // estado de la interfaz (no se guarda en disco)
  var callbackDialogo = null;  // acción pendiente del diálogo de confirmación

  /* ======================================================================== */
  /* 1. Utilidades de DOM                                                     */
  /* ======================================================================== */

  function $(sel, ctx) { return (ctx || document).querySelector(sel); }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m];
    });
  }

  function toast(mensaje, tipo) {
    var cont = document.getElementById("toast-root");
    if (!cont) { return; }
    var div = document.createElement("div");
    div.className = "toast " + (tipo || "");
    div.textContent = mensaje;
    cont.appendChild(div);
    setTimeout(function () { if (div.parentNode) { div.parentNode.removeChild(div); } }, 2600);
  }

  function sheetAbierto() { return !!$("#sheet-root .sheet-fondo"); }

  function cerrarSheet() {
    var r = document.getElementById("sheet-root");
    if (r) { r.innerHTML = ""; }
  }

  var TITULOS = {
    inicio: ["Inicio", "Resumen del negocio"],
    clientes: ["Clientes", "Administrar clientes y pedidos habituales"],
    cliente: ["Ficha del cliente", ""],
    pedidos: ["Pedidos", "Pedidos por semana"],
    generar: ["Generar pedidos semanales", "Clientes con pedido habitual"],
    ruta: ["Ruta de reparto", ""],
    deudas: ["Deudas pendientes", "Saldos por cobrar"],
    pagos: ["Pagos", "Registro de pagos recibidos"],
    informes: ["Informes", "Semanal y de deudas"],
    config: ["Configuración", "Valores y datos del negocio"],
    respaldo: ["Respaldo de información", "Exportar / importar"],
    ayuda: ["Ayuda", "Cómo usar la aplicación"]
  };

  function setCabecera(vista, subtitulo) {
    var t = TITULOS[vista] || ["", ""];
    var h1 = document.getElementById("page-title");
    var sp = document.getElementById("page-subtitle");
    if (h1) { h1.textContent = t[0]; }
    if (sp) { sp.textContent = subtitulo || t[1]; }
  }

  function marcarNav(vista) {
    var mapa = { inicio: "inicio", clientes: "clientes", cliente: "clientes", pedidos: "pedidos", generar: "pedidos", ruta: "ruta", deudas: "deudas" };
    var activo = mapa[vista] || "";
    Array.prototype.forEach.call(document.querySelectorAll("#bottomnav button"), function (b) {
      b.classList.toggle("activo", b.getAttribute("data-route") === activo);
    });
  }

  /* ======================================================================== */
  /* 2. Componentes de formulario (devuelven HTML)                            */
  /* ======================================================================== */

  function campoTexto(nombre, label, valor, opts) {
    opts = opts || {};
    return '<div class="campo"><label for="f-' + nombre + '">' + esc(label) + '</label>' +
      '<input id="f-' + nombre + '" name="' + nombre + '" type="' + (opts.tipo || "text") + '"' +
      (opts.inputmode ? ' inputmode="' + opts.inputmode + '"' : "") +
      (opts.min != null ? ' min="' + opts.min + '"' : "") +
      (opts.max != null ? ' max="' + opts.max + '"' : "") +
      (opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : "") +
      ' value="' + esc(valor == null ? "" : valor) + '">' +
      (opts.ayuda ? '<div class="ayuda">' + esc(opts.ayuda) + '</div>' : "") + '</div>';
  }

  function campoArea(nombre, label, valor, placeholder) {
    return '<div class="campo"><label for="f-' + nombre + '">' + esc(label) + '</label>' +
      '<textarea id="f-' + nombre + '" name="' + nombre + '" placeholder="' + esc(placeholder || "") + '">' +
      esc(valor || "") + '</textarea></div>';
  }

  /** opciones: [{v, t}] */
  function campoSelect(nombre, label, valor, opciones, vacio) {
    var html = '<div class="campo"><label for="f-' + nombre + '">' + esc(label) + '</label>' +
      '<select id="f-' + nombre + '" name="' + nombre + '">';
    if (vacio != null) { html += '<option value="">' + esc(vacio) + '</option>'; }
    opciones.forEach(function (o) {
      html += '<option value="' + esc(o.v) + '"' + (String(o.v) === String(valor) ? " selected" : "") + '>' + esc(o.t) + '</option>';
    });
    return html + '</select></div>';
  }

  function campoCheck(nombre, label, marcado) {
    return '<div class="campo campo-check"><input type="checkbox" id="f-' + nombre + '" name="' + nombre + '"' +
      (marcado ? " checked" : "") + '><label for="f-' + nombre + '" style="margin:0">' + esc(label) + '</label></div>';
  }

  function opcionesDias() {
    return C.DIAS.map(function (d) { return { v: d, t: C.DIAS_LABEL[d] }; });
  }

  function readForm(contenedor) {
    var out = {};
    if (!contenedor) { return out; }
    Array.prototype.forEach.call(contenedor.querySelectorAll("[name]"), function (el) {
      if (el.type === "checkbox") { out[el.name] = el.checked; }
      else { out[el.name] = el.value; }
    });
    return out;
  }

  /* ======================================================================== */
  /* 3. Sheet (panel inferior) y diálogos                                     */
  /* ======================================================================== */

  /** opts: {titulo, html, botones:[{label, accion, id, clase}] } */
  function abrirSheet(opts) {
    var botones = (opts.botones || []).map(function (b) {
      return '<button class="btn ' + (b.clase || "primario") + '" data-action="' + esc(b.accion) + '"' +
        (b.id ? ' data-id="' + esc(b.id) + '"' : "") +
        (b.ruta ? ' data-route="' + esc(b.ruta) + '"' : "") + '>' + esc(b.label) + '</button>';
    }).join("");
    var rootEl = document.getElementById("sheet-root");
    rootEl.innerHTML =
      '<div class="sheet-fondo" data-action="cerrar-sheet">' +
        '<div class="sheet">' +
          '<div class="sheet-cabecera"><h3>' + esc(opts.titulo) + '</h3>' +
            '<button class="icon-btn" data-action="cerrar-sheet" aria-label="Cerrar">✕</button></div>' +
          '<div class="sheet-cuerpo">' + (opts.html || "") + '</div>' +
          (botones ? '<div class="sheet-pie">' + botones + '</div>' : "") +
        '</div>' +
      '</div>';
    var sc = $("#sheet-root .sheet-cuerpo");
    var primero = sc && sc.querySelector("input:not([type=hidden]), select, textarea");
    if (primero && opts.enfocar !== false) { setTimeout(function () { primero.focus(); }, 150); }
  }

  /** Confirmación antes de acciones destructivas */
  function confirmar(opts, cb) {
    callbackDialogo = cb;
    var rootEl = document.getElementById("dialog-root");
    rootEl.innerHTML =
      '<div class="sheet-fondo" style="align-items:center">' +
        '<div class="dialogo">' +
          '<h3>' + esc(opts.titulo) + '</h3>' +
          '<p>' + esc(opts.mensaje) + '</p>' +
          '<div class="acciones-fila">' +
            '<button class="btn borde" data-action="cerrar-dialogo">' + esc(opts.textoCancelar || "Cancelar") + '</button>' +
            '<button class="btn ' + (opts.claseOk || "peligro") + '" data-action="confirmar-dialogo">' + esc(opts.textoOk || "Confirmar") + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function cerrarDialogo() {
    document.getElementById("dialog-root").innerHTML = "";
    callbackDialogo = null;
  }

  /* ======================================================================== */
  /* 4. Navegación                                                            */
  /* ======================================================================== */

  function ir(vista, parametros, subtitulo) {
    ui.vista = vista;
    ui.params = parametros || {};
    setCabecera(vista, subtitulo);
    marcarNav(vista);
    Array.prototype.forEach.call(document.querySelectorAll(".view"), function (v) {
      v.classList.toggle("activa", v.getAttribute("data-view") === vista);
    });
    cerrarMenu();
    limpiarImpresion();
    render();
    window.scrollTo(0, 0);
  }

  function abrirMenu() {
    document.getElementById("drawer").classList.add("abierto");
    document.getElementById("drawer-fondo").classList.add("abierto");
  }

  function cerrarMenu() {
    var d = document.getElementById("drawer");
    var f = document.getElementById("drawer-fondo");
    if (d) { d.classList.remove("abierto"); }
    if (f) { f.classList.remove("abierto"); }
  }

  /* ======================================================================== */
  /* 5. Fragmentos reutilizables de HTML                                      */
  /* ======================================================================== */

  function statHtml(valor, label, clase) {
    return '<div class="stat ' + (clase || "") + '"><div class="stat-valor">' + valor + '</div>' +
      '<div class="stat-label">' + esc(label) + '</div></div>';
  }

  function badgeEstadoPedido(estado) {
    return '<span class="badge ' + (C.ESTADOS_CLASE[estado] || "muted") + '">' + esc(C.ESTADOS_LABEL[estado] || estado) + '</span>';
  }

  function badgePago(estado) {
    var map = { PAGADO: ["ok", "Pagado"], PAGO_PARCIAL: ["warn", "Pago parcial"], PENDIENTE: ["danger", "Pendiente"], SIN_MOVIMIENTOS: ["muted", "Sin movimientos"] };
    var d = map[estado] || ["muted", estado];
    return '<span class="badge ' + d[0] + '">' + d[1] + '</span>';
  }

  function vacioHtml(emoji, texto) {
    return '<div class="vacio"><span class="emoji">' + emoji + '</span>' + esc(texto) + '</div>';
  }

  /** Texto de la dirección para buscarla en una aplicación de mapas. */
  function direccionParaMapa(c) {
    var q = C.direccionCompleta(c);
    if (!/chile/i.test(q)) { q += ", Chile"; }
    return q;
  }

  /** Aplicación de mapas preferida ("waze" por defecto). */
  function appMapas() {
    return (DB.state.config && DB.state.config.appMapas) === "google" ? "google" : "waze";
  }

  /** Destino (coordenadas + dirección) de un cliente, para navegar. */
  function destinoDeCliente(c) {
    var co = C.coordenadasDe(c);
    return {
      lat: co ? co.lat : null,
      lon: co ? co.lon : null,
      direccion: direccionParaMapa(c)
    };
  }

  /** Texto del botón de mapa según la aplicación preferida. */
  function etiquetaMapa() {
    return appMapas() === "google" ? "🗺️ Abrir mapa" : "🧭 Waze";
  }

  /** Abre un destino en la aplicación de mapas preferida (Waze o Google). */
  function abrirDestino(destino, app) {
    if (!root.HuevosMapa) { toast("Los mapas no están disponibles.", "error"); return false; }
    var url = root.HuevosMapa.enlaceDestino(destino, app || appMapas());
    if (!url) { toast("Ese cliente no tiene dirección registrada.", "aviso"); return false; }
    abrirUrl(url);
    return true;
  }

  function urlMapa(c) {
    return root.HuevosMapa
      ? root.HuevosMapa.enlaceDestino(destinoDeCliente(c), appMapas())
      : "";
  }

  function selectorSemanaHtml(destino, clave) {
    return '<div class="selector-semana">' +
      '<button data-action="semana-anterior" data-destino="' + destino + '" aria-label="Semana anterior">&#8249;</button>' +
      '<div class="semana-texto">' + esc(C.weekLabel(clave)) + '<br><span class="chico muted">' + esc(clave) + '</span></div>' +
      '<button data-action="semana-siguiente" data-destino="' + destino + '" aria-label="Semana siguiente">&#8250;</button>' +
      '</div>' +
      '<div class="fila" style="margin-bottom:12px">' +
        '<input type="date" id="saltar-' + destino + '" value="' + esc(fechaDeSemana(clave)) + '" style="flex:1;padding:10px;border-radius:10px;border:2px solid #d5d9e0">' +
        '<button class="btn" data-action="ir-a-fecha" data-destino="' + destino + '">Ir</button>' +
      '</div>';
  }

  function fechaDeSemana(clave) {
    return C.diaDeLaSemana(clave, "MIERCOLES");
  }

  /* ======================================================================== */
  /* 6. Render por vista                                                      */
  /* ======================================================================== */

  function render() {
    var v = ui.vista;
    if (v === "inicio") { renderInicio(); }
    else if (v === "clientes") { renderClientes(); }
    else if (v === "cliente") { renderFicha(); }
    else if (v === "pedidos") { renderPedidos(); }
    else if (v === "generar") { renderGenerar(); }
    else if (v === "ruta") { renderRuta(); }
    else if (v === "deudas") { renderDeudas(); }
    else if (v === "pagos") { renderPagos(); }
    else if (v === "informes") { renderInformes(); }
    else if (v === "config") { renderConfig(); }
    else if (v === "respaldo") { renderRespaldo(); }
    else if (v === "ayuda") { renderAyuda(); }
  }

  /* ---------------------------------- INICIO ------------------------------ */
  function renderInicio() {
    var st = DB.state;
    var d = C.dashboard(st, ui.semanaInicio);
    document.getElementById("inicio-selector-semana").innerHTML = selectorSemanaHtml("inicio", ui.semanaInicio);

    document.getElementById("inicio-stats").innerHTML =
      statHtml(d.clientesActivos, "Clientes activos", "azul") +
      statHtml(d.clientesHabituales, "Con pedido habitual", "") +
      statHtml(d.pedidosSemana, "Pedidos de la semana", "azul") +
      statHtml(C.formatMiles(d.bandejasSemana), "Bandejas de la semana", "") +
      statHtml(C.formatCLP(d.totalVendido), "Total vendido", "") +
      statHtml(C.formatCLP(d.totalCobrado), "Total cobrado", "verde") +
      statHtml(C.formatCLP(d.totalPendiente), "Total pendiente", "rojo") +
      statHtml(C.formatCLP(C.informeUtilidad(st, ui.semanaInicio).utilidad), "Utilidad de la semana", "verde") +
      statHtml(d.clientesConDeuda, "Clientes con deuda", "rojo") +
      statHtml(d.pendientesEntrega, "Pedidos por entregar", "azul") +
      statHtml(d.entregados, "Pedidos entregados", "verde");

    var botones = [
      { r: "clientes", t: "CLIENTES", e: "👥", c: "" },
      { r: "nuevo-pedido", t: "NUEVO PEDIDO", e: "🧾", c: "principal" },
      { r: "generar", t: "GENERAR PEDIDOS SEMANALES", e: "⚙️", c: "principal" },
      { r: "ruta", t: "RUTA DE REPARTO", e: "🚚", c: "principal" },
      { r: "nuevo-pago", t: "REGISTRAR PAGO", e: "💵", c: "" },
      { r: "deudas", t: "DEUDAS", e: "💰", c: "" },
      { r: "informes", t: "REPORTES", e: "📊", c: "" },
      { r: "config", t: "CONFIGURACIÓN", e: "🔧", c: "" },
      { r: "respaldo", t: "RESPALDO", e: "💾", c: "" }
    ];
    document.getElementById("inicio-botones").innerHTML = botones.map(function (b) {
      var accion = (b.r === "nuevo-pedido" || b.r === "nuevo-pago") ? b.r : "ir";
      var attr = accion === "ir" ? ' data-route="' + b.r + '"' : "";
      return '<button class="btn-grande ' + b.c + '" data-action="' + accion + '"' + attr + '>' +
        '<span class="emoji">' + b.e + '</span><span>' + esc(b.t) + '</span></button>';
    }).join("");
    document.getElementById("inicio-botones").innerHTML +=
      '<h2 class="seccion-titulo">Sincronización</h2>' + cajaSyncHtml(true);
  }

  /* --------------------------------- CLIENTES ----------------------------- */
  function clientesFiltrados() {
    var st = DB.state;
    var q = (ui.busquedaClientes || "").trim();
    var f = ui.filtroClientes || "ACTIVOS";
    return st.clientes.filter(function (c) {
      if (f === "ACTIVOS" && c.estado !== "ACTIVO") { return false; }
      if (f === "INACTIVOS" && c.estado !== "INACTIVO") { return false; }
      if (f === "HABITUALES" && !(c.pedidoHabitual && c.pedidoHabitual.activo)) { return false; }
      if (f === "CON_DEUDA" && C.resumenCliente(st, c.id).saldo <= 0) { return false; }
      if (q) {
        // Búsqueda tolerante: "munoz" encuentra "Muñoz" y "nunoa" encuentra "Ñuñoa"
        var texto = [c.nombre, c.apellido, c.comuna, c.telefono, c.calle, c.zona, c.observaciones].join(" ");
        if (!C.coincideBusqueda(texto, q)) { return false; }
      }
      return true;
    }).sort(function (a, b) { return C.compararClientes(a, b, ui.ordenClientes); });
  }

  /* ---------------------------------- PEDIDOS ----------------------------- */
  function pedidosFiltrados() {
    var st = DB.state;
    var f = ui.filtroPedidos || "TODOS";
    var filtros = { semana: ui.semanaPedidos };
    if (f === "PENDIENTE" || f === "ENTREGADO" || f === "NO_ENTREGADO") { filtros.estado = f; }
    if (f === "HABITUAL" || f === "EXTRAORDINARIO") { filtros.tipo = f; }
    var lista = C.listarPedidos(st, filtros);
    if (f === "TODOS") { lista = lista.filter(function (p) { return p.estado !== "CANCELADO"; }); }
    return lista;
  }

        ' · Valor bandeja ' + C.formatCLP(previa.valorUnitario) + '</div>' +
      '</div>' +
      '<div class="tabla-scroll mt"><table class="tabla">' +
        '<thead><tr><th>Cliente</th><th>Comuna</th><th class="num">Bandejas</th><th class="num">Valor</th><th class="num">Total</th></tr></thead>' +

      '</table></div>' +
      '<div class="resumen-caja amarillo">' +

        '<div class="fila-sep"><span>TOTAL BANDEJAS</span><span class="negrita">' + previa.totales.bandejas + '</span></div>' +
        '<div class="fila-sep total"><span>TOTAL VENTA</span><span>' + C.formatCLP(previa.totales.venta) + '</span></div>' +

  function avisoDuplicadosHtml(duplicados) {
    return '<div class="aviso-duplicado"><strong>Pedidos ya existentes (no se duplican):</strong><br>' +
      duplicados.map(function (d) {
        return "• " + esc(d.nombre) + " — " + esc(d.motivo);
      }).join("<br>") + '</div>';
  }

  /* ---------------------------------- RUTA -------------------------------- */
  function opcionesSelect(lista, valor, textoVacio) {
    return '<option value="">' + esc(textoVacio) + '</option>' + lista.map(function (x) {
      return '<option value="' + esc(x) + '"' + (String(x) === String(valor) ? " selected" : "") + '>' + esc(x) + '</option>';
    }).join("");
  }

  function renderRuta() {
    var st = DB.state;
    var f = ui.ruta;
    var comunidades = (st.config.comunas || []).slice();
    st.clientes.forEach(function (c) { if (c.comuna && comunidades.indexOf(c.comuna) < 0) { comunidades.push(c.comuna); } });
    comunidades.sort(function (a, b) { return a.localeCompare(b, "es"); });
    var zonas = (st.config.zonas || []).slice();
    st.clientes.forEach(function (c) { var z = C.zonaDe(c); if (z && zonas.indexOf(z) < 0) { zonas.push(z); } });
    zonas = zonas.filter(function (z) { return comunidades.indexOf(z) < 0; }).sort();

    document.getElementById("ruta-fecha").value = f.fecha;
    document.getElementById("ruta-comuna").innerHTML = opcionesSelect(comunidades, f.comuna, "Todas las comunas");
    document.getElementById("ruta-zona").innerHTML = opcionesSelect(zonas, f.zona, "Todas las zonas");
    document.getElementById("ruta-estado").innerHTML = opcionesSelect(
      C.ESTADOS_PEDIDO.map(function (e) { return C.ESTADOS_LABEL[e]; }),
      f.estado ? C.ESTADOS_LABEL[f.estado] : "", "Todos los estados");
    var selOrden = document.getElementById("ruta-orden");
    if (selOrden) { selOrden.value = f.orden; }

    var r = C.rutaDeReparto(st, f);
    setCabecera("ruta", "Ruta del " + C.formatFechaLarga(f.fecha));

    // Accesos rápidos: días de la semana que tienen pedidos (con su cantidad)
    var contDias = document.getElementById("ruta-dias");
    if (contDias) {
      var rango = C.weekRange(C.weekKeyFromISO(f.fecha));
      var dias = [];
      for (var i = 0; i < 7; i++) {
        var dia = C.isoDate(C.addDays(rango.inicio, i));
        dias.push({
          fecha: dia,
          cantidad: st.pedidos.filter(function (p) {
            return p.fechaEntrega === dia && p.estado !== "CANCELADO";
          }).length
        });
      }
      var hayConPedidos = dias.some(function (x) { return x.cantidad > 0; });
      var chips = dias.filter(function (x) {
        return x.cantidad > 0 || (!hayConPedidos && x.fecha === f.fecha);
      }).map(function (x) {
        return '<button class="chip' + (x.fecha === f.fecha ? " activo" : "") + '" data-action="ruta-fecha" data-fecha="' + x.fecha + '">' +
          esc(C.DIAS_CORTOS[C.nombreDiaDeISO(x.fecha)]) + " " + C.parseISO(x.fecha).getDate() + " · " + x.cantidad + '</button>';
      }).join("");
      contDias.innerHTML = chips;
    }

    document.getElementById("ruta-resumen").innerHTML =
      '<div class="resumen-caja"><div class="fila-sep"><span>' + C.formatFechaLarga(r.fecha) + '</span><span>' + r.resumen.comunas + ' comunas</span></div>' +
      '<div class="fila-sep"><span>' + r.resumen.pedidos + ' pedidos · ' + r.resumen.bandejas + ' bandejas</span><span class="total">' + C.formatCLP(r.resumen.total) + '</span></div>' +
      '<div class="fila-sep chico"><span>✓ Entregados: ' + r.resumen.entregados + '</span><span>⏳ Por entregar: ' + r.resumen.pendientes +
      (r.resumen.noEntregados ? ' · ✕ No entregados: ' + r.resumen.noEntregados : "") + '</span></div></div>' +
      '<button class="btn borde bloque mb" data-action="imprimir-ruta">🖨 Imprimir la ruta del día ' +
      (r.resumen.optimizada ? "(en el orden del recorrido)" : "(por comuna)") + '</button>';

    renderPanelOptimizacion(r);

    var cont = document.getElementById("ruta-grupos");
    if (!r.grupos.length) {
      var haySemana = st.pedidos.some(function (p) {
        return p.estado !== "CANCELADO" && C.weekKeyFromISO(p.fechaEntrega) === C.weekKeyFromISO(f.fecha);
      });
      cont.innerHTML = vacioHtml("🚚", "No hay pedidos para este día con los filtros seleccionados." +
        (haySemana ? " Usa los botones de día de arriba para ver los días de esta semana que tienen pedidos." : ""));
      return;
    }
    if (r.resumen.optimizada) {
      // Ruta optimizada: lista plana en el orden del recorrido (menor distancia)
      cont.innerHTML = '<div class="grupo-comuna"><span>🧭 Recorrido optimizado</span><span>' +
        r.resumen.pedidos + ' paradas · ' + kmTexto(r.resumen.distanciaKm) + '</span></div>' +
        r.secuencia.map(function (x) {
          return tarjetaPedidoHtml(x.pedido, { reparto: true, numero: x.numero, kmTramo: x.kmTramo });
        }).join("");
      return;
    }
    cont.innerHTML = r.grupos.map(function (g) {
      var n = 0;
      return '<div class="grupo-comuna"><span>📦 ' + esc(g.comuna) + '</span><span>' + g.pedidos.length + ' pedidos · ' + g.bandejas + ' bandejas</span></div>' +
        g.pedidos.map(function (p) { n++; return tarjetaPedidoHtml(p, { reparto: true, numero: n }); }).join("");
    }).join("");
  }

  /* ------------------- Optimización de la ruta (por distancia) ------------- */

  function kmTexto(km) {
    return String(Math.round(Number(km) * 10) / 10).replace(".", ",") + " km";
  }

  function mapaDisponible() { return !!(root.HuevosMapa && root.HuevosMapa.ubicarVarios); }

  /** Visitas del día (pedido + cliente) para optimizar. */
  function visitasDelDia(ruta) {
    return ruta.pedidos.map(function (p) { return { pedido: p, cliente: C.getCliente(DB.state, p.clienteId) }; })
      .filter(function (v) { return v.cliente; });
  }

  /** Distancia del recorrido si se hiciera en el orden por dirección. */
  function distanciaPorDireccion(visitas, base, volverBase) {
    var ordenadas = visitas.slice().sort(function (a, b) {
      return C.ordenarPorComunaDireccion(a.cliente, b.cliente);
    }).map(function (v) { return C.coordenadasDe(v.cliente); }).filter(Boolean);
    return C.largoRecorrido(ordenadas, base, volverBase);
  }

  function renderPanelOptimizacion(r) {
    var cont = document.getElementById("ruta-optimizacion");
    if (!cont) { return; }
    var st = DB.state;
    var base = C.baseDe(st);
    var visitas = visitasDelDia(r);
    var faltan = visitas.filter(function (v) { return !C.coordenadasDe(v.cliente); });
    var volverBase = ui.optimizarVolverBase !== false;
    var activo = estadoSync.optimizando;
    var proxima = r.secuencia.filter(function (x) {
      return x.pedido.estado === "PENDIENTE" || x.pedido.estado === "EN_REPARTO";
    })[0];
    var botonProxima = '<button class="btn primario bloque mt" data-action="navegar-proxima">🧭 Ir a la próxima entrega' +
      (proxima ? ': ' + esc(C.nombreCompleto(proxima.cliente)) : "") + '</button>';

    var html = '<div class="tarjeta" id="panel-optimizacion">' +
      '<div class="tarjeta-titulo">🧭 Optimizar la ruta' +
      (r.resumen.optimizada ? ' <span class="badge verde">optimizada</span>' : "") + '</div>' +
      '<div class="tarjeta-cuerpo">';

    if (!r.resumen.pedidos) {
      html += '<div class="chico muted">No hay entregas para ordenar en este día.</div>';
    } else if (visitas.length < 2) {
      html += '<div class="chico muted">Con una sola entrega no hay nada que optimizar.</div>';
    } else {
      if (faltan.length) {
        html += '<div class="chico">Faltan <b>' + faltan.length + '</b> de ' + visitas.length +
          ' direcciones por ubicar en el mapa.</div>' +
          '<button class="btn azul bloque mt" data-action="ubicar-direcciones"' + (activo ? " disabled" : "") + '>' +
          '📍 Ubicar ' + faltan.length + (faltan.length === 1 ? " dirección" : " direcciones") + '</button>' +
          '<div class="chico muted mt">Se consultan en OpenStreetMap (se envían sólo la calle, el número y la comuna).</div>';
      } else {
        html += '<div class="chico">✅ Las ' + visitas.length + ' direcciones del día están ubicadas en el mapa.</div>';
      }

      var ubicadas = visitas.length - faltan.length;
      if (r.resumen.optimizada) {
        var baseOrden = C.baseDe(st);
        var comparacion = distanciaPorDireccion(visitas, baseOrden, volverBase);
        var actual = r.resumen.distanciaKm;
        var porCalles = r.secuencia.some(function (x) { return x.pedido.kmFuente === "calles"; });
        html += '<div class="resumen-caja mt">' +
          '<div class="fila-sep"><span>Recorrido optimizado' + (porCalles ? ' <span class="chico">(por calle)</span>' : "") +
          '</span><span class="total">' + kmTexto(actual) + '</span></div>' +
          (r.resumen.vuelveBase
            ? '<div class="fila-sep chico"><span>Ida: ' + kmTexto(r.resumen.distanciaIdaKm) + ' + regreso a la bodega: ' +
              kmTexto(r.resumen.kmVueltaBase) + '</span><span></span></div>'
            : "") +
          (porCalles
            ? '<div class="fila-sep chico"><span>Medido con distancias reales por calle (OSRM)</span><span></span></div>'
            : (comparacion > actual + 0.05
              ? '<div class="fila-sep chico"><span>Por dirección serían ' + kmTexto(comparacion) + '</span><span class="total">−' +
                kmTexto(comparacion - actual) + '</span></div>'
              : '<div class="fila-sep chico"><span>Es el mejor orden posible para estas paradas</span><span></span></div>')) +
          '</div>' +
          botonProxima +
          '<div class="acciones-fila mt">' +
            '<button class="btn borde" data-action="volver-orden-direccion">↩ Orden por dirección</button>' +
            '<button class="btn" data-action="abrir-recorrido">🗺️ Recorrido completo</button>' +
          '</div>' +
          (appMapas() === "waze"
            ? '<div class="chico muted mt">Waze navega de a una entrega (no acepta rutas con varias paradas). ' +
              'El recorrido completo se abre en Google Maps.</div>'
            : "");
      } else if (r.resumen.pedidos) {
        html += botonProxima;
      }
      if (ubicadas >= 2 && !r.resumen.optimizada) {
        html += '<div class="chico mt">Con las direcciones ubicadas se puede buscar el recorrido más corto ' +
          'partiendo' + (base ? ' desde <b>' + esc(base.direccion || "tu punto de partida") + '</b>' : ' de la primera parada') + '.</div>';
      }

      if (!base) {
        html += '<div class="chico muted mt">💡 Define tu <b>punto de partida</b> en Configuración para que la ruta ' +
          'se ordene desde la bodega.</div>';
      }

      if (ubicadas >= 2) {
        html += '<div class="fila mt">' +
          '<label class="chico" style="align-self:center">Recorrido</label>' +
          '<select id="optimizar-volver-base" style="flex:1">' +
            '<option value="no"' + (!volverBase ? " selected" : "") + '>Sólo ida (termina en la última entrega)</option>' +
            '<option value="si"' + (volverBase ? " selected" : "") + '>Ida y vuelta al punto de partida</option>' +
          '</select>' +
        '</div>' +
        '<button class="btn primario bloque mt" data-action="optimizar-ruta"' + (activo ? " disabled" : "") + '>' +
          (activo ? "⏳ Calculando…" : (r.resumen.optimizada ? "🔄 Volver a optimizar" : "🧭 Optimizar la ruta")) + '</button>';
      }
    }

    html += '</div></div>';
    cont.innerHTML = html;
  }

  /* --------------------------------- DEUDAS ------------------------------- */

        '<div class="fila-sep"><span>DEUDA TOTAL</span><span class="total">' + C.formatCLP(inf.deudaTotal) + '</span></div>' +
        '<div class="fila-sep chico"><span>Total comprado: ' + C.formatCLP(inf.totalComprado) + '</span><span>Total pagado: ' + C.formatCLP(inf.totalPagado) + '</span></div>' +

  /* ---------------------------------- PAGOS ------------------------------- */
  function renderPagos() {
    var st = DB.state;
    var pagos = C.listarPagos(st, {});
    var r = C.weekRange(ui.semanaInicio);
    var desde = C.isoDate(r.inicio), hasta = C.isoDate(r.fin);
    var delPeriodo = pagos.filter(function (g) { return C.estaEnRango(g.fecha, desde, hasta); });
    var totalHistorico = pagos.reduce(function (a, g) { return a + g.monto; }, 0);
    var deuda = C.informeDeudas(st);

    document.getElementById("pagos-resumen").innerHTML =
      '<div class="resumen-caja verde">' +
        '<div class="fila-sep"><span>Cobrado esta semana</span><span class="total">' + C.formatCLP(delPeriodo.reduce(function (a, g) { return a + g.monto; }, 0)) + '</span></div>' +
        '<div class="fila-sep"><span>Cobrado histórico (' + pagos.length + ' pagos)</span><span>' + C.formatCLP(totalHistorico) + '</span></div>' +
        '<div class="fila-sep"><span>Por cobrar</span><span>' + C.formatCLP(deuda.deudaTotal) + '</span></div>' +
      '</div>' +
      '<button class="btn exito bloque mb" data-action="nuevo-pago">💵 Registrar nuevo pago</button>';

        '<div class="tarjeta-titulo">' + C.formatCLP(g.monto) + '</div>' +

        (g.observaciones ? '<div class="tarjeta-sub">📝 ' + esc(g.observaciones) + '</div>' : "") +
        '</div><div>' +
        '<button class="btn peligro" data-action="eliminar-pago" data-id="' + g.id + '">Eliminar</button>' +

  function opcionesClientes(valor, incluirInactivos) {
    var st = DB.state;
    var lista = st.clientes.filter(function (c) { return incluirInactivos || c.estado === "ACTIVO"; })
      .sort(function (a, b) { return C.nombreCompleto(a).localeCompare(C.nombreCompleto(b), "es"); });
    return '<option value="">— Seleccionar cliente —</option>' + lista.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === valor ? " selected" : "") + '>' + esc(C.nombreCompleto(c)) +
        ' · ' + esc(c.comuna || "sin comuna") + '</option>';
    }).join("");
  }

  function opcionesComunas(valor) {
    var st = DB.state;
    var lista = (st.config.comunas || []).slice();
    st.clientes.forEach(function (c) { if (c.comuna && lista.indexOf(c.comuna) < 0) { lista.push(c.comuna); } });
    return '<option value="">— Seleccionar comuna —</option>' + lista.sort().map(function (c) {
      return '<option value="' + esc(c) + '"' + (String(c) === String(valor) ? " selected" : "") + '>' + esc(c) + '</option>';
    }).join("");
  }

  function opcionesZonas(valor) {
    var st = DB.state;
    var lista = (st.config.zonas || []).slice();
    st.clientes.forEach(function (c) { if (c.zona && lista.indexOf(c.zona) < 0) { lista.push(c.zona); } });
    return '<option value="">— Sin zona —</option>' + lista.sort().map(function (z) {
      return '<option value="' + esc(z) + '"' + (String(z) === String(valor) ? " selected" : "") + '>' + esc(z) + '</option>';
    }).join("");
  }

    abrirSheet({
      titulo: c ? "Editar cliente" : "Nuevo cliente",
      html:
        '<input type="hidden" name="id" value="' + esc(c ? c.id : "") + '">' +
        '<div class="fila-campos">' +
          campoTexto("nombre", "Nombre *", c ? c.nombre : "") +
          campoTexto("apellido", "Apellido", c ? c.apellido : "") +

        campoTexto("telefono", "Teléfono", c ? c.telefono : "", { tipo: "tel", placeholder: "9 1234 5678" }) +
        '<div class="fila-campos">' +
          campoTexto("calle", "Calle", c ? c.calle : "") +
          campoTexto("numero", "Número", c ? c.numero : "") +

        campoSelect("estado", "Estado", c ? c.estado : "ACTIVO", [{ v: "ACTIVO", t: "Activo" }, { v: "INACTIVO", t: "Inactivo" }]) +

  /** Lee el archivo elegido (.xlsx o .csv) y abre la vista previa. */
  function procesarArchivoClientes(archivo) {
    if (!archivo) { return; }
    var nombre = String(archivo.name || "").toLowerCase();
    var estado = document.getElementById("import-estado");
    if (/\.xls$/.test(nombre)) {
      toast("El formato .xls antiguo no se puede leer. Ábrelo en Excel y guárdalo como .xlsx o CSV.", "error");
      return;
    }
    if (!/\.(xlsx|csv|txt)$/.test(nombre)) {
      toast("Formato no soportado. Usa un archivo .xlsx o .csv.", "error");
      return;
    }
    if (!root.HuevosXLSX) { toast("Falta el módulo de lectura de archivos (js/xlsx.js).", "error"); return; }
    if (estado) { estado.textContent = "Leyendo " + archivo.name + "…"; }
    var lector = new FileReader();
    lector.onerror = function () { if (estado) { estado.textContent = ""; } toast("No se pudo leer el archivo.", "error"); };
    lector.onload = function () {
      try {
        if (/\.(csv|txt)$/.test(nombre)) {
          iniciarImportacionDesdeTexto(root.HuevosXLSX.decodificarTexto(lector.result), archivo.name);
        } else {
          root.HuevosXLSX.leer(lector.result).then(function (res) {
            iniciarImportacionDesdeFilas(res.filas, archivo.name);
          }, function (e) {
            if (estado) { estado.textContent = ""; }
            toast("No se pudo leer el Excel: " + e.message, "error");
          });
        }
      } catch (e2) {
        if (estado) { estado.textContent = ""; }
        toast("No se pudo leer el archivo: " + e2.message, "error");
      }
    };
    lector.readAsArrayBuffer(archivo);
  }

  function iniciarImportacionDesdeTexto(texto, nombreArchivo) {
    if (!root.HuevosXLSX) { toast("Falta el módulo de lectura de archivos (js/xlsx.js).", "error"); return; }
    var filas = root.HuevosXLSX.leerCSV(texto);
    iniciarImportacionDesdeFilas(filas, nombreArchivo || "datos pegados");
  }

  function iniciarImportacionDesdeFilas(filas, nombreArchivo) {
    filas = (filas || []).filter(function (f) {
      return f && f.some(function (x) { return String(x == null ? "" : x).trim() !== ""; });
    });
    if (!filas.length) { toast("El archivo no contiene filas con datos.", "error"); return; }
    var encabezados = (filas[0] || []).map(function (h, i) {
      var t = String(h == null ? "" : h).trim();
      return t || ("Columna " + (i + 1));
    });
    ui.importacion = {
      archivo: nombreArchivo,
      filas: filas,
      encabezados: encabezados,
      tieneEncabezados: true,
      mapeo: C.detectarMapeo(encabezados),
      opciones: {
        comunaPorDefecto: "",
        diaPorDefecto: DB.state.config.diaRepartoPorDefecto,
        modoExistentes: "OMITIR"
      },
      analisis: null
    };
    sheetVistaPreviaImportacion();
  }

  /** Recalcula el análisis con el mapeo actual y refresca resumen + tabla. */
  function actualizarVistaPreviaImportacion() {
    var imp = ui.importacion;
    if (!imp) { return; }
    C.CAMPOS_IMPORTACION.forEach(function (campo) {
      var sel = document.getElementById("imp-" + campo.clave);
      if (sel) { imp.mapeo[campo.clave] = Number(sel.value); }
    });
    var comuna = document.getElementById("imp-comuna");
    var dia = document.getElementById("imp-dia");
    var modo = document.getElementById("imp-modo");
    if (comuna) { imp.opciones.comunaPorDefecto = comuna.value.trim(); }
    if (dia) { imp.opciones.diaPorDefecto = dia.value; }
    if (modo) { imp.opciones.modoExistentes = modo.value; }

    imp.analisis = C.analizarImportacion(DB.state, imp.filas, {
      mapeo: imp.mapeo,
      tieneEncabezados: imp.tieneEncabezados,
      comunaPorDefecto: imp.opciones.comunaPorDefecto,
      diaPorDefecto: imp.opciones.diaPorDefecto,
      modoExistentes: imp.opciones.modoExistentes
    });

    var contResumen = document.getElementById("imp-resumen");
    if (contResumen) { contResumen.innerHTML = resumenImportacionHtml(imp); }
    var contPrevia = document.getElementById("imp-preview");
    if (contPrevia) { contPrevia.innerHTML = tablaPreviaImportacionHtml(imp); }

    var btn = document.querySelector('#sheet-root [data-action="confirmar-importacion"]');
    if (btn) {
      var n = imp.analisis.resumen.importables;
      btn.textContent = n ? ("Importar " + n + " cliente" + (n === 1 ? "" : "s")) : "Sin clientes para importar";
      btn.disabled = !n;
    }
  }

  function avisosImportacionHtml(imp) {
    var analisis = imp.analisis;
    var avisos = [];
    if (Number(analisis.mapeo.nombre) < 0) {
      avisos.push("Falta indicar la columna del <strong>Nombre</strong>: sin ella no se puede importar.");
    }
    if (Number(analisis.mapeo.calle) < 0 && Number(analisis.mapeo.comuna) < 0 && !imp.opciones.comunaPorDefecto) {
      avisos.push("No se detectó dirección ni comuna. Puedes indicar una <strong>comuna por defecto</strong> en “Revisar o corregir las columnas”.");
    }

  function descargarBinario(nombre, bytes, tipoMime) {
    try {
      var blob = new Blob([bytes], { type: tipoMime || "application/octet-stream" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = nombre;
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        if (a.parentNode) { a.parentNode.removeChild(a); }
        URL.revokeObjectURL(url);
      }, 1500);
      return true;
    } catch (e) {
      return false;
    }
  }

  /** Prepara un documento y abre el diálogo de impresión del teléfono. */
  function imprimirDocumento(titulo, sub, cuerpoHtml) {
    var zona = document.getElementById("zona-impresion");
    if (!zona) { toast("No se encontró el área de impresión.", "error"); return; }
    zona.innerHTML = '<div class="hoja-impresion"><h1>' + esc(titulo) + '</h1>' +
      (sub ? '<div class="sub">' + sub + '</div>' : "") + cuerpoHtml + '</div>';
    document.body.classList.add("imprimiendo");
    var limpiar = function () {
      document.body.classList.remove("imprimiendo");
      zona.innerHTML = "";
      window.removeEventListener("afterprint", limpiar);
    };
    // El documento se limpia al cerrarse el diálogo de impresión (afterprint) o
    // al cambiar de pantalla. No se limpia antes para no arriesgar una página
    // en blanco en los navegadores que imprimen de forma asíncrona.
    window.addEventListener("afterprint", limpiar);
    setTimeout(function () {
      try { window.print(); } catch (e) { toast("No se pudo abrir la impresión: " + e.message, "error"); }
    }, 80);
    setTimeout(limpiar, 300000);   // seguridad: 5 minutos
  }

  function limpiarImpresion() {
    var zona = document.getElementById("zona-impresion");
    if (zona) { zona.innerHTML = ""; }
    document.body.classList.remove("imprimiendo");
  }

  /**
   * Columnas de la hoja impresa, con anchos en porcentaje que suman 100 para
   * que la tabla calce exactamente en el ancho útil de una hoja tamaño carta
   * (216 mm menos los márgenes). Si todos los pedidos de la semana tienen el
   * mismo precio no se imprime la columna de precio unitario: ese ancho se
   * pasa a la dirección, que es la columna que más se alarga.
   */
  function columnasInforme(incluirUtilidad, precioUnico) {
    var cols = [
      { clave: "numero", titulo: "N°", peso: 5 },
      { clave: "cliente", titulo: "Cliente", peso: 20 },
      { clave: "direccion", titulo: "Dirección", peso: 34 },
      { clave: "telefono", titulo: "Teléfono", peso: 11 },
      { clave: "bandejas", titulo: "Bandejas", peso: 8, clase: "num" }
    ];
    if (!precioUnico) {
      cols[1].peso = 18; cols[2].peso = 29; cols[3].peso = 10; cols[4].peso = 7;
      cols.push({ clave: "unitario", titulo: "P. unit.", peso: 10, clase: "num" });
    }
    cols.push({ clave: "total", titulo: "Total", peso: incluirUtilidad ? 10 : 13, clase: "num" });
    if (incluirUtilidad) {
      cols[3].peso = 9; cols[2].peso = 25; cols[1].peso = 16; cols[4].peso = 7;
      cols.push({ clave: "costo", titulo: "Costo", peso: 8, clase: "num" });
      cols.push({ clave: "utilidad", titulo: "Utilidad", peso: 9, clase: "num" });
      cols[cols.length - 1].peso = 9;
    }
    cols.push({ clave: "entrega", titulo: "Entrega", peso: 7 });
    // Ajuste fino: el último ancho absorbe la diferencia para sumar 100 exacto
    var suma = cols.reduce(function (a, c) { return a + c.peso; }, 0);
    cols[cols.length - 1].peso += (100 - suma);
    return cols;
  }

  /** Tabla de una comuna, con subtotal al pie de esa comuna. */
  function tablaPedidosImpresionHtml(grupo, incluirUtilidad, precioUnico) {
    var cols = columnasInforme(incluirUtilidad, precioUnico);
    var indiceBandejas = 0;
    cols.forEach(function (c, i) { if (c.clave === "bandejas") { indiceBandejas = i; } });

    var html = '<table>' +
      '<colgroup>' + cols.map(function (c) { return '<col style="width:' + c.peso + '%">'; }).join("") + '</colgroup>' +
      '<thead><tr>' + cols.map(function (c) {
        return '<th class="' + (c.clase || "") + '">' + esc(c.titulo) + '</th>';
      }).join("") + '</tr></thead><tbody>';

    grupo.filas.forEach(function (f) {
      var valores = {
        numero: String(f.numero),
        cliente: esc(C.nombreCompleto(f.cliente)),
        direccion: esc(C.direccionCompleta(f.cliente)),
        telefono: esc(f.cliente.telefono || ""),
        bandejas: String(f.pedido.bandejas),
        unitario: C.formatCLP(f.pedido.valorUnitario),
        total: C.formatCLP(f.pedido.total),
        costo: C.formatCLP(C.costoDePedido(DB.state, f.pedido) * f.pedido.bandejas),
        utilidad: f.utilidad == null ? "" : C.formatCLP(f.utilidad),
        entrega: '<span class="casilla"></span>'
      };
      html += '<tr>' + cols.map(function (c) {
        return '<td class="' + (c.clase || "") + '">' + valores[c.clave] + '</td>';
      }).join("") + '</tr>';
    });

    var subtotales = {
      bandejas: String(grupo.bandejas),
      unitario: "",
      total: C.formatCLP(grupo.venta),
      costo: "",
      utilidad: C.formatCLP(grupo.utilidad),
      entrega: ""
    };
    html += '</tbody><tfoot><tr>' +
      '<td colspan="' + indiceBandejas + '">Subtotal ' + esc(grupo.comuna) + '</td>' +
      cols.slice(indiceBandejas).map(function (c) {
        return '<td class="' + (c.clase || "") + '">' + (subtotales[c.clave] || "") + '</td>';
      }).join("") +
      '</tr></tfoot></table>';
    return html;
  }

  /* ======================================================================== */
  /* 7d. Sincronización entre dispositivos (computador ⇄ celular)             */
  /* ======================================================================== */

  var estadoSync = { corriendo: false, silenciando: false, programado: null, optimizando: false };

  function syncDisponible() { return !!(root.HuevosSync && root.HuevosSync.sincronizar); }

  function haceCuanto(isoStr) {
    var minutos = Math.floor((Date.now() - new Date(isoStr).getTime()) / 60000);
    if (minutos < 1) { return "hace un momento"; }
    if (minutos < 60) { return "hace " + minutos + " min"; }
    var horas = Math.floor(minutos / 60);
    if (horas < 24) { return "hace " + horas + " h"; }
    var dias = Math.floor(horas / 24);
    return "hace " + dias + (dias === 1 ? " día" : " días");
  }

  function textoSync() {
    var meta = DB.meta || {};
    if (!meta.activa) { return "Sincronización desactivada"; }
    if (!meta.ultimaSync) { return "Sin sincronizar todavía"; }
    return "Sincronizado " + haceCuanto(meta.ultimaSync) +
      (meta.dispositivo && meta.dispositivo.nombre ? " · este dispositivo: " + meta.dispositivo.nombre : "");
  }

  function estadoSyncDetalle() {
    var meta = DB.meta || {};
    if (!meta.activa) { return { clase: "", texto: "Desactivada", detalle: "Los datos sólo están en este dispositivo." }; }
    if (estadoSync.corriendo) { return { clase: "azul", texto: "Sincronizando…", detalle: "" }; }
    if (meta.ultimoResultado && meta.pendiente) {
      return { clase: "rojo", texto: "Pendiente de sincronizar", detalle: meta.ultimoResultado };
    }
    return { clase: "verde", texto: textoSync(), detalle: "" };
  }

  /** Tarjeta de estado que se muestra en Inicio y en Configuración. */
  function cajaSyncHtml(compacta) {
    var meta = DB.meta || {};
    var e = estadoSyncDetalle();
    var html = '<div class="tarjeta">' +
      '<div class="tarjeta-titulo">🔄 Sincronización ' + (e.clase ? '<span class="badge ' + e.clase + '">' + esc(e.texto) + '</span>' : '<span class="badge">' + esc(e.texto) + '</span>') + '</div>' +
      '<div class="tarjeta-cuerpo">' +
        (e.detalle ? '<div class="chico rojo mb">' + esc(e.detalle) + '</div>' : "") +
        (meta.activa && meta.ultimaSync ? '<div class="chico muted">Última sincronización: ' + esc(textoSync()) + '</div>' : "") +
        (meta.activa ? "" : '<div class="chico muted">Conecta este dispositivo con el otro para que la información se mantenga igual en ambos.</div>') +
      '</div>' +
      '<div class="tarjeta-pie">' +
        '<div class="acciones-fila">' +
          (meta.activa
            ? '<button class="btn primario" data-action="sincronizar-ahora">🔄 Sincronizar ahora</button>'
            : '<button class="btn primario" data-action="abrir-sincronizacion">🔗 Configurar</button>') +
          '<button class="btn borde" data-action="abrir-sincronizacion">⚙️ ' + (meta.activa ? "Ajustes" : "Ver ajustes") + '</button>' +
        '</div>' +
        (compacta ? "" : "") +
      '</div>' +
    '</div>';

  /** Configuración de la sincronización en este dispositivo. */
  function sheetSincronizacion() {

    var tieneConfig = !!(meta.gistId && meta.clave);
    var codigo = tieneConfig ? root.HuevosSync.codigoDeSincronizacion(meta.gistId, meta.clave) : "";
    var opcionesDispositivo = DB.DISPOSITIVOS.map(function (d) {
      var elegido = (meta.dispositivo && meta.dispositivo.nombre) === d;

    var html =
      '<div class="aviso-info mb">Tus datos viajan <strong>cifrados</strong> a un archivo privado de tu cuenta de GitHub. ' +

      '<label class="etiqueta">Este dispositivo es</label>' +
